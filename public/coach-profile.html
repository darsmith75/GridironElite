<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coach Profile</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .team-banner {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      border-radius: 14px;
      color: #fff;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .team-banner .team-icon {
      font-size: 40px;
      line-height: 1;
      flex-shrink: 0;
      width: 54px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.16);
    }

    .team-banner .team-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 8px;
      background: #fff;
      padding: 4px;
      box-sizing: border-box;
    }

    .team-banner .team-text { flex: 1; min-width: 0; }

    .team-banner .team-name {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .team-banner .school-name {
      font-size: 14px;
      opacity: 0.86;
    }

    .team-banner .team-location {
      font-size: 12px;
      opacity: 0.72;
      margin-top: 2px;
    }

    .coach-profile-photo-section {
      min-height: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .coach-profile-photo-section h3 {
      margin-top: 0;
    }

    @media (max-width: 768px) {
      .team-banner {
        flex-direction: column;
        text-align: center;
      }

      .team-banner .team-name {
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard-wrapper">
    <header class="dashboard-header">
      <div class="header-content">
        <div class="header-left">
          <img src="/images/GridIronLogoWhiteBG.png" alt="" class="header-logo">
        </div>
        <nav class="top-nav-menu">
          <a href="coach-dashboard.html" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V10.5z"/><path d="M9 21V13h6v8"/></svg>
            Home
          </a>
          <a href="teams.html" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            Teams
          </a>
          <a href="coach-profile.html" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-3.866 3.582-7 8-7s8 3.134 8 7"/></svg>
            My Profile
          </a>
          <a href="#" onclick="logout(); return false;" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sign out
          </a>
        </nav>
      </div>
    </header>

    <div class="dashboard-container">
      <div id="teamBadge" class="team-banner" style="display:none;">
        <div class="team-icon" id="teamIconWrap">🏈</div>
        <div class="team-text">
          <div class="team-name" id="teamNameDisplay"></div>
          <div class="school-name" id="schoolNameDisplay"></div>
          <div class="team-location" id="teamLocationDisplay"></div>
        </div>
      </div>

      <div class="profile-page-container">
        <div class="profile-section">
          <h2 class="section-title-small">COACH PROFILE</h2>

          <form id="coachProfileForm">
            <div class="form-grid">
              <div class="form-section">
                <h3>Personal Information</h3>
                <label>Full Name:</label>
                <input type="text" id="coachFullName" placeholder="Full Name" required>

                <label>Email:</label>
                <input type="email" id="coachEmail" placeholder="Email" disabled>

                <label>Phone:</label>
                <input type="tel" id="coachPhone" placeholder="Phone Number">
              </div>

              <div class="form-section">
                <h3>Team Information</h3>
                <label>Team Name:</label>
                <input type="text" id="coachTeamName" placeholder="Team Name" required>

                <label>School Name:</label>
                <input type="text" id="coachSchoolName" placeholder="School Name">

                <label>City:</label>
                <input type="text" id="coachCity" placeholder="City">

                <label>State:</label>
                <input type="text" id="coachState" placeholder="State (e.g. TX)" maxlength="2">
              </div>

              <div class="form-section coach-profile-photo-section">
                <h3>Profile Photo</h3>
                <img id="coachProfilePicture" src="/images/silhouette-avatar.svg" alt="Profile Picture" style="width: 100px; height: 100px; object-fit: cover; border-radius: 50%; border: 2px solid #c7d0da; margin-bottom: 10px;">
                <input type="file" id="coachProfilePictureInput" accept="image/*">
              </div>
            </div>

            <button type="submit" class="submit-btn">Save Profile</button>
          </form>
        </div>

        <div class="profile-section">
          <h2 class="section-title-small">CHANGE PASSWORD</h2>

          <form id="changePasswordForm">
            <div class="form-grid">
              <div class="form-section">
                <label>Current Password:</label>
                <input type="password" id="currentPassword" placeholder="Current Password" required>

                <label>New Password:</label>
                <input type="password" id="newPassword" placeholder="New Password" required>

                <label>Confirm New Password:</label>
                <input type="password" id="confirmPassword" placeholder="Confirm New Password" required>
              </div>
            </div>

            <button type="submit" class="submit-btn">Update Password</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    checkAuth('coach');
    
    function escHtml(str) {
      if (str == null) return '';
      const div = document.createElement('div');
      div.textContent = String(str);
      return div.innerHTML;
    }
    
    const DEFAULT_BANNER_START_COLOR = '#1e3c72';
    const DEFAULT_BANNER_END_COLOR = '#2a5298';
    const coachIdQueryParam = new URLSearchParams(window.location.search).get('coachId') || new URLSearchParams(window.location.search).get('id');

    const US_STATE_CODES = new Set([
      'AL','AK','AZ','AR','CA','CO','CT','DE','FL','GA','HI','ID','IL','IN','IA','KS','KY','LA','ME','MD',
      'MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ','NM','NY','NC','ND','OH','OK','OR','PA','RI','SC',
      'SD','TN','TX','UT','VT','VA','WA','WV','WI','WY','DC'
    ]);

    const DEFAULT_PROFILE_AVATAR = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" fill="%23eef2f7"/><circle cx="60" cy="45" r="23" fill="%2394a3b8"/><path d="M18 108c4-23 20-35 42-35s38 12 42 35" fill="%2394a3b8"/></svg>';

    function normalizeState(value) {
      const raw = String(value || '').trim().toUpperCase();
      return US_STATE_CODES.has(raw) ? raw : '';
    }

    function setCoachProfileImage(src) {
      const img = document.getElementById('coachProfilePicture');
      if (!img) return;
      img.onerror = function () {
        img.onerror = null;
        img.src = DEFAULT_PROFILE_AVATAR;
      };
      img.src = src || DEFAULT_PROFILE_AVATAR;
    }

    function resolveCoachProfileImageSrc(value) {
      const raw = String(value || '').trim();
      if (!raw) return '';
      if (/^(https?:)?\/\//i.test(raw) || raw.startsWith('data:')) return raw;
      const slashFixed = raw.replace(/\\+/g, '/');
      const uploadsIdx = slashFixed.toLowerCase().indexOf('uploads/');
      const fromUploads = uploadsIdx >= 0 ? slashFixed.slice(uploadsIdx + 'uploads/'.length) : slashFixed;
      const normalized = fromUploads
        .replace(/^\.?\/+/, '')
        .replace(/^uploads\//i, '');
      return '/uploads/' + encodeURI(normalized);
    }

    function normalizeHexColorClient(value) {
      const raw = String(value || '').trim().toLowerCase();
      return /^#[0-9a-f]{6}$/.test(raw) ? raw : null;
    }

    function renderTeamBanner(team) {
      const badge = document.getElementById('teamBadge');
      if (!badge) return;

      const startColor = normalizeHexColorClient(team?.banner_color_start) || DEFAULT_BANNER_START_COLOR;
      const endColor = normalizeHexColorClient(team?.banner_color_end) || DEFAULT_BANNER_END_COLOR;
      if (team?.banner_image) {
        badge.style.background = `url('/uploads/${encodeURI(team.banner_image)}') center / cover no-repeat, linear-gradient(135deg, ${startColor} 0%, ${endColor} 100%)`;
      } else {
        badge.style.background = `linear-gradient(135deg, ${startColor} 0%, ${endColor} 100%)`;
      }

      document.getElementById('teamNameDisplay').textContent = team?.team_name || 'My Team';
      document.getElementById('schoolNameDisplay').textContent = team?.school_name || '';
      document.getElementById('teamLocationDisplay').textContent = [team?.city, team?.state].filter(Boolean).join(', ');

      const iconWrap = document.getElementById('teamIconWrap');
      if (iconWrap) {
        if (team?.school_logo) {
          iconWrap.innerHTML = '<img src="/uploads/' + escHtml(team.school_logo) + '" alt="School Logo">';
        } else {
          iconWrap.textContent = '🏈';
        }
      }

      badge.style.display = '';
    }

    document.getElementById('coachProfilePictureInput').addEventListener('change', function () {
      const file = this.files && this.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        setCoachProfileImage(e.target.result);
      };
      reader.readAsDataURL(file);
    });

    async function loadCoachProfile() {
      try {
        const query = coachIdQueryParam ? ('?coachId=' + encodeURIComponent(coachIdQueryParam)) : '';
        const res = await fetch('/api/coach/profile' + query);
        if (!res.ok) {
          setCoachProfileImage(DEFAULT_PROFILE_AVATAR);
          return;
        }

        const data = await res.json();
        document.getElementById('coachFullName').value = data.full_name || '';
        document.getElementById('coachEmail').value = data.email || '';
        document.getElementById('coachPhone').value = data.phone || '';
        document.getElementById('coachTeamName').value = data.team?.team_name || '';
        document.getElementById('coachSchoolName').value = data.team?.school_name || '';
        document.getElementById('coachCity').value = data.team?.city || '';
        document.getElementById('coachState').value = normalizeState(data.team?.state);
        renderTeamBanner(data.team || {});

        let photoValue = data.profile_picture || data.profilePicture || '';
        if (!photoValue && coachIdQueryParam) {
          const coachRes = await fetch('/api/coach/' + encodeURIComponent(coachIdQueryParam));
          if (coachRes.ok) {
            const coachData = await coachRes.json();
            photoValue = coachData.profile_picture || '';
          }
        }
        setCoachProfileImage(resolveCoachProfileImageSrc(photoValue));
      } catch (error) {
        console.error('Error loading coach profile:', error);
        setCoachProfileImage(DEFAULT_PROFILE_AVATAR);
      }
    }

    document.getElementById('coachProfileForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const payload = {
        fullName: document.getElementById('coachFullName').value.trim(),
        phone: document.getElementById('coachPhone').value.trim(),
        teamName: document.getElementById('coachTeamName').value.trim(),
        schoolName: document.getElementById('coachSchoolName').value.trim(),
        city: document.getElementById('coachCity').value.trim(),
        state: normalizeState(document.getElementById('coachState').value)
      };

      if (!payload.teamName) {
        alert('Team name is required.');
        return;
      }

      try {
        const profileRes = await fetch('/api/coach/profile', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!profileRes.ok) {
          const error = await profileRes.json().catch(() => null);
          alert(error?.error || 'Error updating profile');
          return;
        }

        const pictureInput = document.getElementById('coachProfilePictureInput');
        if (pictureInput.files && pictureInput.files[0]) {
          const formData = new FormData();
          formData.append('profilePicture', pictureInput.files[0]);
          const photoRes = await fetch('/api/coach/profile/photo', {
            method: 'POST',
            body: formData
          });

          if (!photoRes.ok) {
            const photoError = await photoRes.json().catch(() => null);
            alert(photoError?.error || 'Profile saved, but photo upload failed.');
            await loadCoachProfile();
            return;
          }
        }

        alert('Profile updated successfully!');
        document.getElementById('coachProfilePictureInput').value = '';
        await loadCoachProfile();
      } catch (error) {
        console.error('Error saving coach profile:', error);
        alert('Error updating profile');
      }
    });

    document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword !== confirmPassword) {
        alert('New passwords do not match!');
        return;
      }

      if (newPassword.length < 8) {
        alert('Password must be at least 8 characters long');
        return;
      }

      try {
        const res = await fetch('/api/coach/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ currentPassword, newPassword })
        });

        if (res.ok) {
          alert('Password updated successfully!');
          e.target.reset();
        } else {
          const error = await res.json().catch(() => null);
          alert(error?.error || 'Error updating password');
        }
      } catch (error) {
        console.error('Error updating password:', error);
        alert('Error updating password');
      }
    });

    loadCoachProfile();
    logPageView('coach_profile').catch(() => {});
  </script>
</body>
</html>
