<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dashboard-wrapper">
    <header class="dashboard-header">
      <div class="header-content">
        <div class="header-left">
          <img src="/images/GridIronLogoWhiteBG.png" alt="" class="header-logo">
        </div>
        <nav class="top-nav-menu">
          <a href="agent-dashboard.html" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V10.5z"/><path d="M9 21V13h6v8"/></svg>
            Home
          </a>
          <a href="teams.html" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            Teams
          </a>
          <a href="agent-profile.html" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-3.866 3.582-7 8-7s8 3.134 8 7"/></svg>
            My Profile
          </a>
          <a href="#" onclick="logout(); return false;" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sign out
          </a>
        </nav>
      </div>
    </header>

    <div class="dashboard-container">

    <div class="filters">
      <!-- Quick Search Bar with Filters Button -->
      <div class="agent-controls-wrap">
        <div class="agent-controls-row">
          <div class="filter-group" style="flex: 1;">
            <div class="search-input-wrapper">
              <span class="search-icon">🔍</span>
              <input type="text" id="quickSearch" class="search-input-with-icon" placeholder="Search by name, school, or position...">
            </div>
          </div>
          <button class="favorites-filter-btn" id="favoritesFilterBtn" onclick="toggleFavoritesFilter()">
            <span id="favoritesFilterIcon">☆</span> Favorites
          </button>
          <button onclick="toggleAdvancedFilters()" class="filters-toggle-btn" id="filtersToggleBtn">
            <span>Filters</span>
            <span id="filterIcon">▼</span>
          </button>
          <div class="view-toggle" id="viewToggle">
            <button class="view-toggle-btn active" data-view="grid" title="Card View">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            </button>
            <button class="view-toggle-btn" data-view="list" title="List View">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            </button>
          </div>
          <select id="sortSelect" class="agent-sort-select" onchange="loadPlayers()">
            <option value="">Sort: Default</option>
            <option value="name_asc">Name A→Z</option>
            <option value="name_desc">Name Z→A</option>
            <option value="grad_year_asc">Grad Year ↑</option>
            <option value="grad_year_desc">Grad Year ↓</option>
            <option value="gpa_desc">GPA High→Low</option>
            <option value="gpa_asc">GPA Low→High</option>
            <option value="forty_asc">40-Yard Fastest</option>
            <option value="forty_desc">40-Yard Slowest</option>
            <option value="height_desc">Height Tallest</option>
            <option value="weight_desc">Weight Heaviest</option>
            <option value="vertical_desc">Vertical Highest</option>
          </select>
        </div>
      </div>
      
      <!-- Advanced Filters Section -->
      <div id="advancedFilters" style="display: none;">
        <h3 style="color: #333; font-size: 16px; margin-bottom: 15px; font-weight: 600;">Advanced Filters</h3>
        <div class="filter-grid">
        <div class="filter-group">
          <label>Position</label>
          <select id="filterPosition">
            <option value="">All Positions</option>
            <option value="QB">Quarterback (QB)</option>
            <option value="RB">Running Back (RB)</option>
            <option value="WR">Wide Receiver (WR)</option>
            <option value="TE">Tight End (TE)</option>
            <option value="OL">Offensive Line (OL)</option>
            <option value="OT">Tackle (OT)</option>
            <option value="OG">Guard (OG)</option>
            <option value="C">Center (C)</option>
            <option value="DL">Defensive Line (DL)</option>
            <option value="EDGE">EDGE (EDGE)</option>
            <option value="LB">Linebacker (LB)</option>
            <option value="CB">Cornerback (CB)</option>
            <option value="S">Safety (S)</option>
            <option value="K">Kicker (K)</option>
          </select>
        </div>
        
        <div class="filter-group">
          <label>Grad Year</label>
          <input type="number" id="filterYear" placeholder="2025">
        </div>
        
        <div class="filter-group">
          <label>Min GPA</label>
          <input type="number" step="0.1" id="filterGpa" placeholder="3.0" min="0" max="4.0">
        </div>
        
        <div class="filter-group">
          <label>Max 40-Yard</label>
          <input type="number" step="0.01" id="filterForty" placeholder="4.5">
        </div>
        
        <div class="filter-group">
          <label>Min Height</label>
          <input type="text" id="filterHeight" placeholder="74 or 6'2">
        </div>
        
        <div class="filter-group">
          <label>Min Weight</label>
          <input type="number" id="filterWeight" placeholder="180">
        </div>
        
        <div class="filter-group">
          <label>Min Vertical</label>
          <input type="number" step="0.5" id="filterVertical" placeholder="30">
        </div>
        
        <div class="filter-group">
          <label>Min Bench</label>
          <input type="number" id="filterBench" placeholder="225">
        </div>
        
        <div class="filter-group">
          <label>Min Squat</label>
          <input type="number" id="filterSquat" placeholder="315">
        </div>
        
        <div class="filter-group">
          <label>Max Shuttle</label>
          <input type="number" step="0.01" id="filterShuttle" placeholder="4.2">
        </div>
        
        <div class="filter-group">
          <label>Max L-Drill</label>
          <input type="number" step="0.01" id="filterLDrill" placeholder="7.0">
        </div>
        
        <div class="filter-group">
          <label>Min Broad Jump</label>
          <input type="number" id="filterBroadJump" placeholder="110">
        </div>
      </div>
      
      <div class="filter-actions">
        <div style="display: flex; gap: 10px;">
          <button onclick="clearFilters()" class="clear-btn">
            <span>Reset</span>
          </button>
        </div>
      </div>
      </div>
      <!-- End Advanced Filters -->
      
      <div class="agent-results-row">
        <span id="lastUpdate" class="last-update"></span>
        <div class="results-count" id="resultsCount" aria-live="polite"></div>
      </div>
    </div>

    <div class="ad-slot ad-slot-leaderboard" data-ad-slot="agent_dashboard_leaderboard" aria-label="Sponsored advertisement space">
      Sponsored Space 728 x 90
    </div>

    <div id="playersList"></div>
    <div id="pagination"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const VIEW_MODE_STORAGE_KEY = 'agentDashboardViewMode';
    let viewMode = getDefaultViewMode();
    let loadPlayersDebounceTimer = null;
    
    initDashboard();

    async function initDashboard() {
      // Try to authenticate (optional)
      const user = await tryAuth();
      
      // Apply appropriate nav (with or without login button)
      if (user) {
        applyRoleBasedTopNav(user);
      } else {
        applyPublicTopNav();
        const favoritesFilterBtn = document.getElementById('favoritesFilterBtn');
        if (favoritesFilterBtn) favoritesFilterBtn.style.display = 'none';
      }
      
      await applyManagedAdSlots(document);
      logPageView('agent_dashboard');
      
      // Setup view toggle buttons
      setupViewToggle();
      
      loadPlayers();

      // If user has never chosen a view, adapt when viewport crosses mobile/desktop.
      window.addEventListener('resize', handleResponsiveViewResize);
    }

    function isMobileViewport() {
      return window.matchMedia('(max-width: 768px)').matches;
    }

    function getDefaultViewMode() {
      const saved = localStorage.getItem(VIEW_MODE_STORAGE_KEY);
      if (saved === 'grid' || saved === 'list') return saved;
      return isMobileViewport() ? 'list' : 'grid';
    }

    function updateViewToggleButtons() {
      const toggleButtons = document.querySelectorAll('.view-toggle-btn');
      toggleButtons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === viewMode);
      });
    }

    function handleResponsiveViewResize() {
      const hasSavedPreference = !!localStorage.getItem(VIEW_MODE_STORAGE_KEY);
      if (hasSavedPreference) return;
      const preferredMode = isMobileViewport() ? 'list' : 'grid';
      if (viewMode === preferredMode) return;
      viewMode = preferredMode;
      updateViewToggleButtons();
      if (Array.isArray(window._allPlayers)) {
        renderPage(window._currentPage || 1);
      }
    }
    
    function setupViewToggle() {
      const toggleButtons = document.querySelectorAll('.view-toggle-btn');
      toggleButtons.forEach(btn => {
        btn.addEventListener('click', function() {
          const newView = this.dataset.view;
          if (viewMode !== newView) {
            viewMode = newView;
            localStorage.setItem(VIEW_MODE_STORAGE_KEY, viewMode);
            updateViewToggleButtons();
            
            // Re-render with new view mode
            renderPage(window._currentPage || 1);
          }
        });
      });

      // Set initial button state
      updateViewToggleButtons();
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function scheduleLoadPlayers(page = 1, debounceMs = 220) {
      if (loadPlayersDebounceTimer) {
        clearTimeout(loadPlayersDebounceTimer);
      }
      loadPlayersDebounceTimer = setTimeout(() => {
        loadPlayersDebounceTimer = null;
        loadPlayers(page);
      }, debounceMs);
    }

    function renderPlayersSkeleton() {
      const list = document.getElementById('playersList');
      if (!list) return;

      if (viewMode === 'grid') {
        list.innerHTML = '<div class="players-grid skeleton-grid">' + Array.from({ length: 8 }).map(() => `
          <div class="player-card-compact skeleton-card" aria-hidden="true">
            <div class="player-card-header skeleton-shimmer"></div>
            <div class="player-card-body">
              <div class="skeleton-line skeleton-line-title skeleton-shimmer"></div>
              <div class="skeleton-line skeleton-shimmer"></div>
              <div class="skeleton-line skeleton-shimmer"></div>
              <div class="skeleton-stats-row">
                <div class="skeleton-chip skeleton-shimmer"></div>
                <div class="skeleton-chip skeleton-shimmer"></div>
                <div class="skeleton-chip skeleton-shimmer"></div>
              </div>
            </div>
          </div>
        `).join('') + '</div>';
      } else {
        list.innerHTML = '<div class="players-list">' + Array.from({ length: 8 }).map(() => `
          <div class="player-list-row skeleton-list-row" aria-hidden="true">
            <div class="player-list-photo skeleton-circle skeleton-shimmer"></div>
            <div class="player-list-info">
              <div class="skeleton-line skeleton-line-title skeleton-shimmer"></div>
              <div class="skeleton-line skeleton-shimmer"></div>
            </div>
            <div class="player-list-stats">
              <div class="skeleton-chip skeleton-shimmer"></div>
              <div class="skeleton-chip skeleton-shimmer"></div>
              <div class="skeleton-chip skeleton-shimmer"></div>
            </div>
          </div>
        `).join('') + '</div>';
      }
    }

    function getActiveFilterSummary() {
      const chips = [];
      const position = document.getElementById('filterPosition').value;
      const year = document.getElementById('filterYear').value;
      const gpa = document.getElementById('filterGpa').value;
      const quickSearch = document.getElementById('quickSearch').value.trim();
      const favoritesOnly = document.getElementById('favoritesFilterBtn').classList.contains('active');

      if (quickSearch) chips.push(`Search: "${escapeHtml(quickSearch)}"`);
      if (position) chips.push(`Position: ${escapeHtml(position)}`);
      if (year) chips.push(`Class: ${escapeHtml(year)}`);
      if (gpa) chips.push(`Min GPA: ${escapeHtml(gpa)}`);
      if (favoritesOnly) chips.push('Favorites only');

      return chips;
    }

    function formatGpaDisplay(value) {
      const numeric = Number(value);
      return Number.isFinite(numeric) ? numeric.toFixed(2) : 'N/A';
    }

    function formatWeightDisplay(value) {
      const numeric = Number(value);
      return Number.isFinite(numeric) && numeric > 0 ? `${numeric} lbs` : 'N/A';
    }

    function formatFortyDisplay(value) {
      const numeric = Number(value);
      return Number.isFinite(numeric) ? `${numeric.toFixed(2)}s` : 'N/A';
    }
    
    // Toggle advanced filters
    function toggleAdvancedFilters() {
      const advancedFilters = document.getElementById('advancedFilters');
      const filterIcon = document.getElementById('filterIcon');
      const filterBtn = document.getElementById('filtersToggleBtn');
      
      if (advancedFilters.style.display === 'none') {
        advancedFilters.style.display = 'block';
        filterIcon.textContent = '▲';
        filterBtn.classList.add('active');
      } else {
        advancedFilters.style.display = 'none';
        filterIcon.textContent = '▼';
        filterBtn.classList.remove('active');
      }
    }
    
    // Toggle favorites filter
    function toggleFavoritesFilter() {
      const btn = document.getElementById('favoritesFilterBtn');
      const icon = document.getElementById('favoritesFilterIcon');
      
      if (btn.classList.contains('active')) {
        btn.classList.remove('active');
        icon.textContent = '☆';
      } else {
        btn.classList.add('active');
        icon.textContent = '⭐';
      }
      
      loadPlayers();
    }
    
    // Add auto-search functionality to quick search input
    document.getElementById('quickSearch').addEventListener('input', function() {
      scheduleLoadPlayers(1);
    });
    
    // Add auto-search when position is selected
    document.getElementById('filterPosition').addEventListener('change', function() {
      loadPlayers(1);
    });
    
    // Add auto-search to all advanced filter fields
    const advancedFilterFields = [
      'filterYear', 'filterGpa', 'filterForty',
      'filterHeight', 'filterWeight', 'filterVertical', 'filterBench',
      'filterSquat', 'filterShuttle', 'filterLDrill', 'filterBroadJump'
    ];
    
    advancedFilterFields.forEach(fieldId => {
      const field = document.getElementById(fieldId);
      if (field) {
        field.addEventListener('input', function() {
          scheduleLoadPlayers(1);
        });
      }
    });

    function clearFilters() {
      document.getElementById('quickSearch').value = '';
      document.getElementById('filterPosition').value = '';
      document.getElementById('filterYear').value = '';
      document.getElementById('filterGpa').value = '';
      document.getElementById('filterForty').value = '';
      document.getElementById('filterHeight').value = '';
      document.getElementById('filterWeight').value = '';
      document.getElementById('filterVertical').value = '';
      document.getElementById('filterBench').value = '';
      document.getElementById('filterSquat').value = '';
      document.getElementById('filterShuttle').value = '';
      document.getElementById('filterLDrill').value = '';
      document.getElementById('filterBroadJump').value = '';
      document.getElementById('sortSelect').value = '';
      loadPlayers();
    }

    const PAGE_SIZE = 20;

    async function loadPlayers(page = 1) {
      const position = document.getElementById('filterPosition').value;
      const year = document.getElementById('filterYear').value;
      const gpa = document.getElementById('filterGpa').value;
      const forty = document.getElementById('filterForty').value;
      const height = document.getElementById('filterHeight').value;
      const weight = document.getElementById('filterWeight').value;
      const vertical = document.getElementById('filterVertical').value;
      const bench = document.getElementById('filterBench').value;
      const squat = document.getElementById('filterSquat').value;
      const shuttle = document.getElementById('filterShuttle').value;
      const lDrill = document.getElementById('filterLDrill').value;
      const broadJump = document.getElementById('filterBroadJump').value;
      const quickSearch = document.getElementById('quickSearch').value.toLowerCase().trim();
      const sortBy = document.getElementById('sortSelect').value;
      const favoritesOnly = document.getElementById('favoritesFilterBtn').classList.contains('active');
      const safePage = Math.max(1, parseInt(page, 10) || 1);
      const offset = (safePage - 1) * PAGE_SIZE;

      renderPlayersSkeleton();
      document.getElementById('resultsCount').textContent = 'Loading players...';
      
      const params = new URLSearchParams();
      if (position) params.append('position', position);
      if (year) params.append('graduationYear', year);
      if (gpa) params.append('minGpa', gpa);
      if (forty) params.append('maxForty', forty);
      if (height) params.append('minHeight', height);
      if (weight) params.append('minWeight', weight);
      if (vertical) params.append('minVertical', vertical);
      if (bench) params.append('minBench', bench);
      if (squat) params.append('minSquat', squat);
      if (shuttle) params.append('maxShuttle', shuttle);
      if (lDrill) params.append('maxLDrill', lDrill);
      if (broadJump) params.append('minBroadJump', broadJump);
      if (quickSearch) params.append('quickSearch', quickSearch);
      if (sortBy) params.append('sortBy', sortBy);
      if (favoritesOnly) params.append('favoritesOnly', 'true');
      params.append('limit', String(PAGE_SIZE));
      params.append('offset', String(offset));
      
      console.log('Fetching players at:', new Date().toISOString());
      
      let players = [];
      let pagination = null;
      let favoriteIds = [];

      try {
        const res = await fetch('/api/agent/players?' + params, {
          cache: 'no-store',
          headers: {
            'Cache-Control': 'no-cache',
            'Pragma': 'no-cache'
          }
        });

        if (!res.ok) {
          throw new Error(`Failed to load players (${res.status})`);
        }

        const payload = await res.json();
        players = Array.isArray(payload) ? payload : (payload.players || []);
        pagination = Array.isArray(payload) ? null : (payload.pagination || null);

        if (window.currentUser) {
          const favoritesRes = await fetch('/api/agent/favorites');
          if (favoritesRes.ok) {
            favoriteIds = await favoritesRes.json();
          }
        }
      } catch (error) {
        console.error('Failed to load players:', error);
        document.getElementById('playersList').innerHTML = `
          <div class="no-results error-state">
            <h3>Unable to Load Players</h3>
            <p>Please try again in a moment.</p>
            <button class="clear-btn" onclick="loadPlayers(${safePage})">Retry</button>
          </div>
        `;
        document.getElementById('resultsCount').textContent = '0 players found';
        document.getElementById('pagination').innerHTML = '';
        return;
      }
      
      console.log('Loaded players:', players.length);
      
      // Update last refresh time and results count
      document.getElementById('lastUpdate').textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
      const totalPlayers = pagination ? Number(pagination.total || 0) : players.length;
      const rangeStart = totalPlayers > 0 ? offset + 1 : 0;
      const rangeEnd = totalPlayers > 0 ? Math.min(offset + players.length, totalPlayers) : 0;
      let resultsLabel = `${totalPlayers} player${totalPlayers !== 1 ? 's' : ''} found`;
      if (totalPlayers > 0) {
        resultsLabel += ` (showing ${rangeStart}-${rangeEnd})`;
      }
      document.getElementById('resultsCount').textContent = resultsLabel;

      // Store current server page and metadata for rendering/pagination controls
      window._allPlayers = players;
      window._favIds = favoriteIds;
      window._currentPage = safePage;
      window._pagination = {
        total: totalPlayers,
        limit: pagination?.limit || PAGE_SIZE,
        offset: pagination?.offset || offset,
        hasMore: !!pagination?.hasMore
      };
      renderPage(safePage);
    }

    function hasVerifiedMetric(player) {
      if (player && typeof player.has_verified_metric === 'boolean') {
        return player.has_verified_metric;
      }
      if (!player || !player.metric_videos) return false;
      try {
        const metricVideos = JSON.parse(player.metric_videos);
        return Array.isArray(metricVideos) && metricVideos.some(video => !!video?.is_verified);
      } catch (_) {
        return false;
      }
    }

    function formatHeightDisplay(heightValue) {
      const raw = String(heightValue || '').trim();
      if (!raw) return '';

      let m = raw.match(/^(\d+)\s*'\s*(\d+(?:\.\d+)?)?\s*"?$/);
      if (m) {
        const feet = Number(m[1] || '0');
        const inches = Number(m[2] || '0');
        if (!Number.isFinite(feet) || !Number.isFinite(inches)) return raw;
        const inchesText = Number.isInteger(inches) ? String(inches) : String(Number(inches.toFixed(1)));
        return `${feet}'${inchesText}"`;
      }

      m = raw.match(/^(\d+)\s*(?:ft|feet)\s*(\d+(?:\.\d+)?)?\s*(?:in|inches)?$/i);
      if (m) {
        const feet = Number(m[1] || '0');
        const inches = Number(m[2] || '0');
        if (!Number.isFinite(feet) || !Number.isFinite(inches)) return raw;
        const inchesText = Number.isInteger(inches) ? String(inches) : String(Number(inches.toFixed(1)));
        return `${feet}'${inchesText}"`;
      }

      const numeric = Number(raw);
      if (Number.isFinite(numeric) && numeric > 0) {
        const feet = Math.floor(numeric / 12);
        const inches = Number((numeric - (feet * 12)).toFixed(1));
        const inchesText = Number.isInteger(inches) ? String(inches) : String(inches);
        return `${feet}'${inchesText}"`;
      }

      return raw;
    }

    function getPlayerCardDestination(player) {
      const currentUser = window.currentUser;
      if (currentUser && currentUser.role === 'player' && Number(player.user_id) === Number(currentUser.id)) {
        return 'player-profile.html';
      }
      return `player-detail.html?id=${player.id}`;
    }

    function renderPage(page) {
      const players = window._allPlayers || [];
      const favoriteIds = window._favIds || [];
      const pagination = window._pagination || {
        total: players.length,
        limit: PAGE_SIZE,
        offset: ((window._currentPage || 1) - 1) * PAGE_SIZE,
        hasMore: false
      };
      const totalPlayers = Number(pagination.total || 0);
      const pageSize = Number(pagination.limit || PAGE_SIZE) || PAGE_SIZE;
      const totalPages = Math.max(1, Math.ceil(totalPlayers / pageSize));
      page = Math.min(Math.max(1, page), totalPages);
      window._currentPage = page;

      const list = document.getElementById('playersList');
      if (players.length === 0) {
        const activeFilters = getActiveFilterSummary();
        list.innerHTML = `
          <div class="no-results empty-state-panel">
            <h3>No Players Match These Filters</h3>
            <p>Try broadening your criteria to see more athletes.</p>
            ${activeFilters.length ? `<div class="empty-state-chips">${activeFilters.map(item => `<span class="empty-chip">${item}</span>`).join('')}</div>` : ''}
            <button class="clear-btn" onclick="clearFilters()">Reset Filters</button>
          </div>
        `;
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      const start = Number(pagination.offset || 0);
      const pageSlice = players;

      if (viewMode === 'grid') {
        // Card view
        list.innerHTML = '<div class="players-grid">' + pageSlice.map(p => {
          const isFavorite = favoriteIds.includes(p.user_id);
          const hasVerifiedBadge = hasVerifiedMetric(p);
          return `
          <div class="player-card-compact">
            <div onclick="window.location.href='${getPlayerCardDestination(p)}'" style="cursor: pointer;">
              <div class="player-card-header">
                ${p.profile_picture ? 
                  `<img src="/uploads/${p.profile_picture}" alt="${p.full_name}" class="player-card-photo" onerror="this.onerror=null;this.src='/images/silhouette-avatar.svg';">` : 
                  '<img src="/images/silhouette-avatar.svg" alt="No Photo" class="player-card-photo silhouette-photo">'}
              </div>
              <div class="player-card-body">
                <div class="player-info-section">
                  <h3>${p.full_name}</h3>
                  <p>${p.position || 'Position not set'}</p>
                  <p>${p.high_school || 'School not set'}</p>
                  <p>Class of ${p.graduation_year || 'N/A'}</p>
                </div>
                <div class="player-stats-compact">
                  <div class="stat-item">
                    <div class="stat-label">Height</div>
                    <div class="stat-value">${formatHeightDisplay(p.height) || 'N/A'}</div>
                  </div>
                  <div class="stat-item">
                    <div class="stat-label">Weight</div>
                    <div class="stat-value">${formatWeightDisplay(p.weight)}</div>
                  </div>
                  <div class="stat-item ${p.achievement ? 'stat-item-has-tooltip' : ''}" ${p.achievement ? `title="${escapeHtml(p.achievement)}"` : ''}>
                    <div class="stat-label">GPA</div>
                    <div class="stat-value">${formatGpaDisplay(p.gpa)}</div>
                  </div>
                  <div class="stat-item" title="${hasVerifiedBadge ? 'This athlete has at least one third-party verified athletic metric' : 'No third-party verified athletic metrics yet'}">
                    <div class="stat-label">Verified</div>
                    <div class="stat-value verified-athlete-tile ${hasVerifiedBadge ? '' : 'verified-athlete-tile-empty'}">
                      ${hasVerifiedBadge
                        ? '<img src="/images/logos/verified-athlete.svg" alt="Verified Athlete" class="verified-athlete-image">'
                        : 'Not Yet'}
                    </div>
                  </div>
                </div>
              </div>
            </div>
            ${window.currentUser ? `
              <button class="favorite-star-bottom ${isFavorite ? 'favorited' : ''}" 
                      onclick="event.stopPropagation(); toggleFavorite(${p.user_id}, this)"
                      title="${isFavorite ? 'Remove from favorites' : 'Add to favorites'}">
                <span class="favorite-button-icon" aria-hidden="true">${isFavorite ? '⭐' : '☆'}</span>
                <span class="favorite-button-label">${isFavorite ? 'Favorited' : 'Add to Favorites'}</span>
              </button>
            ` : ''}
          </div>
        `;
        }).join('') + '</div>';
      } else {
        // List view
        list.innerHTML = '<div class="players-list">' + pageSlice.map(p => {
          const isFavorite = favoriteIds.includes(p.user_id);
          const hasVerifiedBadge = hasVerifiedMetric(p);
          return `
          <div class="player-list-row">
            <div class="player-list-photo">
              ${p.profile_picture ? 
                `<img src="/uploads/${p.profile_picture}" alt="${p.full_name}" class="player-list-img" onerror="this.onerror=null;this.src='/images/silhouette-avatar.svg';">` : 
                '<img src="/images/silhouette-avatar.svg" alt="No Photo" class="player-list-img silhouette-photo">'}
            </div>
            <div class="player-list-info" onclick="window.location.href='${getPlayerCardDestination(p)}'" style="cursor: pointer;">
              <div class="player-list-name">${p.full_name}</div>
              <div class="player-list-details">
                <span class="detail-item">${p.position || 'Position TBD'}</span>
                <span class="detail-separator">•</span>
                <span class="detail-item">${p.high_school || 'School TBD'}</span>
                <span class="detail-separator">•</span>
                <span class="detail-item">Class of ${p.graduation_year || 'N/A'}</span>
              </div>
            </div>
            <div class="player-list-stats">
              <div class="list-stat">
                <span class="list-stat-label">HT:</span>
                <span class="list-stat-value">${formatHeightDisplay(p.height) || 'N/A'}</span>
              </div>
              <div class="list-stat">
                <span class="list-stat-label">WT:</span>
                <span class="list-stat-value">${formatWeightDisplay(p.weight)}</span>
              </div>
              <div class="list-stat">
                <span class="list-stat-label">GPA:</span>
                <span class="list-stat-value">${formatGpaDisplay(p.gpa)}</span>
              </div>
              <div class="list-stat">
                <span class="list-stat-label">40yd:</span>
                <span class="list-stat-value">${formatFortyDisplay(p.forty_yard_dash)}</span>
              </div>
              <div class="list-stat">
                <span class="list-stat-label">Verified:</span>
                <span class="list-stat-value">${hasVerifiedBadge ? '✓' : '—'}</span>
              </div>
            </div>
            <button class="list-expand-btn" 
                    onclick="event.stopPropagation(); toggleListDetails(this)"
                    aria-expanded="false"
                    title="Show more stats">More</button>
            ${window.currentUser ? `
              <button class="favorite-star-list ${isFavorite ? 'favorited' : ''}" 
                      onclick="event.stopPropagation(); toggleFavorite(${p.user_id}, this)"
                      title="${isFavorite ? 'Remove from favorites' : 'Add to favorites'}">
                ${isFavorite ? '★' : '☆'}
              </button>
            ` : ''}
          </div>
        `;
        }).join('') + '</div>';
      }

      // Pagination controls
      const pag = document.getElementById('pagination');
      if (totalPages <= 1) { pag.innerHTML = ''; return; }

      const rangeStart = start + 1;
      const rangeEnd = Math.min(start + players.length, totalPlayers);

      // Build page number buttons (show up to 7 around current)
      const pages = [];
      const delta = 2;
      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= page - delta && i <= page + delta)) {
          pages.push(i);
        }
      }
      // Insert ellipsis markers
      const items = [];
      let prev = null;
      for (const p of pages) {
        if (prev && p - prev > 1) items.push('...');
        items.push(p);
        prev = p;
      }

      pag.innerHTML = `
        <div class="pagination-bar">
          <span class="pagination-info">Showing ${rangeStart}–${rangeEnd} of ${totalPlayers}</span>
          <div class="pagination-controls">
            <button class="page-btn" onclick="goToPage(${page - 1})" ${page === 1 ? 'disabled' : ''}>← Prev</button>
            ${items.map(item => item === '...'
              ? `<span class="page-ellipsis">…</span>`
              : `<button class="page-btn ${item === page ? 'active' : ''}" onclick="goToPage(${item})">${item}</button>`
            ).join('')}
            <button class="page-btn" onclick="goToPage(${page + 1})" ${page === totalPages ? 'disabled' : ''}>Next →</button>
          </div>
        </div>`;
    }

    function goToPage(page) {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      loadPlayers(page);
    }

    function toggleListDetails(button) {
      const row = button.closest('.player-list-row');
      if (!row) return;
      const isExpanded = row.classList.toggle('expanded');
      button.textContent = isExpanded ? 'Less' : 'More';
      button.setAttribute('aria-expanded', isExpanded ? 'true' : 'false');
      button.title = isExpanded ? 'Show fewer stats' : 'Show more stats';
    }
    
    async function toggleFavorite(playerId, button) {
      if (!window.currentUser) {
        return;
      }
      const isFavorite = button.classList.contains('favorited');
      const isListFavoriteButton = button.classList.contains('favorite-star-list');
      
      try {
        if (isFavorite) {
          await fetch(`/api/agent/favorites/${playerId}`, { method: 'DELETE' });
          button.classList.remove('favorited');
          if (isListFavoriteButton) {
            button.textContent = '☆';
          } else {
            button.innerHTML = '<span class="favorite-button-icon" aria-hidden="true">☆</span><span class="favorite-button-label">Add to Favorites</span>';
          }
          button.title = 'Add to favorites';
        } else {
          await fetch(`/api/agent/favorites/${playerId}`, { method: 'POST' });
          button.classList.add('favorited');
          if (isListFavoriteButton) {
            button.textContent = '★';
          } else {
            button.innerHTML = '<span class="favorite-button-icon" aria-hidden="true">⭐</span><span class="favorite-button-label">Favorited</span>';
          }
          button.title = 'Remove from favorites';
        }
        
        // Reload if showing favorites only
        if (document.getElementById('favoritesFilterBtn').classList.contains('active')) {
          loadPlayers();
        }
      } catch (error) {
        console.error('Error toggling favorite:', error);
        alert('Failed to update favorite');
      }
    }
  </script>
</body>
</html>
