<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Page - Gridiron Athletes</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .team-page-wrap {
      max-width: 1180px;
      margin: 0 auto;
    }
    .team-hero {
      border-radius: 18px;
      padding: 28px;
      color: #fff;
      display: flex;
      gap: 22px;
      align-items: center;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      box-shadow: 0 14px 34px rgba(18, 42, 84, 0.18);
    }
    .team-hero-logo {
      width: 104px;
      height: 104px;
      border-radius: 18px;
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,0.28), inset 0 0 0 1px rgba(255,255,255,0.14);
    }
    .team-hero-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: rgba(255,255,255,0.94);
      padding: 10px;
    }
    .team-hero-logo-placeholder {
      font-size: 46px;
    }
    .team-hero-content {
      flex: 1;
      min-width: 0;
    }
    .team-hero-title {
      margin: 0;
      font-size: 36px;
      font-weight: 800;
      line-height: 1.1;
      color: #ffffff;
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000,
         0 2px 6px rgba(0, 0, 0, 0.45);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .team-hero-school {
      margin-top: 6px;
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      opacity: 0.95;
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000,
         0 2px 6px rgba(0, 0, 0, 0.45);
    }
    .team-hero-meta {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .team-hero-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(0,0,0,0.42);
      border: 1px solid rgba(255,255,255,0.34);
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000,
         0 2px 6px rgba(0, 0, 0, 0.45);
    }
    .team-hero-pill-link {
      color: #ffffff;
      text-decoration: none;
      transition: background-color 0.2s, border-color 0.2s;
    }
    .team-hero-pill-link:hover {
      background: rgba(255,255,255,0.24);
      border-color: rgba(255,255,255,0.35);
    }
    .team-hero-logo-link {
      display: inline-flex;
      text-decoration: none;
    }
    .team-hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }
    .hero-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(255,255,255,0.96);
      color: #1e3c72;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }
    .hero-link-btn:hover {
      background: #fff;
    }
    .team-overview-card {
      margin-top: 20px;
      background: #fff;
      border: 1px solid #dde6f0;
      border-radius: 16px;
      padding: 22px 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    }
    .team-overview-card h2 {
      margin: 0 0 10px;
      font-size: 18px;
      color: #1e3c72;
    }
    .team-overview-card p {
      margin: 0;
      color: #425066;
      line-height: 1.7;
      white-space: pre-wrap;
    }
    .team-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 22px 0 18px;
    }
    .team-tab {
      border: 1px solid #c9d5e5;
      background: #fff;
      color: #425066;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .team-tab.active {
      background: #1e3c72;
      color: #fff;
      border-color: #1e3c72;
    }
    .team-tab:hover {
      background: #1e3c72;
      color: #fff;
      border-color: #1e3c72;
    }
    .team-tab-panel.hidden {
      display: none;
    }
    .team-panel-card {
      background: #fff;
      border: 1px solid #dde6f0;
      border-radius: 16px;
      padding: 22px 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    }
    .team-panel-title {
      margin: 0 0 16px;
      color: #1e3c72;
      font-size: 18px;
    }
    .team-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .team-panel-header .team-panel-title {
      margin: 0;
    }
    .team-roster-filters {
      margin-bottom: 16px;
      padding: 14px;
      border: 1px solid #dde6f0;
      border-radius: 12px;
      background: #f9fbff;
    }
    .team-roster-filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      align-items: end;
    }
    .team-roster-filter-field label {
      display: block;
      font-size: 12px;
      color: #5d6f8b;
      font-weight: 700;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .team-roster-filter-field select,
    .team-roster-filter-field input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #c7d0da;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      color: #333;
      background: #fff;
      box-sizing: border-box;
    }
    .team-roster-filter-actions {
      display: flex;
      justify-content: flex-end;
    }
    .team-roster-clear-btn {
      padding: 9px 12px;
      border: 1px solid #c7d0da;
      border-radius: 8px;
      background: #ffffff;
      color: #334155;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .team-roster-clear-btn:hover {
      background: #f3f6fb;
    }
    .team-empty-state {
      text-align: center;
      padding: 44px 20px;
      color: #76849b;
    }
    .team-empty-state strong {
      color: #425066;
      display: block;
      margin-bottom: 6px;
      font-size: 16px;
    }
    .team-roster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 320px));
      justify-content: start;
      gap: 22px;
    }
    .team-roster-grid .player-card-compact {
      width: 100%;
      max-width: 320px;
    }
    .team-roster-list .player-list-row {
      cursor: pointer;
    }
    .team-roster-list .player-list-stats {
      margin-left: auto;
    }
    .team-card-actions {
      display: flex;
      justify-content: center;
      align-items: center;
      align-self: stretch;
      width: 100%;
      height: 48px;
      padding: 0 12px;
      box-sizing: border-box;
      margin: 0;
      background: #d3deef;
      border-top: 1px solid #b7c6db;
      border-radius: 0;
      flex-shrink: 0;
    }
    .team-card-view-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 32px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid #b7c6db;
      background: #e4eaf4;
      color: #1f3c68;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      transition: all 0.2s ease;
    }
    .team-card-view-btn:hover {
      background: #d8e2f2;
      border-color: #9eb3d1;
    }
    .team-list-view-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 32px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid #b7c6db;
      background: #eef3f9;
      color: #1f3c68;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .team-list-view-btn:hover {
      background: #e1ebf7;
      border-color: #9eb3d1;
    }
    .use-banner-gradient-cards .team-roster-grid .player-card-header {
      background: linear-gradient(135deg, var(--coach-banner-start, #1e3c72) 0%, var(--coach-banner-end, #2a5298) 100%);
    }
    .team-schedule-list,
    .team-staff-grid,
    .team-social-grid {
      display: grid;
      gap: 14px;
    }
    .team-schedule-item {
      border: 1px solid #e4ebf3;
      border-radius: 14px;
      padding: 16px;
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 16px;
      background: #fbfdff;
    }
    .team-schedule-date {
      border-radius: 12px;
      background: #edf3fb;
      color: #1e3c72;
      padding: 12px;
      font-weight: 700;
      text-align: center;
      align-self: start;
    }
    .team-schedule-main h3,
    .team-staff-card h3,
    .team-social-card h3 {
      margin: 0 0 6px;
      font-size: 17px;
      color: #1f2c3d;
    }
    .team-schedule-meta,
    .team-staff-meta,
    .team-social-card p {
      color: #617089;
      font-size: 14px;
      line-height: 1.6;
      margin: 0;
    }
    .team-schedule-notes,
    .team-staff-bio {
      margin-top: 10px;
      color: #425066;
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
    }
    .team-social-grid {
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    }
    .team-social-card,
    .team-staff-card {
      border: 1px solid #e4ebf3;
      border-radius: 14px;
      padding: 16px;
      background: #fbfdff;
    }
    .team-social-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .team-social-header h3 {
      margin: 0;
    }
    .team-social-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: #eaf1fb;
      color: #1e3c72;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .team-social-icon svg {
      width: 18px;
      height: 18px;
    }
    .team-social-link {
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #1e3c72;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }
    .team-social-link:hover {
      text-decoration: underline;
    }
    .team-status {
      padding: 60px 24px;
      text-align: center;
      color: #76849b;
    }
    .team-status h2 {
      color: #1e3c72;
      margin-bottom: 8px;
    }
    @media (max-width: 820px) {
      .team-hero {
        flex-direction: column;
        text-align: center;
      }
      .team-hero-title {
        font-size: 32px;
      }
      .team-hero-school {
        font-size: 22px;
      }
      .team-hero-actions,
      .team-hero-meta {
        justify-content: center;
      }
      .team-roster-grid {
        grid-template-columns: 1fr;
      }
      .team-roster-grid .player-card-compact {
        max-width: none;
      }
      .team-roster-list .player-list-row {
        flex-wrap: wrap;
        align-items: flex-start;
      }
      .team-roster-list .player-list-stats {
        margin-left: 0;
      }
      .team-schedule-item {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

    <div class="dashboard-container">
      <div class="team-page-wrap" id="teamPageRoot">
        <div class="team-status">
          <h2>Loading team page…</h2>
          <p>Please wait while we load the school details.</p>
        </div>
      </div>

  <script src="app.js"></script>
  <script>
    const teamId = new URLSearchParams(window.location.search).get('id');
    const TEAM_ROSTER_VIEW_STORAGE_KEY = 'teamDetailRosterViewMode';
    let teamPageData = null;
    let rosterViewMode = getDefaultRosterViewMode();
    const teamRosterFilters = {
      position: '',
      graduationYear: ''
    };

    function escHtml(str) {
      if (str == null) return '';
      const div = document.createElement('div');
      div.textContent = String(str);
      return div.innerHTML;
    }

    function formatDateLabel(value) {
      if (!value) return 'Date TBD';
      const raw = String(value).trim();
      const datePart = raw.includes('T') ? raw.slice(0, 10) : raw;
      const parsed = new Date(datePart + 'T12:00:00');
      if (Number.isNaN(parsed.getTime())) return escHtml(value);
      return parsed.toLocaleDateString(undefined, {
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });
    }

    function sanitizeExternalUrl(value) {
      const raw = String(value || '').trim();
      if (!raw) return '';
      try {
        const parsed = new URL(raw, window.location.origin);
        if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return '';
        return parsed.href;
      } catch (_) {
        return '';
      }
    }

    function hasVerifiedMetric(player) {
      if (!player || !player.metric_videos) return false;
      try {
        const metricVideos = JSON.parse(player.metric_videos);
        return Array.isArray(metricVideos) && metricVideos.some((video) => !!video?.is_verified);
      } catch (_) {
        return false;
      }
    }

    function formatHeightDisplay(heightValue) {
      const raw = String(heightValue || '').trim();
      if (!raw) return '';

      let m = raw.match(/^(\d+)\s*'\s*(\d+(?:\.\d+)?)?\s*"?$/);
      if (m) {
        const feet = Number(m[1] || '0');
        const inches = Number(m[2] || '0');
        if (!Number.isFinite(feet) || !Number.isFinite(inches)) return raw;
        const inchesText = Number.isInteger(inches) ? String(inches) : String(Number(inches.toFixed(1)));
        return `${feet}'${inchesText}"`;
      }

      m = raw.match(/^(\d+)\s*(?:ft|feet)\s*(\d+(?:\.\d+)?)?\s*(?:in|inches)?$/i);
      if (m) {
        const feet = Number(m[1] || '0');
        const inches = Number(m[2] || '0');
        if (!Number.isFinite(feet) || !Number.isFinite(inches)) return raw;
        const inchesText = Number.isInteger(inches) ? String(inches) : String(Number(inches.toFixed(1)));
        return `${feet}'${inchesText}"`;
      }

      const numeric = Number(raw);
      if (Number.isFinite(numeric) && numeric > 0) {
        const feet = Math.floor(numeric / 12);
        const inches = Number((numeric - (feet * 12)).toFixed(1));
        const inchesText = Number.isInteger(inches) ? String(inches) : String(inches);
        return `${feet}'${inchesText}"`;
      }

      return raw;
    }

    function viewPlayer(playerId) {
      window.location.href = 'player-detail.html?id=' + playerId;
    }

    function isMobileViewport() {
      return window.matchMedia('(max-width: 768px)').matches;
    }

    function getDefaultRosterViewMode() {
      const saved = localStorage.getItem(TEAM_ROSTER_VIEW_STORAGE_KEY);
      if (saved === 'grid' || saved === 'list') return saved;
      return isMobileViewport() ? 'list' : 'grid';
    }

    function updateRosterViewToggleButtons() {
      document.querySelectorAll('.team-roster-view-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.view === rosterViewMode);
      });
    }

    function setRosterViewMode(nextMode) {
      if (nextMode !== 'grid' && nextMode !== 'list') return;
      if (rosterViewMode === nextMode) return;
      rosterViewMode = nextMode;
      localStorage.setItem(TEAM_ROSTER_VIEW_STORAGE_KEY, rosterViewMode);
      updateRosterViewToggleButtons();
      rerenderRosterTab();
    }

    function handleRosterResponsiveResize() {
      const hasSavedPreference = !!localStorage.getItem(TEAM_ROSTER_VIEW_STORAGE_KEY);
      if (hasSavedPreference) return;
      const preferredMode = isMobileViewport() ? 'list' : 'grid';
      if (rosterViewMode === preferredMode) return;
      rosterViewMode = preferredMode;
      updateRosterViewToggleButtons();
      rerenderRosterTab();
    }

    function formatRosterPlayer(player) {
      const hasVerifiedBadge = hasVerifiedMetric(player);
      const profilePicture = player.profile_picture ? `/uploads/${encodeURI(player.profile_picture)}` : '';
      const escapedName = escHtml(player.full_name || 'Player');
      return `<div class="player-card-compact">
        <div onclick="viewPlayer(${player.user_id})" style="cursor:pointer;">
          <div class="player-card-header">
            ${profilePicture
              ? `<img src="${escHtml(profilePicture)}" alt="${escapedName}" class="player-card-photo" onerror="this.onerror=null;this.src='/images/silhouette-avatar.svg';">`
              : '<img src="/images/silhouette-avatar.svg" alt="No Photo" class="player-card-photo silhouette-photo">'}
          </div>
          <div class="player-card-body">
            <div class="player-info-section">
              <h3>${escapedName}</h3>
              <p>${escHtml(player.position || 'Position not set')}</p>
              <p>${escHtml(player.high_school || 'School not set')}</p>
              <p>Class of ${escHtml(player.graduation_year || 'N/A')}</p>
            </div>
            <div class="player-stats-compact">
              <div class="stat-item">
                <div class="stat-label">Height</div>
                <div class="stat-value">${escHtml(formatHeightDisplay(player.height) || 'N/A')}</div>
              </div>
              <div class="stat-item">
                <div class="stat-label">Weight</div>
                <div class="stat-value">${player.weight ? `${escHtml(player.weight)} lbs` : 'N/A'}</div>
              </div>
              <div class="stat-item">
                <div class="stat-label">GPA</div>
                <div class="stat-value">${escHtml(player.gpa || 'N/A')}</div>
              </div>
              <div class="stat-item" title="${hasVerifiedBadge ? 'This athlete has at least one third-party verified athletic metric' : 'No third-party verified athletic metrics yet'}">
                <div class="stat-label">Verified</div>
                <div class="stat-value verified-athlete-tile ${hasVerifiedBadge ? '' : 'verified-athlete-tile-empty'}">
                  ${hasVerifiedBadge
                    ? '<img src="/images/logos/verified-athlete.svg" alt="Verified Athlete" class="verified-athlete-image">'
                    : 'Not Yet'}
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="team-card-actions">
          <button class="team-card-view-btn" onclick="viewPlayer(${player.user_id})">View Profile</button>
        </div>
      </div>`;
    }

    function formatRosterPlayerListRow(player) {
      const hasVerifiedBadge = hasVerifiedMetric(player);
      const profilePicture = player.profile_picture ? `/uploads/${encodeURI(player.profile_picture)}` : '';
      const escapedName = escHtml(player.full_name || 'Player');
      const escapedPosition = escHtml(player.position || 'Position TBD');
      const escapedSchool = escHtml(player.high_school || 'School TBD');
      const escapedGradYear = escHtml(player.graduation_year || 'N/A');
      const escapedHeight = escHtml(formatHeightDisplay(player.height) || 'N/A');
      const escapedWeight = player.weight ? `${escHtml(player.weight)} lbs` : 'N/A';
      const escapedGpa = escHtml(player.gpa || 'N/A');
      return `<div class="player-list-row" onclick="viewPlayer(${player.user_id})">
        <div class="player-list-photo">
          ${profilePicture
            ? `<img src="${escHtml(profilePicture)}" alt="${escapedName}" class="player-list-img" onerror="this.onerror=null;this.src='/images/silhouette-avatar.svg';">`
            : '<img src="/images/silhouette-avatar.svg" alt="No Photo" class="player-list-img silhouette-photo">'}
        </div>
        <div class="player-list-info">
          <div class="player-list-name">${escapedName}</div>
          <div class="player-list-details">
            <span class="detail-item">${escapedPosition}</span>
            <span class="detail-separator">•</span>
            <span class="detail-item">${escapedSchool}</span>
            <span class="detail-separator">•</span>
            <span class="detail-item">Class of ${escapedGradYear}</span>
          </div>
        </div>
        <div class="player-list-stats">
          <div class="list-stat">
            <span class="list-stat-label">HT:</span>
            <span class="list-stat-value">${escapedHeight}</span>
          </div>
          <div class="list-stat">
            <span class="list-stat-label">WT:</span>
            <span class="list-stat-value">${escapedWeight}</span>
          </div>
          <div class="list-stat">
            <span class="list-stat-label">GPA:</span>
            <span class="list-stat-value">${escapedGpa}</span>
          </div>
          <div class="list-stat" title="${hasVerifiedBadge ? 'This athlete has at least one third-party verified athletic metric' : 'No third-party verified athletic metrics yet'}">
            <span class="list-stat-label">Verified</span>
            <span class="list-stat-value">${hasVerifiedBadge ? 'Yes' : 'No'}</span>
          </div>
        </div>
        <button class="team-list-view-btn" type="button" onclick="event.stopPropagation(); viewPlayer(${player.user_id})">View Profile</button>
      </div>`;
    }

    function renderRosterViewToggle() {
      return `<div class="view-toggle" aria-label="Roster view toggle">
        <button class="view-toggle-btn team-roster-view-btn ${rosterViewMode === 'grid' ? 'active' : ''}" type="button" data-view="grid" title="Card View" onclick="setRosterViewMode('grid')">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        </button>
        <button class="view-toggle-btn team-roster-view-btn ${rosterViewMode === 'list' ? 'active' : ''}" type="button" data-view="list" title="List View" onclick="setRosterViewMode('list')">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </button>
      </div>`;
    }

    function renderRosterFilters() {
      return `<div class="team-roster-filters">
        <div class="team-roster-filter-grid">
          <div class="team-roster-filter-field">
            <label for="teamRosterFilterPosition">Position</label>
            <select id="teamRosterFilterPosition" onchange="onTeamRosterFilterChange()">
              <option value="">All Positions</option>
              <option value="QB">Quarterback (QB)</option>
              <option value="RB">Running Back (RB)</option>
              <option value="WR">Wide Receiver (WR)</option>
              <option value="TE">Tight End (TE)</option>
              <option value="OL">Offensive Line (OL)</option>
              <option value="OT">Tackle (OT)</option>
              <option value="OG">Guard (OG)</option>
              <option value="C">Center (C)</option>
              <option value="DL">Defensive Line (DL)</option>
              <option value="EDGE">EDGE (EDGE)</option>
              <option value="LB">Linebacker (LB)</option>
              <option value="CB">Cornerback (CB)</option>
              <option value="S">Safety (S)</option>
              <option value="K">Kicker (K)</option>
            </select>
          </div>
          <div class="team-roster-filter-field">
            <label for="teamRosterFilterYear">Graduation Year</label>
            <input type="number" id="teamRosterFilterYear" placeholder="e.g. 2027" oninput="onTeamRosterFilterChange()">
          </div>
          <div class="team-roster-filter-actions">
            <button type="button" class="team-roster-clear-btn" onclick="clearTeamRosterFilters()">Clear Filters</button>
          </div>
        </div>
      </div>`;
    }

    function getFilteredRoster(roster) {
      let filtered = Array.isArray(roster) ? roster.slice() : [];
      if (teamRosterFilters.position) {
        const selected = teamRosterFilters.position.toUpperCase();
        filtered = filtered.filter((player) => String(player?.position || '').toUpperCase() === selected);
      }
      if (teamRosterFilters.graduationYear) {
        const year = String(teamRosterFilters.graduationYear).trim();
        filtered = filtered.filter((player) => String(player?.graduation_year || '') === year);
      }
      return filtered;
    }

    function onTeamRosterFilterChange() {
      const positionEl = document.getElementById('teamRosterFilterPosition');
      const yearEl = document.getElementById('teamRosterFilterYear');
      teamRosterFilters.position = positionEl ? String(positionEl.value || '').trim() : '';
      teamRosterFilters.graduationYear = yearEl ? String(yearEl.value || '').trim() : '';
      rerenderRosterTab();
    }

    function clearTeamRosterFilters() {
      teamRosterFilters.position = '';
      teamRosterFilters.graduationYear = '';
      const positionEl = document.getElementById('teamRosterFilterPosition');
      const yearEl = document.getElementById('teamRosterFilterYear');
      if (positionEl) positionEl.value = '';
      if (yearEl) yearEl.value = '';
      rerenderRosterTab();
    }

    function renderRosterTab(players, totalRosterCount = players.length) {
      if (!players.length) {
        if (totalRosterCount > 0) {
          return `<div class="team-empty-state"><strong>No players match these filters</strong><span>Try a different position or graduation year.</span></div>`;
        }
        return `<div class="team-empty-state"><strong>No roster posted yet</strong><span>This coach has not published any rostered players on this team page.</span></div>`;
      }
      if (rosterViewMode === 'list') {
        return `<div class="players-list team-roster-list">${players.map(formatRosterPlayerListRow).join('')}</div>`;
      }
      return `<div class="team-roster-grid">${players.map(formatRosterPlayer).join('')}</div>`;
    }

    function rerenderRosterTab() {
      if (!teamPageData) return;
      const roster = Array.isArray(teamPageData.roster) ? teamPageData.roster : [];
      const filteredRoster = getFilteredRoster(roster);
      const rosterContent = document.getElementById('teamRosterContent');
      if (!rosterContent) return;
      rosterContent.innerHTML = renderRosterTab(filteredRoster, roster.length);
    }

    function renderScheduleTab(schedule) {
      if (!schedule.length) {
        return `<div class="team-empty-state"><strong>No schedule published yet</strong><span>Check back later for upcoming games and events.</span></div>`;
      }
      return `<div class="team-schedule-list">${schedule.map(item => {
        const venue = item.location ? escHtml(item.location) : 'Location TBD';
        const time = item.event_time ? escHtml(item.event_time) : 'Time TBD';
        const homeAway = item.is_home ? 'Home' : 'Away';
        return `<div class="team-schedule-item">
          <div class="team-schedule-date">${formatDateLabel(item.event_date)}<br><span style="font-size:12px; opacity:0.8;">${time}</span></div>
          <div class="team-schedule-main">
            <h3>${escHtml(item.opponent_name || 'Opponent TBD')}</h3>
            <p class="team-schedule-meta">${homeAway} game • ${venue}</p>
            ${item.notes ? `<div class="team-schedule-notes">${escHtml(item.notes)}</div>` : ''}
          </div>
        </div>`;
      }).join('')}</div>`;
    }

    function getSocialEntries(team) {
      return [
        { key: 'team_website', title: 'Website', description: 'Official school or athletics site', href: sanitizeExternalUrl(team.team_website) },
        { key: 'twitter_url', title: 'X / Twitter', description: 'Game updates, announcements, and highlights', href: sanitizeExternalUrl(team.twitter_url) },
        { key: 'instagram_url', title: 'Instagram', description: 'Photos, game day content, and team visuals', href: sanitizeExternalUrl(team.instagram_url) },
        { key: 'facebook_url', title: 'Facebook', description: 'Community updates and news', href: sanitizeExternalUrl(team.facebook_url) },
        { key: 'youtube_url', title: 'YouTube', description: 'Highlights, recaps, and media content', href: sanitizeExternalUrl(team.youtube_url) },
        { key: 'tiktok_url', title: 'TikTok', description: 'Short-form team content and behind the scenes', href: sanitizeExternalUrl(team.tiktok_url) }
      ].filter(entry => entry.href);
    }

    function getSocialIconSvg(key) {
      if (key === 'team_website') {
        return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3c2.5 2.6 4 5.8 4 9s-1.5 6.4-4 9c-2.5-2.6-4-5.8-4-9s1.5-6.4 4-9z"></path></svg>';
      }
      if (key === 'twitter_url') {
        return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M17.53 3H20.5l-6.49 7.42L21.65 21h-5.99l-4.69-6.14L5.6 21H2.62l6.94-7.93L2.25 3h6.14l4.24 5.6L17.53 3zm-1.05 16.2h1.65L7.5 4.73H5.73L16.48 19.2z"/></svg>';
      }
      if (key === 'instagram_url') {
        return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.2" cy="6.8" r="1"></circle></svg>';
      }
      if (key === 'facebook_url') {
        return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 8.5V6.8c0-.8.5-1.3 1.4-1.3H16V2.6c-.5-.1-1.5-.2-2.6-.2-2.6 0-4.4 1.6-4.4 4.5v1.6H6v3.2h3v9h3.7v-9h2.9l.5-3.2h-3.4z"/></svg>';
      }
      if (key === 'youtube_url') {
        return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 8.2s-.2-1.5-.9-2.2c-.9-.9-1.9-.9-2.4-1C14.9 4.7 12 4.7 12 4.7h0s-2.9 0-6.3.3c-.5.1-1.5.1-2.4 1-.7.7-.9 2.2-.9 2.2S2 10 2 11.8v1.7c0 1.8.4 3.6.4 3.6s.2 1.5.9 2.2c.9.9 2.1.9 2.7 1 2 .2 6 .3 6 .3s2.9 0 6.3-.3c.5-.1 1.5-.1 2.4-1 .7-.7.9-2.2.9-2.2s.4-1.8.4-3.6v-1.7c0-1.8-.4-3.6-.4-3.6zM9.8 15.5V8.9l6.1 3.3-6.1 3.3z"/></svg>';
      }
      if (key === 'tiktok_url') {
        return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 3c.3 1.8 1.3 3 3 3.4v2.9c-1.2.1-2.2-.2-3-.7v5.8c0 2.9-1.8 4.8-4.7 4.8-2.6 0-4.5-1.8-4.5-4.4 0-2.7 2-4.5 4.8-4.5.3 0 .6 0 .8.1v3c-.3-.1-.5-.2-.8-.2-1.2 0-2 .8-2 1.8 0 1 .7 1.8 1.8 1.8 1.1 0 1.8-.7 1.8-2V3h2.8z"/></svg>';
      }
      return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M8 12h8"></path></svg>';
    }

    function renderSocialTab(team) {
      const links = getSocialEntries(team);
      if (!links.length) {
        return `<div class="team-empty-state"><strong>No social links published yet</strong><span>The coaching staff has not added public links for this team.</span></div>`;
      }
      return `<div class="team-social-grid">${links.map(link => `
        <div class="team-social-card">
          <div class="team-social-header">
            <span class="team-social-icon" aria-hidden="true">${getSocialIconSvg(link.key)}</span>
            <h3>${escHtml(link.title)}</h3>
          </div>
          <p>${escHtml(link.description)}</p>
          <a href="${escHtml(link.href)}" class="team-social-link" target="_blank" rel="noopener noreferrer">Visit link</a>
        </div>
      `).join('')}</div>`;
    }

    function renderStaffTab(staff) {
      if (!staff.length) {
        return `<div class="team-empty-state"><strong>No staff published yet</strong><span>Additional team staff has not been listed on this page yet.</span></div>`;
      }
      return `<div class="team-staff-grid">${staff.map(member => `
        <div class="team-staff-card">
          <h3>${escHtml(member.full_name || 'Staff Member')}</h3>
          <p class="team-staff-meta">${escHtml(member.role_title || 'Role')}</p>
          ${member.bio ? `<div class="team-staff-bio">${escHtml(member.bio)}</div>` : ''}
          ${(member.email || member.phone) ? `<div class="team-staff-meta" style="margin-top:10px;">${member.email ? `<div><a href="mailto:${encodeURIComponent(String(member.email || '').trim())}" class="team-social-link">${escHtml(member.email)}</a></div>` : ''}${member.phone ? `<div>${escHtml(member.phone)}</div>` : ''}</div>` : ''}
        </div>
      `).join('')}</div>`;
    }

    function switchTeamTab(tab) {
      document.querySelectorAll('.team-tab').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.team-tab-panel').forEach(panel => panel.classList.add('hidden'));
      document.getElementById('teamTab-' + tab).classList.add('active');
      document.getElementById('teamPanel-' + tab).classList.remove('hidden');
    }

    function renderTeamPage(data) {
      const root = document.getElementById('teamPageRoot');
      const team = data.team;
      const roster = Array.isArray(data.roster) ? data.roster : [];
      const filteredRoster = getFilteredRoster(roster);
      const schedule = Array.isArray(data.schedule) ? data.schedule : [];
      const staff = Array.isArray(data.staff) ? data.staff : [];
      const start = team.banner_color_start || '#1e3c72';
      const end = team.banner_color_end || '#2a5298';
      document.body.classList.toggle('use-banner-gradient-cards', !!team.use_banner_gradient_cards);
      document.documentElement.style.setProperty('--coach-banner-start', start);
      document.documentElement.style.setProperty('--coach-banner-end', end);
      const location = [team.city, team.state].filter(Boolean).map(escHtml).join(', ');
      const bannerBg = team.banner_image
        ? `background: url('/uploads/${encodeURI(team.banner_image)}') center/cover no-repeat;`
        : `background: linear-gradient(135deg, ${escHtml(start)} 0%, ${escHtml(end)} 100%);`;
      const logoHtml = team.school_logo
        ? `<img src="/uploads/${encodeURI(team.school_logo)}" alt="${escHtml(team.team_name || 'Team')}" onerror="this.onerror=null;this.parentNode.innerHTML='<div class=&quot;team-hero-logo-placeholder&quot;>🏈</div>'">`
        : '<div class="team-hero-logo-placeholder">🏈</div>';
      const websiteUrl = sanitizeExternalUrl(team.team_website);
      const logoContainerHtml = websiteUrl
        ? `<a href="${escHtml(websiteUrl)}" class="team-hero-logo-link" target="_blank" rel="noopener noreferrer" aria-label="Visit school website"><div class="team-hero-logo">${logoHtml}</div></a>`
        : `<div class="team-hero-logo">${logoHtml}</div>`;
      const coachPill = team.coach_name
        ? (team.coach_id
          ? `<a href="coach-detail.html?id=${encodeURIComponent(team.coach_id)}" class="team-hero-pill team-hero-pill-link">Coach ${escHtml(team.coach_name)}</a>`
          : `<span class="team-hero-pill">Coach ${escHtml(team.coach_name)}</span>`)
        : '';

      document.title = `${team.team_name || 'Team'} - Gridiron Athletes`;

      root.innerHTML = `
        <div class="team-hero" style="${bannerBg}">
          ${logoContainerHtml}
          <div class="team-hero-content">
            <h1 class="team-hero-title">${escHtml(team.team_name || 'Team')}</h1>
            ${team.school_name ? `<div class="team-hero-school">${escHtml(team.school_name)}</div>` : ''}
            <div class="team-hero-meta">
              ${location ? `<span class="team-hero-pill">${location}</span>` : ''}
              <span class="team-hero-pill">${Number(team.roster_count || roster.length || 0)} player${Number(team.roster_count || roster.length || 0) === 1 ? '' : 's'}</span>
              ${coachPill}
            </div>
          </div>
        </div>

        <div class="team-overview-card">
          <h2>About The School</h2>
          <p>${escHtml(team.school_overview || 'This school has not added a public overview yet. Check the tabs below for roster, schedule, staff, and social links.')}</p>
        </div>

        <div class="team-tabs">
          <button class="team-tab active" id="teamTab-roster" onclick="switchTeamTab('roster')">Roster</button>
          <button class="team-tab" id="teamTab-schedule" onclick="switchTeamTab('schedule')">Schedule</button>
          <button class="team-tab" id="teamTab-social" onclick="switchTeamTab('social')">Social Media</button>
          <button class="team-tab" id="teamTab-staff" onclick="switchTeamTab('staff')">Staff</button>
        </div>

        <div class="team-tab-panel" id="teamPanel-roster">
          <div class="team-panel-card">
            <div class="team-panel-header">
              <h2 class="team-panel-title">Roster</h2>
              ${renderRosterViewToggle()}
            </div>
            ${renderRosterFilters()}
            <div id="teamRosterContent">${renderRosterTab(filteredRoster, roster.length)}</div>
          </div>
        </div>
        <div class="team-tab-panel hidden" id="teamPanel-schedule">
          <div class="team-panel-card">
            <h2 class="team-panel-title">Schedule</h2>
            ${renderScheduleTab(schedule)}
          </div>
        </div>
        <div class="team-tab-panel hidden" id="teamPanel-social">
          <div class="team-panel-card">
            <h2 class="team-panel-title">Social Media</h2>
            ${renderSocialTab(team)}
          </div>
        </div>
        <div class="team-tab-panel hidden" id="teamPanel-staff">
          <div class="team-panel-card">
            <h2 class="team-panel-title">Staff</h2>
            ${renderStaffTab(staff)}
          </div>
        </div>
      `;
    }

    async function initTeamPage() {
      const user = await tryAuth();
      if (user) applyRoleBasedTopNav(user);
      else applyPublicTopNav();

      if (!teamId) {
        document.getElementById('teamPageRoot').innerHTML = '<div class="team-status"><h2>Team not found</h2><p>Missing team ID.</p></div>';
        return;
      }

      try {
        const res = await fetch('/api/team/' + encodeURIComponent(teamId));
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          document.getElementById('teamPageRoot').innerHTML = `<div class="team-status"><h2>Unable to load team page</h2><p>${escHtml(data.error || 'Team details could not be loaded.')}</p></div>`;
          return;
        }
        teamPageData = data;
        renderTeamPage(teamPageData);
        updateRosterViewToggleButtons();
        window.addEventListener('resize', handleRosterResponsiveResize);
        logPageView('team_detail');
      } catch (error) {
        document.getElementById('teamPageRoot').innerHTML = `<div class="team-status"><h2>Unable to load team page</h2><p>${escHtml(error.message || 'Unexpected error')}</p></div>`;
      }
    }

    initTeamPage();
  </script>
</body>
</html>
