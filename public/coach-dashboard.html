<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coach Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ── Top banner ── */
    .team-banner {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      border-radius: 14px;
      color: white;
      padding: 20px 28px;
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 16px;
    }
    .team-banner .team-icon {
      font-size: 44px;
      line-height: 1;
      flex-shrink: 0;
    }
    .team-banner .team-text { flex: 1; min-width: 0; }
    .team-banner .team-name {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .team-banner .school-name {
      font-size: 14px;
      opacity: 0.85;
    }
    .team-banner .team-location {
      font-size: 12px;
      opacity: 0.7;
      margin-top: 2px;
    }
    /* ── Middle row: stat tiles + invite card ── */
    .coach-mid-row {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      align-items: stretch;
    }
    .team-stat {
      background: #f0f4fa;
      border-radius: 10px;
      padding: 16px 24px;
      text-align: center;
      flex-shrink: 0;
      min-width: 110px;
    }
    .team-stat .ts-num {
      font-size: 28px;
      font-weight: 700;
      color: #1e3c72;
    }
    .team-stat .ts-label {
      font-size: 12px;
      color: #666;
      margin-top: 3px;
    }
    .coach-invite-card {
      flex: 1;
      background: white;
      border-radius: 14px;
      padding: 18px 22px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      border: 1px solid #c7d0da;
    }
    @media (max-width: 700px) {
      .team-banner { flex-direction: column; text-align: center; }
      .team-banner .team-name { white-space: normal; }
      .coach-mid-row { flex-wrap: wrap; }
      .team-stat { flex: 1 1 120px; }
      .coach-invite-card { flex: 1 1 100%; }
    }
    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: #1e3c72;
      margin: 0 0 14px;
    }
    .invite-form {
      display: flex;
      gap: 8px;
    }
    .invite-form input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #c7d0da;
      border-radius: 8px;
      font-size: 14px;
    }
    .invite-form input:focus {
      outline: none;
      border-color: #1e3c72;
    }
    .btn-invite {
      padding: 10px 16px;
      background: #1e3c72;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .btn-invite:hover { background: #2a5298; }
    .btn-invite:disabled { background: #999; cursor: not-allowed; }
    .invite-message {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 600;
      min-height: 18px;
    }
    .invite-message.success { color: #2e7d32; }
    .invite-message.error { color: #c62828; }
    .invite-list {
      display: grid;
      gap: 8px;
    }
    .invite-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: #f8faff;
      border: 1px solid #e0e8f5;
      border-radius: 8px;
      font-size: 13px;
    }
    .invite-row .invite-email {
      font-weight: 600;
      color: #1e3c72;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .invite-row .invite-meta {
      color: #76849b;
      font-size: 12px;
    }
    .invite-row .invite-status {
      padding: 2px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .invite-status.pending { background: #fff3e0; color: #e65100; }
    .invite-status.accepted { background: #e8f5e9; color: #2e7d32; }
    .invite-status.declined { background: #fce4ec; color: #c62828; }
    .invite-status.expired { background: #f5f5f5; color: #999; }
    .btn-cancel-invite {
      padding: 4px 10px;
      background: #ffebee;
      color: #c62828;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .btn-cancel-invite:hover { background: #ffcdd2; }

    /* Roster */
    .roster-section {
      background: white;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      border: 1px solid #c7d0da;
    }
    .roster-empty {
      text-align: center;
      padding: 48px 0;
      color: #76849b;
    }
    .roster-empty .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    .coach-card-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .btn-view-player {
      flex: 1;
      padding: 7px 0;
      background: #e3f2fd;
      color: #1565c0;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-view-player:hover { background: #bbdefb; }
    .btn-remove-player {
      padding: 7px 12px;
      background: #ffebee;
      color: #c62828;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-remove-player:hover { background: #ffcdd2; }
    /* List-row action buttons — same sizing as agent expand/favorite buttons */
    .btn-view-player-list {
      flex-shrink: 0;
      background: #f1f5fa;
      color: #385884;
      border: 1px solid #d4deea;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .btn-view-player-list:hover { background: #e6eef8; }
    .btn-remove-player-list {
      flex-shrink: 0;
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #b8c4d4;
      transition: color 0.2s;
      padding: 0;
      width: auto;
      height: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .btn-remove-player-list:hover { color: #c62828; }
    .invites-toggle {
      font-size: 13px;
      color: #1e3c72;
      cursor: pointer;
      font-weight: 600;
      background: none;
      border: none;
      padding: 0;
      margin-top: 8px;
    }
    .invites-toggle:hover { text-decoration: underline; }
    .alert-banner {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .alert-banner.info { background: #e3f2fd; color: #1565c0; }
    @media (max-width: 768px) {
      .roster-section {
        padding: 16px;
      }
      .btn-remove-player-list {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard-wrapper">
    <header class="dashboard-header">
      <div class="header-content">
        <div class="header-left">
          <img src="/images/GridIronLogoWhiteBG.png" alt="" class="header-logo">
        </div>
        <nav class="top-nav-menu">
          <a href="coach-dashboard.html" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V10.5z"/><path d="M9 21V13h6v8"/></svg>
            Home
          </a>
          <a href="messages.html" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
            Messages
          </a>
          <a href="coach-profile.html" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-3.866 3.582-7 8-7s8 3.134 8 7"/></svg>
            My Profile
          </a>
          <a href="#" onclick="logout(); return false;" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sign out
          </a>
        </nav>
      </div>
    </header>

    <div class="dashboard-container">

      <!-- Top: full-width team banner -->
      <div id="teamBadge" class="team-banner" style="display:none;">
        <div class="team-icon">🏈</div>
        <div class="team-text">
          <div class="team-name" id="teamNameDisplay"></div>
          <div class="school-name" id="schoolNameDisplay"></div>
          <div class="team-location" id="teamLocationDisplay"></div>
        </div>
      </div>

      <!-- Middle: stat tiles + invite card -->
      <div class="coach-mid-row">
        <div class="team-stat">
          <div class="ts-num" id="rosterCount">—</div>
          <div class="ts-label">Players</div>
        </div>
        <div class="team-stat">
          <div class="ts-num" id="pendingInvitesCount">—</div>
          <div class="ts-label">Pending Invites</div>
        </div>
        <div class="coach-invite-card">
          <div class="section-title" style="margin:0 0 10px;">Invite a Player</div>
          <p style="font-size:13px;color:#76849b;margin:0 0 10px;">Enter the email address of a player who has (or will create) an account on Gridiron Elite.</p>
          <div class="invite-form">
            <input type="email" id="inviteEmailInput" placeholder="player@email.com" onkeypress="handleInviteKeyPress(event)">
            <button class="btn-invite" id="inviteBtn" onclick="sendInvite()">Send</button>
          </div>
          <div class="invite-message" id="inviteMessage"></div>
          <button class="invites-toggle" style="margin-top:14px;" onclick="toggleInvitesList()">
            <span id="invitesToggleLabel">Show invites ▼</span>
          </button>
          <div id="invitesList" style="display:none;margin-top:10px;">
            <div id="invitesContainer" class="invite-list"></div>
          </div>
        </div>
      </div>

      <!-- Bottom: full-width roster -->
      <div class="roster-section">
          <div class="section-title" style="margin:0 0 12px;">Team Roster</div>

          <div class="filters">
            <div class="agent-controls-wrap">
              <div class="agent-controls-row">
                <div class="filter-group" style="flex:1;">
                  <div class="search-input-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="quickSearch" class="search-input-with-icon" placeholder="Search by name, school, or position...">
                  </div>
                </div>
                <button onclick="toggleAdvancedFilters()" class="filters-toggle-btn" id="filtersToggleBtn">
                  <span>Filters</span>
                  <span id="filterIcon">▼</span>
                </button>
                <div class="view-toggle" id="viewToggle">
                  <button class="view-toggle-btn active" data-view="grid" title="Card View">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                  </button>
                  <button class="view-toggle-btn" data-view="list" title="List View">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                  </button>
                </div>
                <select id="sortSelect" style="padding: 9px 12px; border: 1px solid #c7d0da; border-radius: 8px; font-size: 14px; font-weight: 500; color: #333; background: white; cursor: pointer;">
                  <option value="">Sort: Default</option>
                  <option value="name_asc">Name A→Z</option>
                  <option value="name_desc">Name Z→A</option>
                  <option value="grad_year_asc">Grad Year ↑</option>
                  <option value="grad_year_desc">Grad Year ↓</option>
                  <option value="gpa_desc">GPA High→Low</option>
                  <option value="gpa_asc">GPA Low→High</option>
                  <option value="forty_asc">40-Yard Fastest</option>
                  <option value="forty_desc">40-Yard Slowest</option>
                  <option value="height_desc">Height Tallest</option>
                  <option value="weight_desc">Weight Heaviest</option>
                  <option value="vertical_desc">Vertical Highest</option>
                </select>
              </div>
            </div>

            <div id="advancedFilters" style="display:none;">
              <h3 style="color:#333;font-size:16px;margin-bottom:15px;font-weight:600;">Advanced Filters</h3>
              <div class="filter-grid">
                <div class="filter-group">
                  <label>Position</label>
                  <select id="filterPosition">
                    <option value="">All Positions</option>
                    <option value="QB">Quarterback</option>
                    <option value="RB">Running Back</option>
                    <option value="WR">Wide Receiver</option>
                    <option value="TE">Tight End</option>
                    <option value="OL">Offensive Line</option>
                    <option value="DL">Defensive Line</option>
                    <option value="LB">Linebacker</option>
                    <option value="CB">Cornerback</option>
                    <option value="S">Safety</option>
                    <option value="K">Kicker</option>
                  </select>
                </div>
                <div class="filter-group">
                  <label>Grad Year</label>
                  <input type="number" id="filterYear" placeholder="2025">
                </div>
                <div class="filter-group">
                  <label>Min GPA</label>
                  <input type="number" step="0.1" id="filterGpa" placeholder="3.0" min="0" max="4.0">
                </div>
                <div class="filter-group">
                  <label>Max 40-Yard</label>
                  <input type="number" step="0.01" id="filterForty" placeholder="4.5">
                </div>
                <div class="filter-group">
                  <label>Min Height</label>
                  <input type="text" id="filterHeight" placeholder="6'0">
                </div>
                <div class="filter-group">
                  <label>Min Weight</label>
                  <input type="number" id="filterWeight" placeholder="180">
                </div>
                <div class="filter-group">
                  <label>Min Vertical</label>
                  <input type="number" step="0.5" id="filterVertical" placeholder="30">
                </div>
                <div class="filter-group">
                  <label>Min Bench</label>
                  <input type="number" id="filterBench" placeholder="225">
                </div>
                <div class="filter-group">
                  <label>Min Squat</label>
                  <input type="number" id="filterSquat" placeholder="315">
                </div>
                <div class="filter-group">
                  <label>Max Shuttle</label>
                  <input type="number" step="0.01" id="filterShuttle" placeholder="4.2">
                </div>
                <div class="filter-group">
                  <label>Max L-Drill</label>
                  <input type="number" step="0.01" id="filterLDrill" placeholder="7.0">
                </div>
                <div class="filter-group">
                  <label>Min Broad Jump</label>
                  <input type="number" id="filterBroadJump" placeholder="110">
                </div>
              </div>
              <div class="filter-actions">
                <div style="display:flex;gap:10px;">
                  <button onclick="clearFilters()" class="clear-btn">
                    <span>Reset</span>
                  </button>
                </div>
              </div>
            </div>

            <div class="agent-results-row">
              <span id="lastUpdate" class="last-update"></span>
              <div class="results-count" id="resultsCount"></div>
            </div>
          </div>

          <div id="rosterContainer"></div>
        </div>

    </div><!-- /.dashboard-container -->
  </div><!-- /.dashboard-wrapper -->

  <script src="app.js"></script>
  <script>
    const VIEW_MODE_STORAGE_KEY = 'coachDashboardViewMode';
    let viewMode = getDefaultViewMode();
    let teamData = null;
    let rosterData = [];
    let invitesData = [];
    let invitesVisible = false;

    async function init() {
      const user = await checkAuth('coach');
      if (!user) return;

      // Handle invite accept via email link token
      const params = new URLSearchParams(window.location.search);
      const acceptToken = params.get('acceptInvite');
      if (acceptToken) {
        window.history.replaceState({}, '', window.location.pathname);
        // Redirect to the server-side accept route — only works for players, so coach links go directly
        window.location.href = '/api/team-invites/accept?token=' + encodeURIComponent(acceptToken);
        return;
      }

      setupViewToggle();
      setupRosterFilterListeners();
      window.addEventListener('resize', handleResponsiveViewResize);

      await Promise.all([loadTeam(), loadRoster(), loadInvites()]);
      await logPageView('coach_dashboard');
    }

    function isMobileViewport() {
      return window.matchMedia('(max-width: 768px)').matches;
    }

    function getDefaultViewMode() {
      const saved = localStorage.getItem(VIEW_MODE_STORAGE_KEY);
      if (saved === 'grid' || saved === 'list') return saved;
      return isMobileViewport() ? 'list' : 'grid';
    }

    function updateViewToggleButtons() {
      document.querySelectorAll('.view-toggle-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.view === viewMode);
      });
    }

    function handleResponsiveViewResize() {
      const hasSavedPreference = !!localStorage.getItem(VIEW_MODE_STORAGE_KEY);
      if (hasSavedPreference) return;
      const preferredMode = isMobileViewport() ? 'list' : 'grid';
      if (viewMode === preferredMode) return;
      viewMode = preferredMode;
      updateViewToggleButtons();
      applyRosterFilters();
    }

    function setupViewToggle() {
      document.querySelectorAll('.view-toggle-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const newView = btn.dataset.view;
          if (newView === viewMode) return;
          viewMode = newView;
          localStorage.setItem(VIEW_MODE_STORAGE_KEY, viewMode);
          updateViewToggleButtons();
          applyRosterFilters();
        });
      });
      updateViewToggleButtons();
    }

    function toggleAdvancedFilters() {
      const advancedFilters = document.getElementById('advancedFilters');
      const filterIcon = document.getElementById('filterIcon');
      const filterBtn = document.getElementById('filtersToggleBtn');

      if (advancedFilters.style.display === 'none') {
        advancedFilters.style.display = 'block';
        filterIcon.textContent = '▲';
        filterBtn.classList.add('active');
      } else {
        advancedFilters.style.display = 'none';
        filterIcon.textContent = '▼';
        filterBtn.classList.remove('active');
      }
    }

    function setupRosterFilterListeners() {
      const fieldIds = [
        'quickSearch', 'filterPosition', 'filterYear', 'filterGpa', 'filterForty',
        'filterHeight', 'filterWeight', 'filterVertical', 'filterBench', 'filterSquat',
        'filterShuttle', 'filterLDrill', 'filterBroadJump', 'sortSelect'
      ];

      fieldIds.forEach((fieldId) => {
        const field = document.getElementById(fieldId);
        if (!field) return;
        const eventName = field.tagName === 'SELECT' ? 'change' : 'input';
        field.addEventListener(eventName, applyRosterFilters);
      });
    }

    function clearFilters() {
      document.getElementById('quickSearch').value = '';
      document.getElementById('filterPosition').value = '';
      document.getElementById('filterYear').value = '';
      document.getElementById('filterGpa').value = '';
      document.getElementById('filterForty').value = '';
      document.getElementById('filterHeight').value = '';
      document.getElementById('filterWeight').value = '';
      document.getElementById('filterVertical').value = '';
      document.getElementById('filterBench').value = '';
      document.getElementById('filterSquat').value = '';
      document.getElementById('filterShuttle').value = '';
      document.getElementById('filterLDrill').value = '';
      document.getElementById('filterBroadJump').value = '';
      document.getElementById('sortSelect').value = '';
      applyRosterFilters();
    }

    async function loadTeam() {
      try {
        const res = await fetch('/api/coach/team');
        if (!res.ok) return;
        teamData = await res.json();
        renderTeamBadge();
      } catch (_) {}
    }

    function renderTeamBadge() {
      if (!teamData) return;
      document.getElementById('teamBadge').style.display = '';
      document.getElementById('teamNameDisplay').textContent = teamData.team_name || 'My Team';
      document.getElementById('schoolNameDisplay').textContent = teamData.school_name || '';
      const loc = [teamData.city, teamData.state].filter(Boolean).join(', ');
      document.getElementById('teamLocationDisplay').textContent = loc;
    }

    async function loadRoster() {
      try {
        const res = await fetch('/api/coach/team/roster');
        if (!res.ok) return;
        rosterData = await res.json();
        document.getElementById('rosterCount').textContent = rosterData.length;
        document.getElementById('lastUpdate').textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
        applyRosterFilters();
      } catch (_) {}
    }

    function applyRosterFilters() {
      let players = [...rosterData];

      const position = document.getElementById('filterPosition').value;
      const year = document.getElementById('filterYear').value;
      const gpa = document.getElementById('filterGpa').value;
      const forty = document.getElementById('filterForty').value;
      const height = document.getElementById('filterHeight').value;
      const weight = document.getElementById('filterWeight').value;
      const vertical = document.getElementById('filterVertical').value;
      const bench = document.getElementById('filterBench').value;
      const squat = document.getElementById('filterSquat').value;
      const shuttle = document.getElementById('filterShuttle').value;
      const lDrill = document.getElementById('filterLDrill').value;
      const broadJump = document.getElementById('filterBroadJump').value;
      const quickSearch = document.getElementById('quickSearch').value.toLowerCase().trim();

      if (position) {
        players = players.filter((p) => (p.position || '').toUpperCase() === position.toUpperCase());
      }
      if (year) {
        players = players.filter((p) => String(p.graduation_year || '') === String(year));
      }
      if (gpa) {
        players = players.filter((p) => p.gpa != null && parseFloat(p.gpa) >= parseFloat(gpa));
      }

      if (quickSearch) {
        players = players.filter((p) => {
          const searchableText = [
            p.full_name,
            p.high_school,
            p.position,
            p.bio,
            p.graduation_year != null ? String(p.graduation_year) : '',
            p.height,
            p.weight != null ? String(p.weight) : '',
            p.gpa != null ? String(p.gpa) : ''
          ].filter(Boolean).join(' ').toLowerCase();
          return searchableText.includes(quickSearch);
        });
      }

      if (forty) {
        players = players.filter((p) => p.forty_yard_dash != null && parseFloat(p.forty_yard_dash) <= parseFloat(forty));
      }
      if (height) {
        players = players.filter((p) => p.height && p.height >= height);
      }
      if (weight) {
        players = players.filter((p) => p.weight != null && parseInt(p.weight, 10) >= parseInt(weight, 10));
      }
      if (vertical) {
        players = players.filter((p) => p.vertical_jump != null && parseFloat(p.vertical_jump) >= parseFloat(vertical));
      }
      if (bench) {
        players = players.filter((p) => p.bench_press != null && parseInt(p.bench_press, 10) >= parseInt(bench, 10));
      }
      if (squat) {
        players = players.filter((p) => p.squat != null && parseInt(p.squat, 10) >= parseInt(squat, 10));
      }
      if (shuttle) {
        players = players.filter((p) => p.shuttle_5_10_5 != null && parseFloat(p.shuttle_5_10_5) <= parseFloat(shuttle));
      }
      if (lDrill) {
        players = players.filter((p) => p.l_drill != null && parseFloat(p.l_drill) <= parseFloat(lDrill));
      }
      if (broadJump) {
        players = players.filter((p) => p.broad_jump != null && parseFloat(p.broad_jump) >= parseFloat(broadJump));
      }

      const sortBy = document.getElementById('sortSelect').value;
      const cmp = (av, bv) => {
        if (av == null && bv == null) return 0;
        if (av == null) return 1;
        if (bv == null) return -1;
        return av < bv ? -1 : av > bv ? 1 : 0;
      };

      if      (sortBy === 'name_asc')       players.sort((a, b) => cmp((a.full_name || '').toLowerCase(), (b.full_name || '').toLowerCase()));
      else if (sortBy === 'name_desc')      players.sort((a, b) => cmp((b.full_name || '').toLowerCase(), (a.full_name || '').toLowerCase()));
      else if (sortBy === 'grad_year_asc')  players.sort((a, b) => cmp(a.graduation_year, b.graduation_year));
      else if (sortBy === 'grad_year_desc') players.sort((a, b) => cmp(b.graduation_year, a.graduation_year));
      else if (sortBy === 'gpa_desc')       players.sort((a, b) => cmp(b.gpa != null ? +b.gpa : null, a.gpa != null ? +a.gpa : null));
      else if (sortBy === 'gpa_asc')        players.sort((a, b) => cmp(a.gpa != null ? +a.gpa : null, b.gpa != null ? +b.gpa : null));
      else if (sortBy === 'forty_asc')      players.sort((a, b) => cmp(a.forty_yard_dash != null ? +a.forty_yard_dash : null, b.forty_yard_dash != null ? +b.forty_yard_dash : null));
      else if (sortBy === 'forty_desc')     players.sort((a, b) => cmp(b.forty_yard_dash != null ? +b.forty_yard_dash : null, a.forty_yard_dash != null ? +a.forty_yard_dash : null));
      else if (sortBy === 'height_desc')    players.sort((a, b) => cmp(b.height, a.height));
      else if (sortBy === 'weight_desc')    players.sort((a, b) => cmp(b.weight != null ? +b.weight : null, a.weight != null ? +a.weight : null));
      else if (sortBy === 'vertical_desc')  players.sort((a, b) => cmp(b.vertical_jump != null ? +b.vertical_jump : null, a.vertical_jump != null ? +a.vertical_jump : null));

      document.getElementById('resultsCount').textContent = `${players.length} player${players.length === 1 ? '' : 's'} found`;
      renderRoster(players);
    }

    function renderRoster(players) {
      const container = document.getElementById('rosterContainer');
      if (!players.length) {
        container.innerHTML = `
          <div class="roster-empty">
            <div class="empty-icon">👥</div>
            <div style="font-size:16px;font-weight:600;color:#1e3c72;margin-bottom:6px;">No players found</div>
            <div>Adjust filters or send invites to grow your roster.</div>
          </div>`;
        return;
      }

      if (viewMode === 'grid') {
        container.innerHTML = `<div class="players-grid">${players.map(renderRosterGridCard).join('')}</div>`;
      } else {
        container.innerHTML = `<div class="players-list">${players.map(renderRosterListRow).join('')}</div>`;
      }
    }

    function renderRosterGridCard(p) {
      const hasVerifiedBadge = hasVerifiedMetric(p);
      const profilePicture = p.profile_picture ? `/uploads/${p.profile_picture}` : '';
      const escapedName = escHtml(p.full_name || 'Player');
      const safePlayerNameLiteral = JSON.stringify(p.full_name || 'this player');
      return `
        <div class="player-card-compact">
          <div onclick="viewPlayer(${p.user_id})" style="cursor: pointer;">
            <div class="player-card-header">
              ${profilePicture
                ? `<img src="${escHtml(profilePicture)}" alt="${escapedName}" class="player-card-photo">`
                : '<div class="player-card-photo no-photo">No Photo</div>'}
            </div>
            <div class="player-card-body">
              <div class="player-info-section">
                <h3>${escapedName}</h3>
                <p>${escHtml(p.position || 'Position not set')}</p>
                <p>${escHtml(p.high_school || 'School not set')}</p>
                <p>Class of ${escHtml(p.graduation_year || 'N/A')}</p>
              </div>
              <div class="player-stats-compact">
                <div class="stat-item">
                  <div class="stat-label">Height</div>
                  <div class="stat-value">${escHtml(formatHeightDisplay(p.height) || 'N/A')}</div>
                </div>
                <div class="stat-item">
                  <div class="stat-label">Weight</div>
                  <div class="stat-value">${p.weight ? `${escHtml(p.weight)} lbs` : 'N/A'}</div>
                </div>
                <div class="stat-item">
                  <div class="stat-label">GPA</div>
                  <div class="stat-value">${escHtml(p.gpa || 'N/A')}</div>
                </div>
                <div class="stat-item" title="${hasVerifiedBadge ? 'This athlete has at least one third-party verified athletic metric' : 'No third-party verified athletic metrics yet'}">
                  <div class="stat-label">Verified</div>
                  <div class="stat-value verified-athlete-tile ${hasVerifiedBadge ? '' : 'verified-athlete-tile-empty'}">
                    ${hasVerifiedBadge
                      ? '<img src="/images/logos/verified-athlete.svg" alt="Verified Athlete" class="verified-athlete-image">'
                      : 'Not Yet'}
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="coach-card-actions">
            <button class="btn-view-player" onclick="event.stopPropagation(); viewPlayer(${p.user_id})">View Profile</button>
            <button class="btn-remove-player" onclick="event.stopPropagation(); removePlayer(${p.user_id}, ${safePlayerNameLiteral})">Remove</button>
          </div>
        </div>`;
    }

    function renderRosterListRow(p) {
      const hasVerifiedBadge = hasVerifiedMetric(p);
      const profilePicture = p.profile_picture ? `/uploads/${p.profile_picture}` : '';
      const escapedName = escHtml(p.full_name || 'Player');
      const safePlayerNameLiteral = JSON.stringify(p.full_name || 'this player');
      return `
        <div class="player-list-row">
          <div class="player-list-photo">
            ${profilePicture
              ? `<img src="${escHtml(profilePicture)}" alt="${escapedName}" class="player-list-img">`
              : '<div class="player-list-img no-photo-list">No Photo</div>'}
          </div>
          <div class="player-list-info" onclick="viewPlayer(${p.user_id})" style="cursor:pointer;">
            <div class="player-list-name">${escapedName}</div>
            <div class="player-list-details">
              <span class="detail-item">${escHtml(p.position || 'Position TBD')}</span>
              <span class="detail-separator">•</span>
              <span class="detail-item">${escHtml(p.high_school || 'School TBD')}</span>
              <span class="detail-separator">•</span>
              <span class="detail-item">Class of ${escHtml(p.graduation_year || 'N/A')}</span>
            </div>
          </div>
          <div class="player-list-stats">
            <div class="list-stat"><span class="list-stat-label">HT:</span><span class="list-stat-value">${escHtml(formatHeightDisplay(p.height) || 'N/A')}</span></div>
            <div class="list-stat"><span class="list-stat-label">WT:</span><span class="list-stat-value">${p.weight ? `${escHtml(p.weight)}lbs` : 'N/A'}</span></div>
            <div class="list-stat"><span class="list-stat-label">GPA:</span><span class="list-stat-value">${escHtml(p.gpa || 'N/A')}</span></div>
            <div class="list-stat"><span class="list-stat-label">40yd:</span><span class="list-stat-value">${p.forty_yard_dash != null ? Number(p.forty_yard_dash).toFixed(2) : 'N/A'}</span></div>
            <div class="list-stat"><span class="list-stat-label">Verified:</span><span class="list-stat-value">${hasVerifiedBadge ? '✓' : '—'}</span></div>
          </div>
          <button class="btn-view-player-list"
                  onclick="event.stopPropagation(); viewPlayer(${p.user_id})"
                  title="View player profile">View</button>
          <button class="btn-remove-player-list"
                  onclick="event.stopPropagation(); removePlayer(${p.user_id}, ${safePlayerNameLiteral})"
                  title="Remove from roster">✕</button>
        </div>`;
    }

    function hasVerifiedMetric(player) {
      if (!player || !player.metric_videos) return false;
      try {
        const metricVideos = JSON.parse(player.metric_videos);
        return Array.isArray(metricVideos) && metricVideos.some((video) => !!video?.is_verified);
      } catch (_) {
        return false;
      }
    }

    function formatHeightDisplay(heightValue) {
      const raw = String(heightValue || '').trim();
      if (!raw) return '';

      let m = raw.match(/^(\d+)\s*'\s*(\d+(?:\.\d+)?)?\s*"?$/);
      if (m) {
        const feet = Number(m[1] || '0');
        const inches = Number(m[2] || '0');
        if (!Number.isFinite(feet) || !Number.isFinite(inches)) return raw;
        const inchesText = Number.isInteger(inches) ? String(inches) : String(Number(inches.toFixed(1)));
        return `${feet}'${inchesText}"`;
      }

      m = raw.match(/^(\d+)\s*(?:ft|feet)\s*(\d+(?:\.\d+)?)?\s*(?:in|inches)?$/i);
      if (m) {
        const feet = Number(m[1] || '0');
        const inches = Number(m[2] || '0');
        if (!Number.isFinite(feet) || !Number.isFinite(inches)) return raw;
        const inchesText = Number.isInteger(inches) ? String(inches) : String(Number(inches.toFixed(1)));
        return `${feet}'${inchesText}"`;
      }

      const numeric = Number(raw);
      if (Number.isFinite(numeric) && numeric > 0) {
        const feet = Math.floor(numeric / 12);
        const inches = Number((numeric - (feet * 12)).toFixed(1));
        const inchesText = Number.isInteger(inches) ? String(inches) : String(inches);
        return `${feet}'${inchesText}"`;
      }

      return raw;
    }

    function viewPlayer(playerId) {
      window.location.href = 'player-detail.html?id=' + playerId;
    }

    async function removePlayer(playerId, playerName) {
      if (!confirm(`Remove ${playerName} from your roster?`)) return;
      try {
        const res = await fetch('/api/coach/team/roster/' + playerId, { method: 'DELETE' });
        if (res.ok) {
          await loadRoster();
        } else {
          const data = await res.json();
          alert(data.error || 'Failed to remove player');
        }
      } catch (_) {
        alert('Failed to remove player');
      }
    }

    async function loadInvites() {
      try {
        const res = await fetch('/api/coach/invites');
        if (!res.ok) return;
        invitesData = await res.json();
        const pendingCount = invitesData.filter(i => i.status === 'pending').length;
        document.getElementById('pendingInvitesCount').textContent = pendingCount;
        renderInvites();
      } catch (_) {}
    }

    function toggleInvitesList() {
      invitesVisible = !invitesVisible;
      document.getElementById('invitesList').style.display = invitesVisible ? '' : 'none';
      document.getElementById('invitesToggleLabel').textContent = invitesVisible ? 'Hide invites ▲' : 'Show invites ▼';
    }

    function renderInvites() {
      const container = document.getElementById('invitesContainer');
      if (!invitesData.length) {
        container.innerHTML = '<div style="font-size:13px;color:#76849b;padding:8px 0;">No invites sent yet.</div>';
        return;
      }
      container.innerHTML = invitesData.map(inv => {
        const isExpired = new Date(inv.expires_at) < new Date() && inv.status === 'pending';
        const status = isExpired ? 'expired' : inv.status;
        const sentDate = new Date(inv.sent_at).toLocaleDateString();
        const cancelBtn = (inv.status === 'pending' && !isExpired)
          ? `<button class="btn-cancel-invite" onclick="cancelInvite(${inv.id})">Cancel</button>`
          : '';
        return `
          <div class="invite-row">
            <div style="flex:1;min-width:0;">
              <div class="invite-email">${escHtml(inv.player_email)}</div>
              <div class="invite-meta">Sent ${sentDate}</div>
            </div>
            <span class="invite-status ${status}">${status.charAt(0).toUpperCase() + status.slice(1)}</span>
            ${cancelBtn}
          </div>`;
      }).join('');
    }

    async function sendInvite() {
      const email = (document.getElementById('inviteEmailInput').value || '').trim();
      const msgEl = document.getElementById('inviteMessage');
      const btn = document.getElementById('inviteBtn');
      if (!email) {
        msgEl.className = 'invite-message error';
        msgEl.textContent = 'Please enter an email address.';
        return;
      }
      btn.disabled = true;
      msgEl.className = 'invite-message';
      msgEl.textContent = 'Sending…';
      try {
        const res = await fetch('/api/coach/invite', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ playerEmail: email })
        });
        const data = await res.json();
        if (res.ok) {
          msgEl.className = 'invite-message success';
          msgEl.textContent = 'Invite sent!';
          document.getElementById('inviteEmailInput').value = '';
          await loadInvites();
          if (!invitesVisible) {
            toggleInvitesList();
          }
        } else {
          msgEl.className = 'invite-message error';
          msgEl.textContent = data.error || 'Failed to send invite';
        }
      } catch (_) {
        msgEl.className = 'invite-message error';
        msgEl.textContent = 'Network error. Please try again.';
      } finally {
        btn.disabled = false;
      }
    }

    function handleInviteKeyPress(e) {
      if (e.key === 'Enter') { e.preventDefault(); sendInvite(); }
    }

    async function cancelInvite(inviteId) {
      if (!confirm('Cancel this invite?')) return;
      try {
        const res = await fetch('/api/coach/invites/' + inviteId, { method: 'DELETE' });
        if (res.ok) {
          await loadInvites();
        } else {
          const data = await res.json();
          alert(data.error || 'Failed to cancel invite');
        }
      } catch (_) {
        alert('Failed to cancel invite');
      }
    }

    function escHtml(str) {
      if (str == null) return '';
      const d = document.createElement('div');
      d.textContent = String(str);
      return d.innerHTML;
    }

    init();
  </script>
</body>
</html>
