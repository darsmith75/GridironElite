<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Gridiron Elite</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body.login-body {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      padding-top: 20px;
    }
    .login-container {
      flex: 1 0 auto;
      margin: 20px auto 0;
    }
    .auth-page-footer {
      width: 100%;
      background: #102543;
      color: rgba(255, 255, 255, 0.92);
      padding: 16px 20px 18px;
      margin-top: auto;
    }
    .auth-page-footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }
    .auth-page-footer-copy {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.72);
    }
    .auth-page-footer-links {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }
    .auth-page-footer-links a {
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }
    .auth-page-footer-links a:hover {
      text-decoration: underline;
    }
    @media (max-width: 768px) {
      .auth-page-footer-inner {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body class="login-body">
  <div class="login-container" style="grid-template-columns: 1fr; max-width: 560px;">
    <div class="login-right" style="padding: 44px;">
      <div class="login-card" style="max-width: 100%;">
        <div class="login-header">
          <h2>Reset your password</h2>
          <p>Choose a new password for your account</p>
        </div>

        <div id="resetMessage" class="auth-message" style="display:none;" aria-live="polite"></div>

        <div class="auth-form">
          <div class="input-group">
            <label>New Password</label>
            <input type="password" id="newPassword" placeholder="Enter new password" minlength="8" required>
          </div>
          <div class="input-group">
            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm new password" minlength="8" required>
          </div>
          <button id="resetBtn" class="primary-btn" type="button">Update Password</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="auth-page-footer">
    <div class="auth-page-footer-inner">
      <div class="auth-page-footer-copy">Copyright 2026 Gridiron Athletes. All rights reserved.</div>
      <div class="auth-page-footer-links">
        <a href="about-us.html">About Us</a>
        <a href="terms-of-use.html">Terms of Use</a>
        <a href="contact-support.html">Contact Us / Support</a>
      </div>
    </div>
  </footer>

  <script>
    function setResetMessage(message, type) {
      const messageEl = document.getElementById('resetMessage');
      messageEl.textContent = message;
      messageEl.className = 'auth-message ' + (type || 'info');
      messageEl.style.display = 'block';
    }

    async function submitReset() {
      const token = new URLSearchParams(window.location.search).get('token');
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!token) {
        setResetMessage('Missing reset token. Please use the link from your email.', 'error');
        return;
      }
      if (newPassword.length < 8) {
        setResetMessage('Password must be at least 8 characters long.', 'error');
        return;
      }
      if (newPassword !== confirmPassword) {
        setResetMessage('Passwords do not match.', 'error');
        return;
      }

      const response = await fetch('/api/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword })
      });
      const data = await response.json();

      if (response.ok) {
        setResetMessage(data.message || 'Password updated successfully.', 'success');
        setTimeout(function () {
          window.location.href = '/';
        }, 1200);
      } else {
        setResetMessage(data.error || 'Unable to reset password.', 'error');
      }
    }

    document.getElementById('resetBtn').addEventListener('click', submitReset);
  </script>
</body>
</html>
