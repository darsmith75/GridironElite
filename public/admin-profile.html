<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Profile</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .admin-profile-photo-section {
      min-height: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .admin-profile-photo-section h3 {
      margin-top: 0;
    }
  </style>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
  <div class="dashboard-wrapper">
    <header class="dashboard-header">
      <div class="header-content">
        <div class="header-left">
          <img src="/images/GridIronLogoWhiteBG.png" alt="" class="header-logo">
        </div>
        <nav class="top-nav-menu">
          <a href="admin-dashboard.html" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V10.5z"/><path d="M9 21V13h6v8"/></svg>
            Home
          </a>
          <a href="teams.html" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            Teams
          </a>
          <a href="admin-profile.html" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-3.866 3.582-7 8-7s8 3.134 8 7"/></svg>
            My Profile
          </a>
          <a href="#" onclick="logout(); return false;" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sign out
          </a>
        </nav>
      </div>
    </header>

    <div class="dashboard-container">
      <div class="profile-page-container">
        <div class="profile-section">
          <h2 class="section-title-small">ADMIN PROFILE</h2>
          <form id="adminProfileForm" enctype="multipart/form-data">
            <div class="form-grid">
              <div class="form-section">
                <h3>👤 Personal Information</h3>
                <label>Full Name:</label>
                <input type="text" name="fullName" id="adminFullName" placeholder="Full Name" required>
                <label>Email:</label>
                <input type="email" name="email" id="adminEmail" placeholder="Email" required>
                <label>Phone:</label>
                <input type="tel" name="phone" id="adminPhone" placeholder="Phone Number">
              </div>
              <div class="form-section">
                <h3>🔒 Admin Details</h3>
                <label>Role:</label>
                <input type="text" name="role" id="adminRole" value="Site Administrator" readonly>
                <label>Last Login:</label>
                <input type="text" name="lastLogin" id="adminLastLogin" value="Never" readonly>
              </div>
              <div class="form-section admin-profile-photo-section">
                <h3>🖼️ Profile Photo</h3>
                <img id="adminProfilePicture" src="/images/silhouette-avatar.svg" alt="Profile Picture" style="width: 100px; height: 100px; object-fit: cover; border-radius: 50%; border: 2px solid #c7d0da; margin-bottom: 10px;">
                <input type="file" id="adminProfilePictureInput" accept="image/*">
              </div>
              <div class="form-section full-width">
                <h3>📝 Bio</h3>
                <label>About You:</label>
                <textarea name="bio" id="adminBio" rows="4" placeholder="Tell us about your responsibilities and experience..."></textarea>
              </div>
            </div>
            <button type="submit" class="submit-btn">💾 Save Profile</button>
          </form>
        </div>
        <div class="profile-section">
          <h2 class="section-title-small">CHANGE PASSWORD</h2>
          <form id="changePasswordForm">
            <div class="form-grid">
              <div class="form-section">
                <label>Current Password:</label>
                <input type="password" name="currentPassword" placeholder="Current Password" required>
                <label>New Password:</label>
                <input type="password" name="newPassword" placeholder="New Password" required>
                <label>Confirm New Password:</label>
                <input type="password" name="confirmPassword" placeholder="Confirm New Password" required>
              </div>
            </div>
            <button type="submit" class="submit-btn">🔒 Update Password</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
  <script>
    checkAuth('admin');
    loadAdminProfile();

    const DEFAULT_PROFILE_AVATAR = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" fill="%23eef2f7"/><circle cx="60" cy="45" r="23" fill="%2394a3b8"/><path d="M18 108c4-23 20-35 42-35s38 12 42 35" fill="%2394a3b8"/></svg>';

    function setAdminProfileImage(src) {
      const img = document.getElementById('adminProfilePicture');
      if (!img) return;
      img.onerror = function () {
        img.onerror = null;
        img.src = DEFAULT_PROFILE_AVATAR;
      };
      img.src = src || DEFAULT_PROFILE_AVATAR;
    }

    document.getElementById('adminProfilePictureInput').addEventListener('change', function () {
      const file = this.files && this.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        document.getElementById('adminProfilePicture').src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    function formatLastLogin(value) {
      if (!value) return 'Never';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return 'Unknown';
      return date.toLocaleString();
    }

    async function loadAdminProfile() {
      try {
        const res = await fetch('/api/admin/profile');
        if (!res.ok) return;
        const data = await res.json();
        document.getElementById('adminFullName').value = data.full_name || '';
        document.getElementById('adminEmail').value = data.email || '';
        document.getElementById('adminPhone').value = data.phone || '';
        document.getElementById('adminBio').value = data.bio || '';
        document.getElementById('adminLastLogin').value = formatLastLogin(data.last_login_at);
        setAdminProfileImage(data.profile_picture ? '/uploads/' + data.profile_picture : DEFAULT_PROFILE_AVATAR);
        // Optionally populate organization, title, experience if you add those fields to the form
      } catch (error) {
        setAdminProfileImage(DEFAULT_PROFILE_AVATAR);
      }
    }

    document.getElementById('adminProfileForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData();
      formData.append('fullName', document.getElementById('adminFullName').value);
      formData.append('email', document.getElementById('adminEmail').value);
      formData.append('phone', document.getElementById('adminPhone').value);
      formData.append('bio', document.getElementById('adminBio').value);
      const pictureInput = document.getElementById('adminProfilePictureInput');
      if (pictureInput.files && pictureInput.files[0]) {
        formData.append('profilePicture', pictureInput.files[0]);
      }

      try {
        const res = await fetch('/api/admin/profile', {
          method: 'POST',
          body: formData
        });
        if (res.ok) {
          alert('Profile updated successfully!');
          loadAdminProfile();
        } else {
          const error = await res.text();
          alert(error || 'Error updating profile');
        }
      } catch (error) {
        alert('Error updating profile');
      }
    });

    document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const currentPassword = e.target.currentPassword.value;
      const newPassword = e.target.newPassword.value;
      const confirmPassword = e.target.confirmPassword.value;
      if (newPassword !== confirmPassword) {
        alert('New passwords do not match!');
        return;
      }
      if (newPassword.length < 6) {
        alert('Password must be at least 6 characters long');
        return;
      }
      try {
        // Example: await fetch('/api/admin/change-password', { method: 'POST', ... })
        alert('Password updated successfully!');
        e.target.reset();
      } catch (error) {
        alert('Error updating password');
      }
    });
    function logout() {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
