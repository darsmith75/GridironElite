<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Player Profiles</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      margin: 0;
      background: linear-gradient(180deg, #f3f7ff 0%, #ffffff 38%);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: #1f2937;
    }
    .share-page {
      max-width: 1150px;
      margin: 0 auto;
      padding: 26px 16px 36px;
    }
    .shared-logo-link {
      display: inline-flex;
      align-items: center;
    }
    .share-header {
      margin-bottom: 16px;
    }
    .share-team-banner {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      border-radius: 14px;
      color: #fff;
      padding: 20px 28px;
      display: flex;
      align-items: center;
      gap: 18px;
      box-shadow: 0 8px 22px rgba(30, 60, 114, 0.2);
    }
    .share-team-icon {
      font-size: 44px;
      line-height: 1;
      flex-shrink: 0;
      width: 54px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 10px;
      background: rgba(255,255,255,0.15);
    }
    .share-team-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 8px;
      background: #fff;
      padding: 4px;
    }
    .share-team-text {
      flex: 1;
      min-width: 0;
    }
    .share-kicker {
      margin: 0 0 4px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.85;
      color: #ffffff;
    }
    .share-title {
      margin: 0 0 4px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #ffffff !important;
    }
    .share-subtitle {
      font-size: 14px;
      opacity: 0.85;
      margin: 0;
      color: #ffffff;
    }
    .share-meta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .share-pill {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.24);
      border-radius: 999px;
      padding: 5px 11px;
      font-weight: 600;
      font-size: 13px;
      color: #fff;
    }
    .share-message {
      margin-top: 12px;
      padding: 14px 16px;
      border: 1px solid #d3deef;
      border-radius: 12px;
      background: #f7faff;
      font-size: 14px;
      color: #27354f;
      white-space: pre-wrap;
    }
    .players-grid {
      margin-top: 14px;
    }
    .share-card-link-wrap {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .share-card-actions {
      display: flex;
      justify-content: center;
      align-items: center;
      align-self: stretch;
      width: 100%;
      height: 48px;
      padding: 0 12px;
      box-sizing: border-box;
      margin: 0;
      background: #d3deef;
      border-top: 1px solid #b7c6db;
      flex-shrink: 0;
    }
    .share-player-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 160px;
      height: 32px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid #b7c6db;
      background: #e4eaf4;
      color: #1f3c68;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
    }
    .share-player-link:hover {
      background: #d8e2f0;
    }
    .share-empty-photo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(#e0e0e0, #e0e0e0) padding-box,
                  linear-gradient(135deg, #d8dde3 0%, #b6bec8 32%, #8d97a3 58%, #c8cfd8 100%) border-box;
      border: 4px solid transparent;
      box-shadow: 0 4px 16px rgba(0,0,0,0.22);
      font-size: 12px;
      color: #757575;
      font-weight: 600;
      z-index: 10;
    }
    .status-box {
      background: #fff;
      border: 1px solid #d8e2f0;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(10, 30, 60, 0.08);
      padding: 26px;
      text-align: center;
      color: #1f2937;
      margin-top: 14px;
    }
    .status-box h2 {
      margin: 0 0 8px;
      color: #153766;
    }
    .status-box p {
      margin: 0;
      color: #465b7b;
    }
    @media (max-width: 720px) {
      .share-team-banner {
        flex-direction: column;
        text-align: center;
        padding: 18px 16px;
      }
      .share-title {
        white-space: normal;
      }
      .share-meta {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <header class="dashboard-header">
    <div class="header-content">
      <div class="header-left">
        <a href="recruiter-share.html" id="sharedLogoLink" class="shared-logo-link" aria-label="Shared Players Home">
          <img src="/images/GridIronLogoWhiteBG.png" alt="Gridiron Athletes" class="header-logo">
        </a>
      </div>
      <nav class="top-nav-menu" id="sharedTopNav"></nav>
    </div>
  </header>
  <div class="share-page">
    <div id="loadingBox" class="status-box">
      <h2>Loading Shared Player Profiles...</h2>
      <p>Please wait a moment.</p>
    </div>

    <div id="contentBox" style="display:none;">
      <div class="share-header">
        <div class="share-team-banner">
          <div class="share-team-icon" id="shareTeamIcon">🏈</div>
          <div class="share-team-text">
            <p class="share-kicker">Recruiter Selection</p>
            <h1 class="share-title" id="shareTitle">Shared Players</h1>
            <p class="share-subtitle" id="shareSubtitle">Coach-curated player list</p>
            <div class="share-meta">
              <span class="share-pill" id="coachNamePill"></span>
              <span class="share-pill" id="teamNamePill"></span>
              <span class="share-pill" id="countPill"></span>
              <span class="share-pill" id="expiresPill"></span>
            </div>
          </div>
        </div>
        <div id="shareMessage" class="share-message" style="display:none;"></div>
      </div>
      <div id="playersGrid" class="players-grid"></div>
    </div>

    <div id="errorBox" class="status-box" style="display:none;"></div>
  </div>

  <script src="app.js"></script>
  <script>
    const shareToken = new URLSearchParams(window.location.search).get('token');

    function escHtml(str) {
      if (str == null) return '';
      const div = document.createElement('div');
      div.textContent = String(str);
      return div.innerHTML;
    }

    function getRecruiterShareUrl() {
      return shareToken
        ? 'recruiter-share.html?token=' + encodeURIComponent(shareToken)
        : 'recruiter-share.html';
    }

    function renderSharedTopNav() {
      const shareUrl = getRecruiterShareUrl();
      const nav = document.getElementById('sharedTopNav');
      const logoLink = document.getElementById('sharedLogoLink');
      if (logoLink) {
        logoLink.href = shareUrl;
      }
      if (!nav) return;

      const homeLink = '<a href="' + shareUrl + '" class="nav-link">'
        + '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V10.5z"/><path d="M9 21V13h6v8"/></svg>'
        + 'Home</a>';
      nav.innerHTML = homeLink;
    }

    function renderError(message) {
      document.getElementById('loadingBox').style.display = 'none';
      const errorBox = document.getElementById('errorBox');
      errorBox.style.display = '';
      errorBox.innerHTML = '<h2>Unable to Open Share Link</h2><p>' + escHtml(message) + '</p>';
    }

    function formatHeightDisplay(heightValue) {
      const raw = String(heightValue || '').trim();
      if (!raw) return '';

      let match = raw.match(/^(\d+)\s*'\s*(\d+(?:\.\d+)?)?\s*"?$/);
      if (match) {
        const feet = Number(match[1] || '0');
        const inches = Number(match[2] || '0');
        const inchesText = Number.isInteger(inches) ? String(inches) : String(Number(inches.toFixed(1)));
        return feet + '\'' + inchesText + '"';
      }

      match = raw.match(/^(\d+)\s*(?:ft|feet)\s*(\d+(?:\.\d+)?)?\s*(?:in|inches)?$/i);
      if (match) {
        const feet = Number(match[1] || '0');
        const inches = Number(match[2] || '0');
        const inchesText = Number.isInteger(inches) ? String(inches) : String(Number(inches.toFixed(1)));
        return feet + '\'' + inchesText + '"';
      }

      return raw;
    }

    function hasVerifiedMetric(player) {
      if (!player || !player.metric_videos) return false;
      try {
        const metricVideos = JSON.parse(player.metric_videos);
        return Array.isArray(metricVideos) && metricVideos.some((video) => !!video?.is_verified);
      } catch (_) {
        return false;
      }
    }

    function renderTeamIcon(share) {
      const iconWrap = document.getElementById('shareTeamIcon');
      if (!iconWrap) return;
      if (share && share.schoolLogo) {
        iconWrap.innerHTML = '<img src="/uploads/' + escHtml(share.schoolLogo) + '" alt="School Logo">';
      } else {
        iconWrap.textContent = '🏈';
      }
    }

    function renderPlayers(players) {
      const grid = document.getElementById('playersGrid');
      grid.innerHTML = players.map((player) => {
        const photo = player.profile_picture ? '/uploads/' + encodeURI(player.profile_picture) : '';
        const name = escHtml(player.full_name || 'Player');
        const position = escHtml(player.position || 'Position not set');
        const school = escHtml(player.high_school || 'School not set');
        const year = escHtml(player.graduation_year || 'N/A');
        const height = escHtml(formatHeightDisplay(player.height) || 'N/A');
        const weight = player.weight ? escHtml(String(player.weight) + ' lbs') : 'N/A';
        const gpa = player.gpa != null ? escHtml(String(player.gpa)) : 'N/A';
        const hasVerifiedBadge = hasVerifiedMetric(player);

        return '<div class="player-card-compact">'
          + '<div class="share-card-link-wrap">'
          + '<div class="player-card-header">'
          + (photo
            ? '<img src="' + photo + '" alt="' + name + '" class="player-card-photo">'
            : '<div class="share-empty-photo">No Photo</div>')
          + '</div>'
          + '<div class="player-card-body">'
          + '<div class="player-info-section">'
          + '<h3>' + name + '</h3>'
          + '<p>' + position + '</p>'
          + '<p>' + school + '</p>'
          + '<p>Class of ' + year + '</p>'
          + '</div>'
          + '<div class="player-stats-compact">'
          + '<div class="stat-item"><div class="stat-label">Height</div><div class="stat-value">' + height + '</div></div>'
          + '<div class="stat-item"><div class="stat-label">Weight</div><div class="stat-value">' + weight + '</div></div>'
          + '<div class="stat-item"><div class="stat-label">GPA</div><div class="stat-value">' + gpa + '</div></div>'
          + '<div class="stat-item" title="' + escHtml(hasVerifiedBadge ? 'This athlete has at least one third-party verified athletic metric' : 'No third-party verified athletic metrics yet') + '">'
          + '<div class="stat-label">Verified</div>'
          + '<div class="stat-value verified-athlete-tile ' + (hasVerifiedBadge ? '' : 'verified-athlete-tile-empty') + '">'
          + (hasVerifiedBadge
            ? '<img src="/images/logos/verified-athlete.svg" alt="Verified Athlete" class="verified-athlete-image">'
            : 'Not Yet')
          + '</div></div>'
          + '</div></div>'
          + '<div class="share-card-actions">'
          + '<a class="share-player-link" href="/player-detail.html?id=' + encodeURIComponent(player.user_id) + '&shareToken=' + encodeURIComponent(shareToken || '') + '">Open Full Profile</a>'
          + '</div></div></div>';
      }).join('');
    }

    async function init() {
      renderSharedTopNav();

      if (!shareToken) {
        renderError('Missing share token.');
        return;
      }

      try {
        const response = await fetch('/api/recruiter-share/' + encodeURIComponent(shareToken));
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          renderError(data.error || 'This link is invalid or has expired.');
          return;
        }

        document.getElementById('loadingBox').style.display = 'none';
        document.getElementById('contentBox').style.display = '';

        const share = data.share || {};
        const players = Array.isArray(data.players) ? data.players : [];
        const headline = share.subject || 'Shared Player Profiles';
        document.getElementById('shareTitle').textContent = headline;
        document.getElementById('shareSubtitle').textContent = (share.teamName || 'Unknown Team')
          + (share.schoolName ? ' • ' + share.schoolName : '');
        document.getElementById('coachNamePill').textContent = 'Coach: ' + (share.coachName || 'Unknown');
        document.getElementById('teamNamePill').textContent = 'Team: ' + (share.teamName || 'Unknown Team');
        document.getElementById('countPill').textContent = players.length + ' Player' + (players.length === 1 ? '' : 's');
        document.getElementById('expiresPill').textContent = 'Expires: ' + (share.expiresAt ? new Date(share.expiresAt).toLocaleString() : 'N/A');
        renderTeamIcon(share);

        if (share.message) {
          const messageEl = document.getElementById('shareMessage');
          messageEl.style.display = '';
          messageEl.textContent = share.message;
        }

        renderPlayers(players);
      } catch (_) {
        renderError('Network error while loading shared players.');
      }
    }

    init();
  </script>
</body>
</html>
