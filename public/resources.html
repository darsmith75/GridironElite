<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Resources</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    .resources-shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 8px 0 40px;
    }
    .resources-back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      color: #1e3c72;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }
    .resources-back-link:hover { text-decoration: underline; }
    .resources-back-link:focus-visible,
    .resources-card:focus-visible { outline: 3px solid #c9962e; outline-offset: 3px; }
    .resources-hero {
      background: linear-gradient(135deg, #051f56 0%, #0a2f7c 60%, #1a4fa8 100%);
      border-radius: 8px;
      color: #fff;
      padding: 26px 28px;
      margin-bottom: 22px;
      box-shadow: 0 8px 28px rgba(5, 20, 70, 0.24);
    }
    .resources-hero h1 {
      margin: 0;
      font-family: 'Oswald', sans-serif;
      font-size: clamp(26px, 3.5vw, 38px);
      letter-spacing: 0;
      color: #fff;
    }
    .resources-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 15px;
    }
    .resources-grid[hidden], .resources-topic[hidden] { display: none; }
    body.player-profile-theme .resources-card {
      min-height: 206px;
      text-decoration: none;
    }
    body.player-profile-theme .resources-card .profile-action-icon {
      margin-bottom: 14px;
    }
    body.player-profile-theme .resources-card .profile-action-title {
      margin-bottom: 0;
    }
    .resources-topic { padding: 8px 0; }
    .resources-topic h2 {
      margin: 0 0 12px;
      color: #0f1f3f;
      font-family: 'Oswald', sans-serif;
      font-size: 26px;
    }
    .resources-topic p { margin: 0; color: #4f5f7a; font-size: 14px; }
    @media (max-width: 1024px) {
      .resources-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) {
      .resources-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .resources-hero { padding: 20px; }
    }
  </style>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body class="player-profile-theme">
  <div class="dashboard-wrapper">
    <header class="dashboard-header">
      <div class="header-content">
        <div class="header-left">
          <img src="/images/GridIronLogoWhiteBG.png" alt="" class="header-logo">
        </div>
        <nav class="top-nav-menu">
          <a href="agent-dashboard.html" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V10.5z"/><path d="M9 21V13h6v8"/></svg>
            Home
          </a>
          <a href="player-profile.html" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-3.866 3.582-7 8-7s8 3.134 8 7"/></svg>
            My Profile
          </a>
          <a href="#" onclick="logout(); return false;" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sign out
          </a>
        </nav>
      </div>
    </header>

    <div class="dashboard-container">
      <main class="resources-shell">
        <a href="player-profile.html" class="resources-back-link" id="resources-back">← Back to My Profile</a>
        <section class="resources-hero">
          <h1>Resources</h1>
        </section>

        <div class="resources-grid" id="resources-grid">
          <a class="profile-action-card resources-card" href="resources.html?topic=athletic-development"><span class="profile-action-icon" aria-hidden="true"><svg class="profile-action-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18"/><rect x="4" y="8" width="3" height="8" rx="1"/><rect x="17" y="8" width="3" height="8" rx="1"/><path d="M1 10v4m22-4v4"/></svg></span><span class="profile-action-title resources-card-title">Athletic Development</span><span class="profile-action-arrow" aria-hidden="true">›</span></a>
          <a class="profile-action-card resources-card" href="resources.html?topic=highlight-film"><span class="profile-action-icon" aria-hidden="true"><svg class="profile-action-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m10 8 6 4-6 4V8Z"/></svg></span><span class="profile-action-title resources-card-title">Highlight Film</span><span class="profile-action-arrow" aria-hidden="true">›</span></a>
          <a class="profile-action-card resources-card" href="resources.html?topic=social-media-communication"><span class="profile-action-icon" aria-hidden="true"><svg class="profile-action-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8A8.5 8.5 0 0 1 12.5 20a8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 12.5 3 8.5 8.5 0 0 1 21 11.5Z"/><path d="M8 11.5h9m-9 3h6"/></svg></span><span class="profile-action-title resources-card-title">Social Media &amp; Communication</span><span class="profile-action-arrow" aria-hidden="true">›</span></a>
          <a class="profile-action-card resources-card" href="resources.html?topic=camps-showcases"><span class="profile-action-icon" aria-hidden="true"><svg class="profile-action-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 8 16H4L12 3Z"/><path d="M12 12v7M2 21h20"/></svg></span><span class="profile-action-title resources-card-title">Camps &amp; Showcases</span><span class="profile-action-arrow" aria-hidden="true">›</span></a>
          <a class="profile-action-card resources-card" href="resources.html?topic=college-visits"><span class="profile-action-icon" aria-hidden="true"><svg class="profile-action-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m2 9 10-5 10 5-10 5L2 9Z"/><path d="M5 11v7c4 3 10 3 14 0v-7M22 9v8"/></svg></span><span class="profile-action-title resources-card-title">College Visits</span><span class="profile-action-arrow" aria-hidden="true">›</span></a>
          <a class="profile-action-card resources-card" href="resources.html?topic=recruiting-101"><span class="profile-action-icon" aria-hidden="true"><svg class="profile-action-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="18" rx="2"/><path d="M9 4V2h6v2m-7 10 2 2 5-5"/></svg></span><span class="profile-action-title resources-card-title">Recruiting 101</span><span class="profile-action-arrow" aria-hidden="true">›</span></a>
        </div>
        <section class="resources-topic" id="resources-topic" hidden>
          <h2 id="resources-topic-title"></h2>
          <p>Content coming soon.</p>
        </section>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    checkAuth('player');

    const topic = new URLSearchParams(window.location.search).get('topic');
    const selectedCard = [...document.querySelectorAll('.resources-card')].find(card => new URL(card.href).searchParams.get('topic') === topic);
    if (selectedCard && topic) {
      document.getElementById('resources-grid').hidden = true;
      document.getElementById('resources-topic-title').textContent = selectedCard.querySelector('.profile-action-title').textContent;
      document.getElementById('resources-topic').hidden = false;
      const backLink = document.getElementById('resources-back');
      backLink.href = 'resources.html';
      backLink.textContent = '← All Resources';
      document.title = document.getElementById('resources-topic-title').textContent + ' | Resources';
    }
  </script>
</body>
</html>
