<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Card</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="/vendor/html2canvas.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #000;
      font-family: 'Arial Black', Arial, sans-serif;
      color: #fff;
    }

    .card-container {
      max-width: 1200px;
      margin: 0 auto;
      border-radius: 20px;
      overflow: hidden;
      background: url('/images/PlayerCardBackground.png') no-repeat center center;
      background-size: cover;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .card-header {
      background: rgba(26, 41, 66, 0.68);
      padding: 28px 34px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .header-top {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 16px;
      align-items: center;
    }

    .school-logo {
      width: 78px;
      height: 78px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.94);
      object-fit: contain;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .school-logo-fallback {
      width: 78px;
      height: 78px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-family: 'Oswald', Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.95);
      background: rgba(8, 16, 28, 0.55);
    }

    .team-name {
      margin: 0;
      font-size: 52px;
      line-height: 1.04;
      font-family: 'Russo One', 'Arial Black', sans-serif;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #f5f9ff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7), 0 0 12px rgba(30, 60, 114, 0.55);
    }

    .school-line {
      margin-top: 6px;
      font-size: 16px;
      font-weight: 700;
      font-family: 'Oswald', Arial, sans-serif;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.65);
      background: rgba(5, 14, 28, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.35);
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
    }

    .team-meta {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-family: 'Oswald', Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 1.1px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.9);
    }

    .meta-pill {
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .card-body {
      background: rgba(26, 41, 66, 0.68);
      padding: 24px 28px 28px;
    }

    .section-title {
      margin: 0 0 14px 0;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
    }

    .players-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .player-tile {
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      background: rgba(10, 20, 35, 0.62);
      padding: 12px;
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 12px;
    }

    .player-photo {
      width: 72px;
      height: 88px;
      border-radius: 9px;
      object-fit: cover;
      background: rgba(5, 12, 22, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .player-name {
      margin: 0;
      font-size: 18px;
      font-family: 'Oswald', Arial, sans-serif;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: #fff;
    }

    .player-meta {
      margin-top: 4px;
      font-size: 12px;
      color: #d3ddef;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 700;
      line-height: 1.4;
    }

    .offers-wrap {
      margin-top: 8px;
    }

    .offers-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .offers-title {
      font-size: 11px;
      color: #9eb4dd;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 700;
      margin-bottom: 0;
    }

    .offers-count-badge {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: #ffffff;
      background: rgba(42, 82, 152, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 999px;
      padding: 2px 8px;
      white-space: nowrap;
    }

    .offers-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 6px;
    }

    .offer-logo {
      height: 28px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(11, 27, 54, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3px;
      box-sizing: border-box;
    }

    .offer-logo img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .offers-more {
      margin-top: 5px;
      font-size: 11px;
      color: #b8c8e6;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .no-offers {
      font-size: 11px;
      color: #a8bddf;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 700;
    }

    .empty-roster {
      text-align: center;
      padding: 34px 16px;
      color: #c0d1ee;
      border: 1px dashed rgba(255, 255, 255, 0.22);
      border-radius: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .button-bar {
      position: fixed;
      right: 20px;
      top: 20px;
      display: flex;
      gap: 10px;
      z-index: 1000;
    }

    .card-btn {
      padding: 10px 18px;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      cursor: pointer;
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      font-family: 'Oswald', Arial, sans-serif;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .card-btn:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.2);
    }

    .btn-export {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 4px 15px rgba(30, 60, 114, 0.45);
    }

    .btn-preview {
      background: rgba(255, 255, 255, 0.12);
    }

    .preview-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .preview-modal-content {
      background: #fff;
      border-radius: 12px;
      max-width: 90%;
      max-height: 90%;
      overflow: auto;
    }

    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      border-bottom: 1px solid #e0e0e0;
    }

    .preview-header h3 {
      margin: 0;
      color: #333;
      font-family: 'Oswald', Arial, sans-serif;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    .close-preview {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #666;
      width: 30px;
      height: 30px;
      line-height: 1;
      padding: 0;
    }

    .preview-body {
      padding: 20px;
      text-align: center;
    }

    .preview-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 20px;
      border-top: 1px solid #e0e0e0;
    }

    .preview-cancel-btn,
    .preview-export-btn {
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      border: 1px solid #e0e0e0;
    }

    .preview-cancel-btn {
      background: #f5f5f5;
      color: #333;
    }

    .preview-export-btn {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: #fff;
      border: none;
    }

    .btn-back {
      position: fixed;
      left: 20px;
      top: 20px;
    }

    @media (max-width: 1024px) {
      .team-name {
        font-size: 38px;
      }

      .players-grid {
        grid-template-columns: 1fr;
      }

      .offers-grid {
        grid-template-columns: repeat(8, minmax(0, 1fr));
      }
    }

    @media (max-width: 768px) {
      body {
        padding: 12px;
      }

      .card-container {
        border-radius: 14px;
        margin-bottom: 70px;
      }

      .card-header {
        padding: 18px 14px;
      }

      .card-body {
        padding: 14px;
      }

      .header-top {
        grid-template-columns: 58px 1fr;
        gap: 10px;
      }

      .school-logo,
      .school-logo-fallback {
        width: 58px;
        height: 58px;
        border-radius: 9px;
      }

      .team-name {
        font-size: 27px;
        letter-spacing: 1px;
      }

      .school-line {
        font-size: 12px;
      }

      .team-meta {
        margin-top: 10px;
        gap: 8px;
        font-size: 11px;
      }

      .player-tile {
        grid-template-columns: 56px 1fr;
        padding: 10px;
      }

      .player-photo {
        width: 56px;
        height: 72px;
      }

      .player-name {
        font-size: 16px;
      }

      .offers-grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }

      .btn-back {
        top: auto;
        bottom: 12px;
        left: 12px;
      }

      .button-bar {
        top: auto;
        bottom: 12px;
        right: 12px;
      }

      .card-btn {
        padding: 8px 10px;
        font-size: 11px;
      }

      .preview-modal-content {
        width: calc(100% - 16px);
        max-width: none;
      }

      .preview-header,
      .preview-body,
      .preview-footer {
        padding: 14px;
      }

      .preview-footer {
        justify-content: stretch;
      }

      .preview-cancel-btn,
      .preview-export-btn {
        flex: 1;
      }
    }

    @media print {
      body { background: #fff; }
      .btn-back,
      .button-bar { display: none; }
      .card-container { box-shadow: none; }
    }
  </style>
</head>
<body>
  <button class="card-btn btn-back" type="button" onclick="goBack()">Back</button>
  <div class="button-bar">
    <button class="card-btn btn-preview" id="previewBtn" type="button" onclick="openPreviewImage()">Preview</button>
    <button class="card-btn btn-export" id="exportBtn" type="button" onclick="exportTeamCard()">Export</button>
  </div>

  <div id="previewModal" class="preview-modal" style="display: none;">
    <div class="preview-modal-content">
      <div class="preview-header">
        <h3>Export Preview</h3>
        <button onclick="closePreview()" class="close-preview">✕</button>
      </div>
      <div class="preview-body">
        <img id="previewImage" src="" alt="Preview" style="max-width: 100%; max-height: 70vh; border-radius: 8px;">
      </div>
      <div class="preview-footer">
        <button onclick="closePreview()" class="preview-cancel-btn">Close</button>
        <button onclick="exportFromPreview()" id="previewExportBtn" class="preview-export-btn">Export This Image</button>
      </div>
    </div>
  </div>

  <div class="card-container" id="teamCard">
    <div class="card-header">
      <div class="header-top">
        <div id="schoolLogoContainer" class="school-logo-fallback">HS</div>
        <div>
          <h1 class="team-name" id="teamName">Loading Team...</h1>
          <div class="school-line" id="schoolLine">Loading school...</div>
        </div>
      </div>
      <div class="team-meta">
        <span class="meta-pill" id="metaLocation">Location: --</span>
        <span class="meta-pill" id="metaPlayers">Players: 0</span>
        <span class="meta-pill" id="metaOffers">Total Offer Logos: 0</span>
      </div>
    </div>

    <div class="card-body">
      <div class="section-title">Team Roster</div>
      <div id="playersContainer" class="players-grid"></div>
    </div>
  </div>

  <script>
    let teamData = null;
    let rosterData = [];
    let previewObjectUrl = null;

    function escHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function slugify(value) {
      return String(value || 'team-card')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '') || 'team-card';
    }

    function resolveImageUrl(rawPath) {
      const path = String(rawPath || '').trim();
      if (!path) return '';
      if (/^https?:\/\//i.test(path)) return path;
      if (path.startsWith('/')) return path;
      return '/api/upload-proxy?path=' + encodeURIComponent(path);
    }

    function parseOffers(player) {
      const raw = player && player.college_offer_schools;
      if (!raw) return [];

      let parsed = raw;
      if (typeof parsed === 'string') {
        try {
          parsed = JSON.parse(parsed);
        } catch (_) {
          return [];
        }
      }

      if (!Array.isArray(parsed)) return [];
      return parsed.filter((offer) => offer && offer.logo);
    }

    function formatPlayerMeta(player) {
      const pieces = [];
      if (player.position) pieces.push(String(player.position));
      if (player.graduation_year) pieces.push('Class ' + String(player.graduation_year));
      if (player.height) pieces.push(String(player.height));
      if (player.weight) pieces.push(String(player.weight) + ' lbs');
      return pieces.length ? pieces.join(' | ') : 'No measurable data';
    }

    function renderSchoolLogo() {
      const container = document.getElementById('schoolLogoContainer');
      const logoSrc = resolveImageUrl(teamData && teamData.school_logo);
      if (logoSrc) {
        container.outerHTML = '<img id="schoolLogoContainer" class="school-logo" src="' + escHtml(logoSrc) + '" alt="School Logo" onerror="this.style.display=\'none\'">';
      } else {
        const schoolName = String((teamData && teamData.school_name) || '').trim();
        const initials = schoolName
          .split(/\s+/)
          .filter(Boolean)
          .slice(0, 2)
          .map((part) => part.charAt(0).toUpperCase())
          .join('') || 'HS';
        container.textContent = initials;
      }
    }

    function renderHeader() {
      const teamName = (teamData && teamData.team_name) || 'Team';
      const schoolName = (teamData && teamData.school_name) || 'School';
      const city = (teamData && teamData.city) || '';
      const state = (teamData && teamData.state) || '';
      const location = [city, state].filter(Boolean).join(', ') || '--';

      document.getElementById('teamName').textContent = teamName;
      document.getElementById('schoolLine').textContent = schoolName;
      document.getElementById('metaLocation').textContent = 'Location: ' + location;
      document.getElementById('metaPlayers').textContent = 'Players: ' + rosterData.length;

      const totalOffers = rosterData.reduce((sum, player) => sum + parseOffers(player).length, 0);
      document.getElementById('metaOffers').textContent = 'Total Offer Logos: ' + totalOffers;

      renderSchoolLogo();
    }

    function renderPlayers() {
      const container = document.getElementById('playersContainer');
      if (!rosterData.length) {
        container.innerHTML = '<div class="empty-roster">No players currently in this roster.</div>';
        return;
      }

      container.innerHTML = rosterData.map((player) => {
        const photoSrc = resolveImageUrl(player.card_photo || player.profile_picture || '');
        const name = escHtml(player.full_name || 'Player');
        const meta = escHtml(formatPlayerMeta(player));
        const offers = parseOffers(player);

        let offersHtml = '';
        if (offers.length) {
          const logosToShow = offers.slice(0, 12);
          const offerCountLabel = offers.length === 1 ? '1 Offer' : (offers.length + ' Offers');
          offersHtml = '<div class="offers-wrap"><div class="offers-header"><div class="offers-title">Offer Logos</div><div class="offers-count-badge">' + escHtml(offerCountLabel) + '</div></div><div class="offers-grid">' +
            logosToShow.map((offer) => {
              const src = offer.logo ? ('/' + String(offer.logo).replace(/^\/+/, '')) : '';
              return '<div class="offer-logo"><img src="' + escHtml(src) + '" alt="' + escHtml(offer.name || 'College') + '"></div>';
            }).join('') +
            '</div>' +
            (offers.length > 12 ? ('<div class="offers-more">+' + (offers.length - 12) + ' more</div>') : '') +
            '</div>';
        } else {
          offersHtml = '<div class="offers-wrap"><div class="no-offers">No offer logos</div></div>';
        }

        const photoHtml = photoSrc
          ? '<img class="player-photo" src="' + escHtml(photoSrc) + '" alt="' + name + '" onerror="this.onerror=null;this.src=\'/images/silhouette-avatar.svg\';">'
          : '<img class="player-photo" src="/images/silhouette-avatar.svg" alt="No Photo">';

        return '<div class="player-tile">' +
          photoHtml +
          '<div>' +
            '<h3 class="player-name">' + name + '</h3>' +
            '<div class="player-meta">' + meta + '</div>' +
            offersHtml +
          '</div>' +
        '</div>';
      }).join('');
    }

    async function loadTeamCard() {
      try {
        const [teamRes, rosterRes] = await Promise.all([
          fetch('/api/coach/team'),
          fetch('/api/coach/team/roster')
        ]);

        if (!teamRes.ok) throw new Error('Unable to load team data.');
        if (!rosterRes.ok) throw new Error('Unable to load roster data.');

        teamData = await teamRes.json();
        rosterData = await rosterRes.json();
        if (!Array.isArray(rosterData)) rosterData = [];
        rosterData.sort((a, b) => {
          const offersA = parseOffers(a).length;
          const offersB = parseOffers(b).length;
          if (offersB !== offersA) return offersB - offersA;
          return String(a && a.full_name ? a.full_name : '').localeCompare(String(b && b.full_name ? b.full_name : ''));
        });

        renderHeader();
        renderPlayers();
      } catch (error) {
        alert(error && error.message ? error.message : 'Failed to load team card.');
      }
    }

    async function renderCardToCanvas() {
      const card = document.getElementById('teamCard');
      if (!card || !window.html2canvas) {
        throw new Error('Export is not available on this page.');
      }

      if (document.fonts && document.fonts.ready) {
        try { await document.fonts.ready; } catch (_) {}
      }

      const EXPORT_CARD_WIDTH = 1080;
      const EXPORT_CARD_HEIGHT = 1350;
      const attempts = [2, 1.5, 1];
      let lastError = null;

      for (const scale of attempts) {
        const exportRoot = document.createElement('div');
        exportRoot.style.position = 'fixed';
        exportRoot.style.left = '-100000px';
        exportRoot.style.top = '0';
        exportRoot.style.width = EXPORT_CARD_WIDTH + 'px';
        exportRoot.style.height = EXPORT_CARD_HEIGHT + 'px';
        exportRoot.style.overflow = 'hidden';
        exportRoot.style.pointerEvents = 'none';
        exportRoot.style.zIndex = '-1';
        exportRoot.style.display = 'flex';
        exportRoot.style.justifyContent = 'center';
        exportRoot.style.alignItems = 'flex-start';
        exportRoot.style.backgroundColor = '#0a1628';
        exportRoot.style.backgroundImage = "url('/images/PlayerCardBackground.png')";
        exportRoot.style.backgroundRepeat = 'no-repeat';
        exportRoot.style.backgroundPosition = 'center top';
        exportRoot.style.backgroundSize = 'cover';

        const clonedCard = card.cloneNode(true);
        clonedCard.id = 'teamCardExportClone';
        clonedCard.style.width = EXPORT_CARD_WIDTH + 'px';
        clonedCard.style.maxWidth = 'none';
        clonedCard.style.height = 'auto';
        clonedCard.style.minHeight = EXPORT_CARD_HEIGHT + 'px';
        clonedCard.style.margin = '0';
        clonedCard.style.borderRadius = '0';
        clonedCard.style.boxShadow = 'none';

        exportRoot.appendChild(clonedCard);
        document.body.appendChild(exportRoot);

        try {
          const canvas = await html2canvas(exportRoot, {
            backgroundColor: '#0a1628',
            scale,
            logging: false,
            useCORS: true,
            allowTaint: false,
            imageTimeout: 15000,
            width: EXPORT_CARD_WIDTH,
            height: EXPORT_CARD_HEIGHT,
            windowWidth: EXPORT_CARD_WIDTH,
            windowHeight: EXPORT_CARD_HEIGHT,
            scrollX: 0,
            scrollY: 0,
            onclone: (clonedDoc) => {
              const clonedExportCard = clonedDoc.getElementById('teamCardExportClone');
              if (clonedExportCard) {
                clonedExportCard.style.margin = '0';
                clonedExportCard.style.height = 'auto';
                clonedExportCard.style.minHeight = EXPORT_CARD_HEIGHT + 'px';
                clonedExportCard.style.boxShadow = 'none';
                clonedExportCard.style.borderRadius = '0';
              }
            }
          });

          document.body.removeChild(exportRoot);
          return canvas;
        } catch (error) {
          lastError = error;
          document.body.removeChild(exportRoot);
        }
      }

      throw lastError || new Error('Unable to render team card');
    }

    async function openPreviewImage() {
      const previewBtn = document.getElementById('previewBtn');
      const originalText = previewBtn.textContent;
      previewBtn.disabled = true;
      previewBtn.textContent = 'Preparing...';

      try {
        const canvas = await renderCardToCanvas();
        const blob = await new Promise((resolve, reject) => {
          canvas.toBlob((value) => {
            if (value) resolve(value);
            else reject(new Error('Preview generation failed.'));
          }, 'image/png');
        });

        if (previewObjectUrl) {
          URL.revokeObjectURL(previewObjectUrl);
        }
        previewObjectUrl = URL.createObjectURL(blob);
        document.getElementById('previewImage').src = previewObjectUrl;
        document.getElementById('previewModal').style.display = 'flex';
      } catch (error) {
        alert(error && error.message ? error.message : 'Could not generate preview.');
      } finally {
        previewBtn.disabled = false;
        previewBtn.textContent = originalText;
      }
    }

    function closePreview() {
      document.getElementById('previewModal').style.display = 'none';
      document.getElementById('previewImage').src = '';
      if (previewObjectUrl) {
        URL.revokeObjectURL(previewObjectUrl);
        previewObjectUrl = null;
      }
    }

    async function exportFromPreview() {
      const previewExportBtn = document.getElementById('previewExportBtn');
      const originalText = previewExportBtn.textContent;
      previewExportBtn.disabled = true;
      previewExportBtn.textContent = 'Exporting...';

      try {
        if (!previewObjectUrl) {
          throw new Error('No preview is available yet.');
        }
        const link = document.createElement('a');
        const name = slugify((teamData && teamData.team_name) || 'team-card');
        link.download = name + '-card.png';
        link.href = previewObjectUrl;
        link.click();
      } catch (error) {
        alert(error && error.message ? error.message : 'Could not export preview image.');
      } finally {
        previewExportBtn.disabled = false;
        previewExportBtn.textContent = originalText;
      }
    }

    async function exportTeamCard() {
      const btn = document.getElementById('exportBtn');

      const originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Exporting...';

      try {
        const canvas = await renderCardToCanvas();

        const link = document.createElement('a');
        const name = slugify((teamData && teamData.team_name) || 'team-card');
        link.download = name + '-card.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (_) {
        alert('Could not export the team card.');
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }

    function goBack() {
      if (document.referrer && document.referrer.indexOf(window.location.origin) === 0) {
        history.back();
      } else {
        window.location.href = 'coach-dashboard.html';
      }
    }

    loadTeamCard();
  </script>
</body>
</html>
