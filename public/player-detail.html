<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Profile</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .top-nav-menu {
      visibility: hidden;
    }
    .top-nav-menu.nav-ready {
      visibility: visible;
    }
    .shared-logo-link {
      display: inline-flex;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="dashboard-wrapper">
    <header class="dashboard-header">
      <div class="header-content">
        <div class="header-left">
          <a href="agent-dashboard.html" id="headerHomeLink" class="shared-logo-link" aria-label="Home">
            <img src="/images/GridIronLogoWhiteBG.png" alt="Gridiron Athletes" class="header-logo">
          </a>
        </div>
        <nav class="top-nav-menu" id="topNavMenu">
          <a href="agent-dashboard.html" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V10.5z"/><path d="M9 21V13h6v8"/></svg>
            Home
          </a>
          <a href="teams.html" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            Teams
          </a>
          <a href="agent-profile.html" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-3.866 3.582-7 8-7s8 3.134 8 7"/></svg>
            My Profile
          </a>
          <a href="#" onclick="logout(); return false;" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sign out
          </a>
        </nav>
      </div>
    </header>

    <div class="dashboard-container">
      <div id="playerDetail"></div>
    </div>
  </div>

  <div id="compareModal" onclick="if (event.target === this) closeCompareModal();" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.68); z-index:10040; padding:20px; overflow:auto;">
    <div style="max-width:980px; margin:40px auto; background:#fff; border-radius:18px; box-shadow:0 24px 70px rgba(0,0,0,0.24); overflow:hidden;">
      <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:22px 24px; border-bottom:1px solid #e4ebf3;">
        <div>
          <h2 style="margin:0; color:#1e3c72; font-size:22px;">Compare Metrics</h2>
          <p style="margin:6px 0 0; color:#6c7b8f; font-size:14px;">Compare this athlete against benchmark groups without any AI calls.</p>
        </div>
        <button type="button" onclick="closeCompareModal()" style="border:none; background:#eef3f9; color:#385884; width:38px; height:38px; border-radius:10px; font-size:20px; cursor:pointer;">×</button>
      </div>
      <div style="padding:22px 24px;">
        <div id="compareBenchmarkNote" style="display:none; margin-bottom:16px; padding:12px 14px; border-radius:12px; background:#f5f8fc; color:#526177; font-size:13px; line-height:1.5;"></div>
        <div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px;">
          <div>
            <label style="display:block; font-size:12px; font-weight:700; color:#6c7b8f; margin-bottom:6px;">Benchmark Level</label>
            <select id="compareLevelSelect" onchange="handleCompareLevelChange()" class="agent-sort-select">
              <option value="nfl">NFL</option>
              <option value="college_fbs">College FBS</option>
            </select>
          </div>
          <div>
            <label style="display:block; font-size:12px; font-weight:700; color:#6c7b8f; margin-bottom:6px;">Position Group</label>
            <select id="comparePositionSelect" onchange="renderCompareModalContent()" class="agent-sort-select"></select>
          </div>
          <div>
            <label style="display:block; font-size:12px; font-weight:700; color:#6c7b8f; margin-bottom:6px;">Benchmark Basis</label>
            <select id="compareBasisSelect" onchange="renderCompareModalContent()" class="agent-sort-select">
              <option value="p50">Median</option>
              <option value="prototype">Prototype</option>
            </select>
          </div>
        </div>
        <div id="compareSummaryCards"></div>
        <div id="compareMetricsTableWrap" style="margin-top:18px;"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let currentViewer = null;
    let reportCardPreviewEl = null;
    let benchmarkDataCache = null;
    let benchmarkDataPromise = null;
    let aiRatingCollapsed = false;
    const DETAIL_METRICS = [
      { key: 'forty_yard_dash', label: '40-Yard Dash', suffix: 's' },
      { key: 'vertical_jump', label: 'Vertical Jump', suffix: '"' },
      { key: 'bench_press', label: 'Bench Press', suffix: ' lbs' },
      { key: 'squat', label: 'Squat', suffix: ' lbs' },
      { key: 'shuttle_5_10_5', label: '5-10-5 Shuttle', suffix: 's' },
      { key: 'l_drill', label: 'L-Drill', suffix: 's' },
      { key: 'broad_jump', label: 'Broad Jump', suffix: '"' },
      { key: 'power_clean', label: 'Power Clean', suffix: ' lbs' },
      { key: 'single_leg_squat', label: 'Single Leg Squat', suffix: ' lbs' }
    ];
    const COMPARE_METRIC_ORDER = [
      'height_inches',
      'weight',
      'forty_yard_dash',
      'vertical_jump',
      'bench_press',
      'squat',
      'shuttle_5_10_5',
      'l_drill',
      'broad_jump',
      'power_clean'
    ];
    
    const urlParams = new URLSearchParams(window.location.search);
    const playerId = urlParams.get('id');
    const shareToken = urlParams.get('shareToken');

    function getDefaultHomePathForUser(user) {
      if (!user || !user.role) return '/';
      if (user.role === 'coach') return 'coach-dashboard.html';
      if (user.role === 'admin') return 'admin-dashboard.html';
      return 'agent-dashboard.html';
    }

    function getRecruiterShareUrl() {
      return shareToken
        ? 'recruiter-share.html?token=' + encodeURIComponent(shareToken)
        : 'recruiter-share.html';
    }

    function applyRecruiterShareTopNav() {
      const shareUrl = getRecruiterShareUrl();
      const nav = document.getElementById('topNavMenu');
      const homeLink = document.getElementById('headerHomeLink');
      if (homeLink) {
        homeLink.href = shareUrl;
      }
      if (nav) {
        const homeMarkup = '<a href="' + shareUrl + '" class="nav-link">'
          + '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V10.5z"/><path d="M9 21V13h6v8"/></svg>'
          + 'Home</a>';
        nav.innerHTML = homeMarkup;
      }
    }

    function markTopNavReady() {
      const nav = document.getElementById('topNavMenu');
      if (nav) nav.classList.add('nav-ready');
    }
    
    if (!playerId) {
      window.location.href = shareToken ? getRecruiterShareUrl() : 'agent-dashboard.html';
    }

    (async () => {
      if (shareToken) {
        // Shared-link mode intentionally ignores auth state to preserve recruiter flow.
        currentViewer = null;
        applyRecruiterShareTopNav();
        markTopNavReady();
        loadPlayerDetail();
        return;
      }

      const user = await tryAuth();
      currentViewer = user || null;
      if (currentViewer) {
        applyRoleBasedTopNav(currentViewer);
        const homeLink = document.getElementById('headerHomeLink');
        if (homeLink) {
          homeLink.href = getDefaultHomePathForUser(currentViewer);
        }
      } else {
        applyPublicTopNav();
        const homeLink = document.getElementById('headerHomeLink');
        if (homeLink) {
          homeLink.href = '/';
        }
      }
      markTopNavReady();
      loadPlayerDetail();
    })();

    function applyReadOnlyDetailMode() {
      const favoriteBtn = document.getElementById('favoriteBtn');
      if (favoriteBtn) {
        favoriteBtn.style.display = 'none';
      }

      document.querySelectorAll('#playerDetail button').forEach((btn) => {
        if (btn.id === 'favoriteBtn' || btn.id === 'compareMetricsBtn') return;
        btn.disabled = true;
        btn.setAttribute('aria-disabled', 'true');
        btn.title = 'Log in to interact';
        btn.style.opacity = '0.6';
        btn.style.cursor = 'not-allowed';
      });
    }

    function showReportCardPreview(event, imageUrl) {
      hideReportCardPreview();

      reportCardPreviewEl = document.createElement('div');
      reportCardPreviewEl.style.cssText = 'position:fixed; z-index:10001; background:#fff; border:1px solid #c7d0da; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,0.18); padding:8px; pointer-events:none;';
      reportCardPreviewEl.innerHTML = `
        <img src="${imageUrl}" alt="Report Card Preview" style="display:block; width:320px; max-width:50vw; max-height:60vh; object-fit:contain; border-radius:6px;">
      `;
      document.body.appendChild(reportCardPreviewEl);

      moveReportCardPreview(event);
    }

    function moveReportCardPreview(event) {
      if (!reportCardPreviewEl) return;

      const offset = 12;
      const rect = reportCardPreviewEl.getBoundingClientRect();
      let left = event.clientX + offset;
      let top = event.clientY + offset;

      if (left + rect.width > window.innerWidth - 10) {
        left = event.clientX - rect.width - offset;
      }
      if (top + rect.height > window.innerHeight - 10) {
        top = window.innerHeight - rect.height - 10;
      }
      if (top < 10) {
        top = 10;
      }

      reportCardPreviewEl.style.left = left + 'px';
      reportCardPreviewEl.style.top = top + 'px';
    }

    function hideReportCardPreview() {
      if (reportCardPreviewEl) {
        reportCardPreviewEl.remove();
        reportCardPreviewEl = null;
      }
    }

    function getMetricVideoMap(player) {
      const map = {};
      if (!player || !player.metric_videos) return map;
      try {
        const list = JSON.parse(player.metric_videos);
        list.forEach(item => {
          if (item && item.metric_key) {
            map[item.metric_key] = item;
          }
        });
      } catch (_) {}
      return map;
    }

    function formatBroadJumpFeetInches(totalInchesValue) {
      const total = Number(totalInchesValue);
      if (!Number.isFinite(total) || total <= 0) return '';
      const feet = Math.floor(total / 12);
      const inches = Number((total - (feet * 12)).toFixed(1));
      const inchesText = Number.isInteger(inches) ? String(inches) : String(inches);
      return `${feet}' ${inchesText}"`;
    }

    function buildDetailMetricCard(player, metric, metricVideoMap) {
      const value = player[metric.key];
      if (!value) return '';
      const media = metricVideoMap[metric.key] || null;
      const hasVideo = !!(media && media.video_filename);
      const isVerified = !!(media && media.is_verified);
      const verifiedBy = media && media.verified_by ? `Verified by ${media.verified_by}` : 'Verified by third party';
      const displayValue = metric.key === 'broad_jump'
        ? formatBroadJumpFeetInches(value)
        : `${value}${metric.suffix}`;
      const recordedAt = media && media.recorded_at
        ? new Date(media.recorded_at).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric', timeZone: 'UTC' })
        : null;
      const cardAttrs = hasVideo
        ? ` role="button" tabindex="0" aria-label="View ${metric.label} video" onclick="openMetricVideoLightbox('/uploads/${media.video_filename}', '${metric.label.replace(/'/g, '&#39;')}')" onkeydown="if(event.key === 'Enter' || event.key === ' '){event.preventDefault();openMetricVideoLightbox('/uploads/${media.video_filename}', '${metric.label.replace(/'/g, '&#39;')}');}"`
        : '';
      return `
        <div class="metric-item ${hasVideo ? 'metric-item-clickable' : ''}"${cardAttrs}>
          <div class="metric-label-row">
            <div class="metric-label">${metric.label}</div>
            ${isVerified ? `<span class="metric-verified-star" title="${verifiedBy}">★</span>` : ''}
          </div>
          <div class="metric-value">${displayValue}</div>
          <div class="metric-video-hint ${hasVideo ? '' : 'metric-video-hint-empty'}">${hasVideo ? 'View Video' : '&nbsp;'}</div>
          ${recordedAt ? `<div class="metric-recorded-date">${recordedAt}</div>` : ''}
        </div>
      `;
    }
    
    function getEmbedUrl(url) {
      try {
        const u = new URL(url);
        if (u.hostname.includes('youtube.com') && u.searchParams.get('v')) {
          return `https://www.youtube.com/embed/${u.searchParams.get('v')}`;
        }
        if (u.hostname === 'youtu.be') {
          return `https://www.youtube.com/embed${u.pathname}`;
        }
        const vimeoMatch = url.match(/vimeo\.com\/(\d+)/);
        if (vimeoMatch) {
          return `https://player.vimeo.com/video/${vimeoMatch[1]}`;
        }
        if (u.hostname.includes('hudl.com') && url.includes('/video/')) {
          return url.replace('/video/', '/embed/video/');
        }
        return null;
      } catch { return null; }
    }

    function formatHeightDisplay(heightValue) {
      const raw = String(heightValue || '').trim();
      if (!raw) return '';

      let m = raw.match(/^(\d+)\s*'\s*(\d+(?:\.\d+)?)?\s*"?$/);
      if (m) {
        const feet = Number(m[1] || '0');
        const inches = Number(m[2] || '0');
        if (!Number.isFinite(feet) || !Number.isFinite(inches)) return raw;
        const inchesText = Number.isInteger(inches) ? String(inches) : String(Number(inches.toFixed(1)));
        return `${feet}'${inchesText}"`;
      }

      m = raw.match(/^(\d+)\s*(?:ft|feet)\s*(\d+(?:\.\d+)?)?\s*(?:in|inches)?$/i);
      if (m) {
        const feet = Number(m[1] || '0');
        const inches = Number(m[2] || '0');
        if (!Number.isFinite(feet) || !Number.isFinite(inches)) return raw;
        const inchesText = Number.isInteger(inches) ? String(inches) : String(Number(inches.toFixed(1)));
        return `${feet}'${inchesText}"`;
      }

      const numeric = Number(raw);
      if (Number.isFinite(numeric) && numeric > 0) {
        const feet = Math.floor(numeric / 12);
        const inches = Number((numeric - (feet * 12)).toFixed(1));
        const inchesText = Number.isInteger(inches) ? String(inches) : String(inches);
        return `${feet}'${inchesText}"`;
      }

      return raw;
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatCompareNumber(value) {
      const numeric = Number(value);
      if (!Number.isFinite(numeric)) return 'N/A';
      return Number.isInteger(numeric) ? String(numeric) : numeric.toFixed(2);
    }

    function parseHeightToInches(heightValue) {
      const raw = String(heightValue || '').trim();
      if (!raw) return null;

      let m = raw.match(/^(\d+)\s*'\s*(\d+(?:\.\d+)?)?\s*"?$/);
      if (m) {
        const feet = Number(m[1] || '0');
        const inches = Number(m[2] || '0');
        return Number.isFinite(feet) && Number.isFinite(inches) ? feet * 12 + inches : null;
      }

      m = raw.match(/^(\d+)\s*(?:ft|feet)\s*(\d+(?:\.\d+)?)?\s*(?:in|inches)?$/i);
      if (m) {
        const feet = Number(m[1] || '0');
        const inches = Number(m[2] || '0');
        return Number.isFinite(feet) && Number.isFinite(inches) ? feet * 12 + inches : null;
      }

      const numeric = Number(raw);
      return Number.isFinite(numeric) && numeric > 0 ? numeric : null;
    }

    function formatBenchmarkMetricValue(metricKey, value, unit) {
      const numeric = Number(value);
      if (!Number.isFinite(numeric)) return 'N/A';
      if (metricKey === 'height_inches') {
        return formatHeightDisplay(numeric);
      }
      if (metricKey === 'broad_jump') {
        return formatBroadJumpFeetInches(numeric);
      }
      if (metricKey === 'weight' || metricKey === 'bench_press' || metricKey === 'squat' || metricKey === 'power_clean') {
        return `${formatCompareNumber(numeric)} lbs`;
      }
      if (metricKey === 'vertical_jump') {
        return `${formatCompareNumber(numeric)}"`;
      }
      if (metricKey === 'forty_yard_dash' || metricKey === 'shuttle_5_10_5' || metricKey === 'l_drill') {
        return `${formatCompareNumber(numeric)}s`;
      }
      return `${formatCompareNumber(numeric)}${unit ? ` ${unit}` : ''}`.trim();
    }

    function getPlayerMetricValue(player, metricKey) {
      if (!player) return null;
      if (metricKey === 'height_inches') {
        const numericHeight = Number(player.height_inches);
        if (Number.isFinite(numericHeight) && numericHeight > 0) return numericHeight;
        return parseHeightToInches(player.height);
      }
      const numeric = Number(player[metricKey]);
      return Number.isFinite(numeric) ? numeric : null;
    }

    function inferComparePositionGroup(position) {
      const raw = String(position || '').toUpperCase().trim();
      if (!raw) return 'WR';
      if (['QB'].includes(raw)) return 'QB';
      if (['RB', 'HB'].includes(raw)) return 'RB';
      if (['WR'].includes(raw)) return 'WR';
      if (['TE'].includes(raw)) return 'TE';
      if (['OL', 'OT', 'OG', 'C'].includes(raw)) return 'OL';
      if (['DL', 'DE', 'DT', 'EDGE'].includes(raw)) return 'DL';
      if (['LB', 'ILB', 'OLB'].includes(raw)) return 'LB';
      if (['CB'].includes(raw)) return 'CB';
      if (['S', 'FS', 'SS'].includes(raw)) return 'S';
      if (['K', 'P', 'PK'].includes(raw)) return 'KP';
      return raw;
    }

    async function loadBenchmarkData() {
      if (benchmarkDataCache) return benchmarkDataCache;
      if (benchmarkDataPromise) return benchmarkDataPromise;

      benchmarkDataPromise = fetch('/data/player-benchmarks.json', { cache: 'no-cache' })
        .then(async (res) => {
          if (!res.ok) {
            throw new Error(`Failed to load benchmark data (${res.status})`);
          }
          const data = await res.json();
          benchmarkDataCache = data;
          return data;
        })
        .finally(() => {
          benchmarkDataPromise = null;
        });

      return benchmarkDataPromise;
    }

    function updateBenchmarkNote(meta) {
      const noteEl = document.getElementById('compareBenchmarkNote');
      if (!noteEl) return;
      const note = meta && meta.note ? String(meta.note) : '';
      if (!note) {
        noteEl.style.display = 'none';
        noteEl.textContent = '';
        return;
      }
      noteEl.style.display = 'block';
      noteEl.textContent = note;
    }

    function populateComparePositionOptions(data, preferredGroup) {
      const level = document.getElementById('compareLevelSelect')?.value || 'nfl';
      const select = document.getElementById('comparePositionSelect');
      if (!select) return;
      const levelData = data && data.levels ? data.levels[level] : null;
      const groups = levelData ? Object.keys(levelData) : [];
      select.innerHTML = groups.map((group) => {
        const label = levelData[group]?.label || group;
        return `<option value="${escapeHtml(group)}">${escapeHtml(label)}</option>`;
      }).join('');
      const chosen = groups.includes(preferredGroup) ? preferredGroup : groups[0];
      if (chosen) select.value = chosen;
    }

    function handleCompareLevelChange() {
      if (!benchmarkDataCache) return;
      populateComparePositionOptions(benchmarkDataCache, inferComparePositionGroup(currentPlayerData?.position));
      renderCompareModalContent();
    }

    function getCompareStatus(metricMeta, playerValue) {
      const bestDirection = metricMeta.best_direction || 'higher';
      const p25 = Number(metricMeta.p25);
      const p50 = Number(metricMeta.p50);
      const p75 = Number(metricMeta.p75);
      const p90 = Number(metricMeta.p90);
      if (!Number.isFinite(playerValue)) return { label: 'Needs Data', rank: 0, color: '#64748b', bg: '#f1f5f9' };

      if (bestDirection === 'lower') {
        if (Number.isFinite(p25) && playerValue <= p25) return { label: 'Elite', rank: 4, color: '#166534', bg: '#dcfce7' };
        if (Number.isFinite(p50) && playerValue <= p50) return { label: 'Above Benchmark', rank: 3, color: '#0f766e', bg: '#ccfbf1' };
        if (Number.isFinite(p75) && playerValue <= p75) return { label: 'Around Benchmark', rank: 2, color: '#1d4ed8', bg: '#dbeafe' };
        return { label: 'Below Benchmark', rank: 1, color: '#b45309', bg: '#fef3c7' };
      }

      if (Number.isFinite(p90) && playerValue >= p90) return { label: 'Elite', rank: 4, color: '#166534', bg: '#dcfce7' };
      if (Number.isFinite(p75) && playerValue >= p75) return { label: 'Above Benchmark', rank: 3, color: '#0f766e', bg: '#ccfbf1' };
      if (Number.isFinite(p50) && playerValue >= p50) return { label: 'Around Benchmark', rank: 2, color: '#1d4ed8', bg: '#dbeafe' };
      return { label: 'Below Benchmark', rank: 1, color: '#b45309', bg: '#fef3c7' };
    }

    function formatCompareDelta(metricKey, playerValue, benchmarkValue, bestDirection) {
      if (!Number.isFinite(playerValue) || !Number.isFinite(benchmarkValue)) return 'Not enough data';
      const delta = playerValue - benchmarkValue;
      const absDelta = Math.abs(delta);
      const formattedAbs = metricKey === 'height_inches'
        ? formatCompareNumber(absDelta)
        : (metricKey === 'broad_jump' ? formatCompareNumber(absDelta) : formatCompareNumber(absDelta));

      if (delta === 0) return 'Matches benchmark';
      if (bestDirection === 'lower') {
        return delta < 0 ? `${formattedAbs} faster` : `${formattedAbs} slower`;
      }
      if (metricKey === 'height_inches' || metricKey === 'weight' || metricKey === 'vertical_jump' || metricKey === 'bench_press' || metricKey === 'squat' || metricKey === 'power_clean' || metricKey === 'broad_jump') {
        return delta > 0 ? `${formattedAbs} above` : `${formattedAbs} below`;
      }
      return delta > 0 ? `${formattedAbs} above` : `${formattedAbs} below`;
    }

    function buildCompareRows(groupData, basis) {
      const player = currentPlayerData;
      if (!player || !groupData || !groupData.metrics) return [];
      const rows = [];

      COMPARE_METRIC_ORDER.forEach((metricKey) => {
        const metricMeta = groupData.metrics[metricKey];
        if (!metricMeta) return;
        const playerValue = getPlayerMetricValue(player, metricKey);
        const benchmarkValue = Number(metricMeta[basis]);
        const status = getCompareStatus(metricMeta, playerValue);
        const baseline = Number.isFinite(benchmarkValue) ? benchmarkValue : Number(metricMeta.p50);
        const centerValue = Number(metricMeta.p50);
        const spread = Math.max(Math.abs(Number(metricMeta.p75) - Number(metricMeta.p25)), 1);
        let relativeScore = -999;
        if (Number.isFinite(playerValue) && Number.isFinite(centerValue)) {
          relativeScore = (metricMeta.best_direction === 'lower')
            ? (centerValue - playerValue) / spread
            : (playerValue - centerValue) / spread;
        }
        rows.push({
          key: metricKey,
          label: metricMeta.label || metricKey,
          unit: metricMeta.unit || '',
          playerValue,
          benchmarkValue: baseline,
          status,
          deltaLabel: formatCompareDelta(metricKey, playerValue, baseline, metricMeta.best_direction || 'higher'),
          relativeScore,
          metricMeta
        });
      });

      return rows;

      function getRatingColor(score) {
        if (score >= 85) return '#1a9e5c';
        if (score >= 70) return '#27ae60';
        if (score >= 55) return '#f39c12';
        if (score >= 40) return '#e67e22';
        return '#e74c3c';
      }

      function getRatingLabel(score) {
        if (score >= 85) return 'Elite';
        if (score >= 70) return 'Above Avg';
        if (score >= 55) return 'Average';
        if (score >= 40) return 'Below Avg';
        return 'Developing';
      }

      function buildRatingMeter(label, score, description) {
        const color = getRatingColor(score);
        return `
          <div style="margin-bottom:14px;">
            <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px;">
              <span style="font-size:13px; font-weight:600; color:#1e3c72;">${escapeHtml(label)}</span>
              <span style="font-size:13px; font-weight:700; color:${color};">${score} <span style="font-weight:400; font-size:11px; color:#7a8a9e;">${getRatingLabel(score)}</span></span>
            </div>
            <div style="background:#e8edf2; border-radius:6px; height:10px; overflow:hidden;">
              <div style="width:${score}%; background:${color}; height:100%; border-radius:6px; transition:width 0.6s ease;"></div>
            </div>
            ${description ? `<p style="margin:5px 0 0; font-size:12px; color:#7a8a9e; line-height:1.4;">${escapeHtml(description)}</p>` : ''}
          </div>`;
      }

      function renderRatingData(data) {
        const overallColor = getRatingColor(data.overallScore);
        const overallLabel = getRatingLabel(data.overallScore);
        const categoriesHtml = (data.categories || []).map(c => buildRatingMeter(c.name, c.score, c.description)).join('');
        return `
          <div class="rating-summary" style="display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start;">
            <div style="text-align:center; min-width:90px;">
              <div style="width:88px; height:88px; border-radius:50%; background:${overallColor}; display:flex; flex-direction:column; align-items:center; justify-content:center; margin:0 auto 6px;">
                <span style="font-size:28px; font-weight:800; color:#fff; line-height:1;">${data.overallScore}</span>
                <span style="font-size:9px; font-weight:600; color:rgba(255,255,255,0.85); letter-spacing:0.5px; text-transform:uppercase;">Overall</span>
              </div>
              <span style="font-size:12px; font-weight:600; color:${overallColor};">${overallLabel}</span>
            </div>
          </div>
          <div class="rating-breakdown" style="display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start;">
            <div style="flex:1; min-width:220px;">${categoriesHtml}</div>
          </div>
          <p class="rating-note" style="font-size:11px; color:#b0b8c5;">AI-generated estimate based on reported metrics. Not an official recruiting evaluation.</p>`;
      }

      async function saveCoachComment() {
        const input = document.getElementById('coachCommentInput');
        const status = document.getElementById('coachCommentStatus');
        const text = input.value.trim();
        if (!text) { status.textContent = 'Please enter a comment.'; status.style.color = '#e74c3c'; return; }
        status.textContent = 'Saving...'; status.style.color = '#76849b';
        try {
          const res = await fetch(`/api/coach/players/${playerId}/comment`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ comment: text })
          });
          const data = await res.json();
          if (!res.ok) { status.textContent = data.error || 'Failed to save.'; status.style.color = '#e74c3c'; return; }
          status.textContent = 'Saved!'; status.style.color = '#28a745';
          document.getElementById('deleteCoachCommentBtn').style.display = '';
          setTimeout(() => { status.textContent = ''; }, 2000);
        } catch (err) {
          status.textContent = 'Error saving comment.'; status.style.color = '#e74c3c';
        }
      }

      async function deleteCoachComment() {
        if (!confirm('Delete your comment on this player?')) return;
        const status = document.getElementById('coachCommentStatus');
        status.textContent = 'Deleting...'; status.style.color = '#76849b';
        try {
          const res = await fetch(`/api/coach/players/${playerId}/comment`, { method: 'DELETE' });
          const data = await res.json();
          if (!res.ok) { status.textContent = data.error || 'Failed to delete.'; status.style.color = '#e74c3c'; return; }
          document.getElementById('coachCommentInput').value = '';
          document.getElementById('deleteCoachCommentBtn').style.display = 'none';
          document.getElementById('coachCommentsList').innerHTML = '';
          status.textContent = 'Comment deleted.'; status.style.color = '#28a745';
          setTimeout(() => { status.textContent = ''; }, 2000);
        } catch (err) {
          status.textContent = 'Error deleting comment.'; status.style.color = '#e74c3c';
        }
      }

                      ${player.mother_email ? `<p><strong>Email:</strong> <a href="mailto:${player.mother_email}">${player.mother_email}</a></p>` : ''}

                      ${player.coach_email ? `<p><strong>Email:</strong> <a href="mailto:${player.coach_email}">${player.coach_email}</a></p>` : ''}
                      ${player.coach_phone ? `<p><strong>Phone:</strong> <a href="tel:${player.coach_phone}">${player.coach_phone}</a></p>` : ''}

    async function checkFavoriteStatus() {
      try {
        const res = await fetch(`/api/agent/favorites/${currentPlayerData.user_id}`);
        const data = await res.json();
        updateFavoriteButton(data.isFavorite);
      } catch (error) {
        console.error('Error checking favorite status:', error);
      }
    }
    
    function updateFavoriteButton(isFavorite) {
      const btn = document.getElementById('favoriteBtn');
      const icon = document.getElementById('favoriteBtnIcon');
      const text = document.getElementById('favoriteBtnText');
      
      if (isFavorite) {
        icon.textContent = '⭐';
        text.textContent = 'Favorite';
        btn.classList.add('favorited');
      } else {
        icon.textContent = '☆';
        text.textContent = 'Favorite';
        btn.classList.remove('favorited');
      }
    }
    
    async function toggleFavoriteDetail() {
      if (!currentViewer) {
        return;
      }
      const btn = document.getElementById('favoriteBtn');
      const isFavorite = btn.classList.contains('favorited');
      
      try {
        if (isFavorite) {
          await fetch(`/api/agent/favorites/${currentPlayerData.user_id}`, { method: 'DELETE' });
          updateFavoriteButton(false);
        } else {
          await fetch(`/api/agent/favorites/${currentPlayerData.user_id}`, { method: 'POST' });
          updateFavoriteButton(true);
        }
      } catch (error) {
        console.error('Error toggling favorite:', error);
        alert('Failed to update favorite');
      }
    }
    
    // Lightbox functionality for images

      lightbox.className = 'lightbox';
      lightbox.innerHTML = `
        <div class="lightbox-content">
          <span class="lightbox-close">&times;</span>
          <img src="${imageSrc}" alt="Enlarged image">
        </div>
      `;
      document.body.appendChild(lightbox);
      
      // Close on click
      lightbox.addEventListener('click', function(e) {
        if (e.target === lightbox || e.target.className === 'lightbox-close') {
          document.body.removeChild(lightbox);
        }
      });
      
      // Close on escape key
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && document.querySelector('.lightbox')) {
          const lb = document.querySelector('.lightbox');
          if (lb) document.body.removeChild(lb);
        }
        if (e.key === 'Escape' && document.getElementById('compareModal')?.style.display === 'block') {

        }

    // Export player data to Excel
    function exportPlayerData() {
      if (!currentViewer) {
        return;
      }
      if (!currentPlayerData) {
        alert('No player data available to export');
        return;
      }
      
      const player = currentPlayerData;
      
      // Helper function to escape HTML/XML special characters
      function escapeXml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&apos;');
      }
      
      // Build Excel XML format
      let excel = '<?xml version="1.0" encoding="UTF-8"?>\n';
      excel += '<?mso-application progid="Excel.Sheet"?>\n';
      excel += '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"\n';
      excel += ' xmlns:o="urn:schemas-microsoft-com:office:office"\n';
      excel += ' xmlns:x="urn:schemas-microsoft-com:office:excel"\n';
      excel += ' xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"\n';
      excel += ' xmlns:html="http://www.w3.org/TR/REC-html40">\n\n';
      
      // Styles
      excel += ' <Styles>\n';
      excel += '  <Style ss:ID="Header">\n';
      excel += '   <Font ss:Bold="1" ss:Size="12" ss:Color="#FFFFFF"/>\n';
      excel += '   <Interior ss:Color="#4a6fa5" ss:Pattern="Solid"/>\n';
      excel += '   <Alignment ss:Horizontal="Left" ss:Vertical="Center"/>\n';
      excel += '  </Style>\n';
      excel += '  <Style ss:ID="SectionHeader">\n';
      excel += '   <Font ss:Bold="1" ss:Size="14" ss:Color="#1e3c72"/>\n';
      excel += '   <Interior ss:Color="#e9ecef" ss:Pattern="Solid"/>\n';
      excel += '   <Alignment ss:Horizontal="Left" ss:Vertical="Center"/>\n';
      excel += '  </Style>\n';
      excel += '  <Style ss:ID="Label">\n';
      excel += '   <Font ss:Bold="1" ss:Size="10"/>\n';
      excel += '   <Alignment ss:Horizontal="Right" ss:Vertical="Center"/>\n';
      excel += '  </Style>\n';
      excel += '  <Style ss:ID="Data">\n';
      excel += '   <Alignment ss:Horizontal="Left" ss:Vertical="Center"/>\n';
      excel += '  </Style>\n';
      excel += ' </Styles>\n\n';
      
      excel += ' <Worksheet ss:Name="Player Profile">\n';
      excel += '  <Table>\n';
      excel += '   <Column ss:Width="200"/>\n';
      excel += '   <Column ss:Width="300"/>\n\n';
      
      // Helper function to add a section header
      function addSectionHeader(title) {
        return `   <Row>\n    <Cell ss:StyleID="SectionHeader" ss:MergeAcross="1"><Data ss:Type="String">${escapeXml(title)}</Data></Cell>\n   </Row>\n`;
      }
      
      // Helper function to add a data row
      function addDataRow(label, value) {
        if (value !== null && value !== undefined && value !== '') {
          return `   <Row>\n    <Cell ss:StyleID="Label"><Data ss:Type="String">${escapeXml(label)}</Data></Cell>\n    <Cell ss:StyleID="Data"><Data ss:Type="String">${escapeXml(value)}</Data></Cell>\n   </Row>\n`;
        }
        return '';
      }
      
      // Helper function to add empty row
      function addEmptyRow() {
        return '   <Row/>\n';
      }
      
      // Title Row
      excel += '   <Row>\n';
      excel += '    <Cell ss:StyleID="Header" ss:MergeAcross="1"><Data ss:Type="String">PLAYER PROFILE REPORT</Data></Cell>\n';
      excel += '   </Row>\n';
      excel += addEmptyRow();
      
      // Basic Information
      excel += addSectionHeader('BASIC INFORMATION');
      excel += addDataRow('Full Name', player.full_name);
      excel += addDataRow('Position', player.position);
      excel += addDataRow('High School', player.high_school);
      excel += addDataRow('Graduation Year', player.graduation_year);
      excel += addDataRow('Email', player.email);
      excel += addEmptyRow();
      
      // Physical Attributes
      excel += addSectionHeader('PHYSICAL ATTRIBUTES');
      excel += addDataRow('Height', formatHeightDisplay(player.height));
      excel += addDataRow('Weight', player.weight ? `${player.weight} lbs` : null);
      excel += addEmptyRow();
      
      // Academic Information
      if (player.gpa || player.achievement) {
        excel += addSectionHeader('ACADEMIC INFORMATION');
        excel += addDataRow('GPA', player.gpa);
        excel += addDataRow('Achievement', player.achievement);
        excel += addEmptyRow();
      }
      
      // Athletic Metrics
      const hasMetrics = player.forty_yard_dash || player.vertical_jump || player.bench_press || 
                        player.squat || player.shuttle_5_10_5 || player.l_drill || 
                        player.broad_jump || player.power_clean || player.single_leg_squat;
      
      if (hasMetrics) {
        excel += addSectionHeader('ATHLETIC METRICS');
        excel += addDataRow('40-Yard Dash', player.forty_yard_dash ? `${player.forty_yard_dash} seconds` : null);
        excel += addDataRow('Vertical Jump', player.vertical_jump ? `${player.vertical_jump} inches` : null);
        excel += addDataRow('Bench Press', player.bench_press ? `${player.bench_press} lbs` : null);
        excel += addDataRow('Squat', player.squat ? `${player.squat} lbs` : null);
        excel += addDataRow('5-10-5 Shuttle', player.shuttle_5_10_5 ? `${player.shuttle_5_10_5} seconds` : null);
        excel += addDataRow('L-Drill', player.l_drill ? `${player.l_drill} seconds` : null);
        excel += addDataRow('Broad Jump', player.broad_jump ? formatBroadJumpFeetInches(player.broad_jump) : null);
        excel += addDataRow('Power Clean', player.power_clean ? `${player.power_clean} lbs` : null);
        excel += addDataRow('Single Leg Squat', player.single_leg_squat ? `${player.single_leg_squat} lbs` : null);
        excel += addEmptyRow();
      }
      
      // Biography
      if (player.bio) {
        excel += addSectionHeader('BIOGRAPHY');
        excel += addDataRow('About', player.bio);
        excel += addEmptyRow();
      }
      
      // Social Media
      const hasSocial = player.hudl_link || player.instagram_link || player.twitter_link;
      if (hasSocial) {
        excel += addSectionHeader('SOCIAL MEDIA');
        if (player.hudl_link) {
          excel += addDataRow('Hudl URL', player.hudl_link);
          excel += addDataRow('Hudl Username', player.hudl_username);
        }
        if (player.instagram_link) {
          excel += addDataRow('Instagram URL', player.instagram_link);
          excel += addDataRow('Instagram Username', player.instagram_username);
        }
        if (player.twitter_link) {
          excel += addDataRow('Twitter/X URL', player.twitter_link);
          excel += addDataRow('Twitter/X Username', player.twitter_username);
        }
        excel += addEmptyRow();
      }
      
      // Contact Information - Father
      if (player.father_name || player.father_email || player.father_phone) {
        excel += addSectionHeader('FATHER CONTACT');
        excel += addDataRow('Name', player.father_name);
        excel += addDataRow('Email', player.father_email);
        excel += addDataRow('Phone', player.father_phone);
        excel += addEmptyRow();
      }
      
      // Contact Information - Mother
      if (player.mother_name || player.mother_email || player.mother_phone) {
        excel += addSectionHeader('MOTHER CONTACT');
        excel += addDataRow('Name', player.mother_name);
        excel += addDataRow('Email', player.mother_email);
        excel += addDataRow('Phone', player.mother_phone);
        excel += addEmptyRow();
      }
      
      // Contact Information - Coach
      if (player.coach_name || player.coach_email || player.coach_phone) {
        excel += addSectionHeader('COACH CONTACT');
        excel += addDataRow('Name', player.coach_name);
        excel += addDataRow('Email', player.coach_email);
        excel += addDataRow('Phone', player.coach_phone);
        excel += addEmptyRow();
      }
      
      // Media Files
      if (player.profile_picture) {
        excel += addSectionHeader('PROFILE PICTURE');
        excel += addDataRow('Filename', player.profile_picture);
        excel += addDataRow('URL', `${window.location.origin}/uploads/${player.profile_picture}`);
        excel += addEmptyRow();
      }
      
      if (player.highlight_videos) {
        const videos = JSON.parse(player.highlight_videos);
        if (videos.length > 0) {
          excel += addSectionHeader('HIGHLIGHT VIDEOS');
          videos.forEach((video, index) => {
            excel += addDataRow(`Video ${index + 1}`, video);
            excel += addDataRow(`Video ${index + 1} URL`, `${window.location.origin}/uploads/${video}`);
          });
          excel += addEmptyRow();
        }
      }

      if (player.video_links) {
        const links = JSON.parse(player.video_links);
        if (links.length > 0) {
          excel += addSectionHeader('LINKED HIGHLIGHT VIDEOS');
          links.forEach((link, index) => {
            excel += addDataRow(`Link ${index + 1}`, link.title || '');
            excel += addDataRow(`Link ${index + 1} URL`, link.url);
          });
          excel += addEmptyRow();
        }
      }
      
      if (player.additional_images) {
        const images = JSON.parse(player.additional_images);
        if (images.length > 0) {
          excel += addSectionHeader('ADDITIONAL IMAGES');
          images.forEach((img, index) => {
            excel += addDataRow(`Image ${index + 1}`, img);
            excel += addDataRow(`Image ${index + 1} URL`, `${window.location.origin}/uploads/${img}`);
          });
          excel += addEmptyRow();
        }
      }
      
      if (player.college_offer_schools) {
        const offers = JSON.parse(player.college_offer_schools);
        if (offers.length > 0) {
          excel += addSectionHeader('COLLEGE OFFERS');
          offers.forEach((offer, index) => {
            excel += addDataRow(`Offer ${index + 1}`, offer.name || '');
            if (offer.conference) excel += addDataRow(`Conference`, offer.conference);
          });
          excel += addEmptyRow();
        }
      }
      
      excel += '  </Table>\n';
      excel += ' </Worksheet>\n';
      excel += '</Workbook>';
      
      // Create download
      const blob = new Blob([excel], { type: 'application/vnd.ms-excel' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${player.full_name.replace(/\s+/g, '_')}_Profile.xls`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      window.URL.revokeObjectURL(url);
    }

    // College Logo Ordering - Helper Functions
    function applySavedCollegeOrder(group, schools) {
      if (!Array.isArray(schools) || schools.length === 0) return Array.isArray(schools) ? schools : [];
      
      // Get order from server (currentPlayerData.college_logo_order)
      let orderState = {};
      if (currentPlayerData && currentPlayerData.college_logo_order) {
        try {
          // Handle both string and object formats
          if (typeof currentPlayerData.college_logo_order === 'string') {
            const parsed = JSON.parse(currentPlayerData.college_logo_order);
            orderState = parsed && typeof parsed === 'object' ? parsed : {};
          } else {
            orderState = currentPlayerData.college_logo_order;
          }
        } catch (err) {
          console.warn('Failed to parse college_logo_order:', err);
          orderState = {};
        }
      }
      
      if (!orderState || typeof orderState !== 'object') orderState = {};
      
      const ids = Array.isArray(orderState[group]) ? orderState[group].map(id => Number(id)) : [];
      if (ids.length === 0) return schools;

      const indexMap = new Map(ids.map((id, index) => [id, index]));
      return [...schools].sort((a, b) => {
        const ai = indexMap.has(Number(a.id)) ? indexMap.get(Number(a.id)) : Number.MAX_SAFE_INTEGER;
        const bi = indexMap.has(Number(b.id)) ? indexMap.get(Number(b.id)) : Number.MAX_SAFE_INTEGER;
        if (ai !== bi) return ai - bi;
        return String(a.name || '').localeCompare(String(b.name || ''));
      });
    }
