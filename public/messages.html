<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dashboard-wrapper">
    <header class="dashboard-header">
      <div class="header-content">
        <div class="header-left">
          <img src="/images/GridIronLogoWhiteBG.png" alt="" class="header-logo">
        </div>
        <nav class="top-nav-menu">
          <a href="#" id="homeLink" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V10.5z"/><path d="M9 21V13h6v8"/></svg>
            Home
          </a>
          <a href="#" id="profileLink" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-3.866 3.582-7 8-7s8 3.134 8 7"/></svg>
            My Profile
          </a>
          <a href="#" onclick="logout(); return false;" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sign out
          </a>
        </nav>
      </div>
    </header>

    <div class="dashboard-container">
      <div class="messages-container">
        <!-- Conversations List -->
        <div class="conversations-panel">
          <h2>Conversations</h2>
          <div class="messages-admin-toolbar">
            <label class="messages-toolbar-label" for="retentionDays">Purge older than</label>
            <div class="messages-toolbar-row">
              <select id="retentionDays" class="messages-toolbar-select">
                <option value="30">30 days</option>
                <option value="90" selected>90 days</option>
                <option value="180">180 days</option>
                <option value="365">365 days</option>
                <option value="0">All messages</option>
              </select>
              <button type="button" class="message-danger-btn" onclick="purgeMessages()">Purge</button>
            </div>
            <div id="messagesStatus" class="messages-status" aria-live="polite"></div>
          </div>
          <div id="conversationsList"></div>
        </div>

        <!-- Messages Panel -->
        <div class="messages-panel">
          <div id="messagesHeader" class="messages-header">
            <div class="messages-header-row">
              <div>
                <h3 id="messagesHeaderTitle">Select a conversation</h3>
                <p id="messagesHeaderSubtitle">Select a conversation to view messages</p>
              </div>
              <button id="deleteConversationBtn" type="button" class="message-danger-btn" style="display: none;" onclick="deleteConversation()">Delete Conversation</button>
            </div>
          </div>
          <div id="messagesContent" class="messages-content"></div>
          <div id="messageInput" class="message-input-container" style="display: none;">
            <textarea id="messageText" placeholder="Type your message..." rows="3"></textarea>
            <button onclick="sendMessage()" class="send-btn">Send</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let currentRole = '';
    let currentUserId = null;
    let currentConversationUserId = null;
    let currentConversationUserName = '';

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatRoleLabel(role) {
      if (role === 'admin') return 'Admin';
      if (role === 'agent') return 'Agent';
      if (role === 'coach') return 'Coach';
      return 'Player';
    }

    function setStatus(message, type = 'info') {
      const statusEl = document.getElementById('messagesStatus');
      if (!statusEl) return;

      statusEl.textContent = message || '';
      statusEl.className = `messages-status ${type}`;
    }

    function setConversationHeader(userName = '', showDelete = false) {
      const titleEl = document.getElementById('messagesHeaderTitle');
      const subtitleEl = document.getElementById('messagesHeaderSubtitle');
      const deleteBtn = document.getElementById('deleteConversationBtn');

      if (titleEl) {
        titleEl.textContent = userName || 'Select a conversation';
      }

      if (subtitleEl) {
        subtitleEl.textContent = userName ? 'Review, delete, or continue this conversation.' : 'Select a conversation to view messages';
      }

      if (deleteBtn) {
        deleteBtn.style.display = showDelete ? '' : 'none';
      }
    }

    function setSelectedConversation(userId) {
      document.querySelectorAll('.conversation-item').forEach(item => {
        item.classList.toggle('selected', Number(item.dataset.userId) === Number(userId));
      });
    }

    async function init() {
      const user = await checkAuth('admin');
      if (!user) {
        return;
      }

      currentRole = user.role;
      currentUserId = user.id;
      
      loadConversations();
      
      // Check if there's a userId parameter to open a specific conversation
      const urlParams = new URLSearchParams(window.location.search);
      const userId = urlParams.get('userId');
      if (userId) {
        // Load messages with this user
        setTimeout(() => {
          // Find the conversation in the list to get the name
          const convItems = document.querySelectorAll('.conversation-item');
          let userName = 'User';
          convItems.forEach(item => {
            if (item.onclick.toString().includes(userId)) {
              userName = item.querySelector('.conversation-name').textContent;
            }
          });
          loadMessages(parseInt(userId), userName);
        }, 500);
      }
      
      // Auto-refresh conversations every 10 seconds
      setInterval(loadConversations, 10000);
    }

    async function loadConversations() {
      try {
        const res = await fetch('/api/messages/conversations');
        const conversations = await res.json();
        
        const list = document.getElementById('conversationsList');
        
        if (conversations.length === 0) {
          list.innerHTML = '<p class="no-conversations">No conversations yet</p>';
          if (currentConversationUserId) {
            currentConversationUserId = null;
            currentConversationUserName = '';
            setConversationHeader('', false);
            document.getElementById('messagesContent').innerHTML = '';
            document.getElementById('messageInput').style.display = 'none';
          }
          return;
        }
        
        list.innerHTML = conversations.map(conv => `
          <div class="conversation-item ${conv.unread_count > 0 ? 'unread' : ''} ${Number(currentConversationUserId) === Number(conv.other_user_id) ? 'selected' : ''}" data-user-id="${conv.other_user_id}"
               onclick='loadMessages(${conv.other_user_id}, ${JSON.stringify(conv.full_name || conv.email)})'>
            <div class="conversation-info">
              <div class="conversation-name">${conv.full_name || conv.email}</div>
              <div class="conversation-role">${formatRoleLabel(conv.role)}</div>
            </div>
            <div class="conversation-preview">
              <div class="last-message">${conv.last_message ? conv.last_message.substring(0, 50) + (conv.last_message.length > 50 ? '...' : '') : ''}</div>
              ${conv.unread_count > 0 ? `<span class="unread-badge">${conv.unread_count}</span>` : ''}
            </div>
          </div>
        `).join('');

        if (currentConversationUserId) {
          setSelectedConversation(currentConversationUserId);
        }
      } catch (error) {
        console.error('Error loading conversations:', error);
        setStatus('Failed to load conversations.', 'error');
      }
    }

    async function loadMessages(userId, userName) {
      currentConversationUserId = userId;
      currentConversationUserName = userName;
      setSelectedConversation(userId);
      
      setConversationHeader(userName, true);
      document.getElementById('messageInput').style.display = 'flex';
      
      try {
        const res = await fetch(`/api/messages/${userId}`);
        if (!res.ok) {
          throw new Error('Failed to fetch messages');
        }
        const messages = await res.json();
        
        const content = document.getElementById('messagesContent');
        
        if (messages.length === 0) {
          content.innerHTML = '<p class="no-messages">No messages yet. Start the conversation!</p>';
        } else {
          content.innerHTML = messages.map(msg => `
            <div class="message ${msg.sender_id === currentUserId ? 'sent' : 'received'}">
              <div class="message-sender">${msg.sender_name || msg.sender_email}</div>
              <div class="message-text">${msg.message}</div>
              <div class="message-meta-row">
                <div class="message-time">${new Date(msg.created_at).toLocaleString()}</div>
              </div>
            </div>
          `).join('');
          
          // Scroll to bottom
          content.scrollTop = content.scrollHeight;
        }
        
        // Reload conversations to update unread counts
        loadConversations();
      } catch (error) {
        console.error('Error loading messages:', error);
        setStatus('Failed to load messages.', 'error');
      }
    }

    async function sendMessage() {
      const messageText = document.getElementById('messageText').value.trim();
      
      if (!messageText || !currentConversationUserId) {
        return;
      }
      
      try {
        const res = await fetch('/api/messages/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            recipientId: currentConversationUserId,
            message: messageText
          })
        });
        
        if (res.ok) {
          document.getElementById('messageText').value = '';
          setStatus('Message sent.', 'success');
          loadMessages(currentConversationUserId, currentConversationUserName);
        } else {
          alert('Failed to send message');
        }
      } catch (error) {
        console.error('Error sending message:', error);
        alert('Failed to send message');
      }
    }

    async function deleteConversation() {
      if (!currentConversationUserId || !currentConversationUserName) {
        return;
      }

      if (!confirm(`Delete the entire conversation with ${currentConversationUserName}? This cannot be undone.`)) {
        return;
      }

      try {
        const res = await fetch(`/api/messages/conversations/${currentConversationUserId}`, {
          method: 'DELETE'
        });

        const payload = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(payload.error || 'Failed to delete conversation');
        }

        currentConversationUserId = null;
        currentConversationUserName = '';
        document.getElementById('messagesContent').innerHTML = '<p class="no-messages">Conversation deleted.</p>';
        document.getElementById('messageInput').style.display = 'none';
        setConversationHeader('', false);
        setStatus(`Deleted ${payload.deletedCount || 0} messages.`, 'success');
        loadConversations();
      } catch (error) {
        console.error('Error deleting conversation:', error);
        setStatus(error.message || 'Failed to delete conversation.', 'error');
      }
    }

    async function purgeMessages() {
      const days = Number(document.getElementById('retentionDays').value);
      const label = days === 0 ? 'all messages' : `messages older than ${days} days`;

      if (!confirm(`Purge ${label}? This cannot be undone.`)) {
        return;
      }

      try {
        const res = await fetch('/api/messages/purge', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ days })
        });

        const payload = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(payload.error || 'Failed to purge messages');
        }

        setStatus(`Purged ${payload.deletedCount || 0} messages.`, 'success');

        if (currentConversationUserId) {
          loadMessages(currentConversationUserId, currentConversationUserName);
        } else {
          loadConversations();
        }
      } catch (error) {
        console.error('Error purging messages:', error);
        setStatus(error.message || 'Failed to purge messages.', 'error');
      }
    }

    // Send message on Enter (Shift+Enter for new line)
    document.addEventListener('DOMContentLoaded', () => {
      const textarea = document.getElementById('messageText');
      if (textarea) {
        textarea.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
          }
        });
      }
    });

    init();
  </script>
</body>
</html>
