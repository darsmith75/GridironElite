<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Card</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
  <script src="/vendor/html2canvas.min.js"></script>
  <style>
    body {
      background: #000000;
      margin: 0;
      padding: 20px;
      font-family: 'Arial Black', Arial, sans-serif;
    }
    
    .card-container {
      max-width: 1200px;
      margin: 0 auto;
      background: url('/images/PlayerCardBackground.png') no-repeat center center;
      background-size: cover;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      position: relative;
    }
    
    .card-header {
      background: rgba(26, 41, 66, 0.65);
      padding: 30px 40px;
      color: white;
      position: relative;
    }
    
    .card-header h1 {
      margin: 0;
      font-family: 'Russo One', 'Arial Black', sans-serif;
      font-size: 52px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: white;
      text-shadow: 0 0 20px rgba(42, 82, 152, 0.8), 0 0 40px rgba(42, 82, 152, 0.4), 2px 2px 4px rgba(0,0,0,0.5);
      padding-bottom: 15px;
      border-bottom: 3px solid rgba(255,255,255,0.2);
    }
    
    .card-header .player-meta {
      margin-top: 12px;
      font-family: 'Oswald', 'Arial', sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.9;
      color: white;
    }
    
    .card-header .player-meta span {
      margin-right: 20px;
      color: white;
    }
    
    .card-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }
    
    .card-left {
      padding: 40px;
      background: rgba(26, 41, 66, 0.65);
    }
    
    .card-right {
      padding: 0;
      position: relative;
      background: rgba(26, 41, 66, 0.65);
      display: flex;
      flex-direction: column;
    }
    
    .card-right-content {
      padding: 40px;
    }
    
    .player-image-container {
      width: 100%;
      min-height: 500px;
      overflow: hidden;
      background-color: #0d1829;
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      border-radius: 10px;
    }
    
    .section-title {
      background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
      color: white;
      padding: 12px 20px;
      margin: 0 0 15px 0;
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      border-radius: 8px;
    }
    
    .card-right .section-title {
      margin: 0 0 15px 0;
    }
    
    .info-list {
      margin-bottom: 30px;
      padding: 0 20px;
    }
    
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    
    .info-row:last-child {
      border-bottom: none;
    }
    
    .info-label {
      font-size: 13px;
      color: #8899aa;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .info-value {
      font-size: 16px;
      color: white;
      font-weight: 900;
      text-align: right;
    }
    
    .college-offers {
      margin-bottom: 30px;
      padding: 0 20px;
    }
    
    .offers-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-top: 15px;
    }
    
    .offer-logo {
      background: white;
      padding: 10px;
      border-radius: 8px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .offer-logo img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    
    .additional-offers {
      margin-top: 15px;
      color: #8899aa;
      font-size: 13px;
      font-weight: 700;
    }
    
    .contact-section {
      padding: 0 20px 15px 20px;
    }
    
    .card-right .contact-section {
      padding: 0;
    }
    
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
    }
    
    .contact-item {
      color: white;
      font-size: 13px;
      line-height: 1.5;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    
    .contact-item:last-child {
      border-bottom: none;
    }
    
    .contact-item strong {
      color: #6b8cce;
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 3px;
    }
    
    .social-section {
      padding: 0 20px 20px 20px;
    }
    
    .social-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
    }
    
    .social-item {
      color: white;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    
    .social-item:last-child {
      border-bottom: none;
    }
    
    .social-item .social-logo {
      width: 20px;
      height: 20px;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }
    
    .social-item strong {
      color: #6b8cce;
      min-width: 80px;
    }
    
    .gpa-badge {
      background: #ffa500;
      color: #0a1628;
      padding: 12px 25px;
      text-align: center;
      margin: 15px auto;
      display: inline-block;
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(255,165,0,0.4);
    }
    
    .gpa-badge-wrapper {
      text-align: center;
    }
    
    .gpa-badge .label {
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .gpa-badge .value {
      font-size: 32px;
      font-weight: 900;
      line-height: 1;
      margin-top: 5px;
    }
    
    .gpa-badge .honors {
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      margin-top: 5px;
      letter-spacing: 0.5px;
    }
    
    .button-bar {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 1000;
    }
    
    .card-btn {
      padding: 10px 20px;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-family: 'Oswald', 'Arial', sans-serif;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .card-btn .btn-icon {
      font-size: 16px;
    }
    
    .btn-back {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      position: fixed;
      top: 20px;
      left: 20px;
    }
    
    .btn-back:hover {
      background: rgba(255,255,255,0.25);
      border-color: rgba(255,255,255,0.5);
      transform: translateX(-3px);
    }
    
    .btn-export {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      box-shadow: 0 4px 15px rgba(30, 60, 114, 0.4);
    }
    
    .btn-export:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(30, 60, 114, 0.6);
      background: linear-gradient(135deg, #2a5298 0%, #3a6cc8 100%);
    }
    
    .btn-export:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-email {
      background: linear-gradient(135deg, #0d6efd 0%, #0dcaf0 100%);
      box-shadow: 0 4px 15px rgba(13, 110, 253, 0.4);
    }

    .btn-email:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(13, 110, 253, 0.6);
      background: linear-gradient(135deg, #0d6efd 0%, #31d2f2 100%);
    }

    .btn-email:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .btn-preview {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
    }
    
    .btn-preview:hover {
      background: rgba(255,255,255,0.25);
      border-color: rgba(255,255,255,0.5);
      transform: translateY(-2px);
    }
    
    .preview-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .preview-modal-content {
      background: white;
      border-radius: 12px;
      max-width: 90%;
      max-height: 90%;
      overflow: auto;
    }
    
    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      border-bottom: 1px solid #e0e0e0;
    }
    
    .preview-header h3 {
      margin: 0;
      color: #333;
    }
    
    .close-preview {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #666;
      padding: 0;
      width: 30px;
      height: 30px;
    }
    
    .preview-body {
      padding: 20px;
      text-align: center;
    }
    
    .preview-footer {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      padding: 20px;
      border-top: 1px solid #e0e0e0;
    }
    
    .preview-cancel-btn {
      padding: 10px 20px;
      background: #f5f5f5;
      color: #333;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    
    .preview-export-btn {
      padding: 10px 20px;
      background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    @media (max-width: 1024px) {
      body {
        padding: 16px;
      }

      .card-header {
        padding: 24px 24px;
      }

      .card-header h1 {
        font-size: 38px;
        letter-spacing: 2px;
      }

      .card-body {
        grid-template-columns: 1fr;
      }

      .card-left,
      .card-right-content {
        padding: 24px;
      }

      .player-image-container {
        min-height: 340px;
      }

      .offers-grid {
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }
    }

    @media (max-width: 768px) {
      body {
        padding: 12px;
      }

      .btn-back {
        top: auto;
        bottom: 12px;
        left: 12px;
        z-index: 1200;
      }

      .button-bar {
        position: fixed;
        right: 12px;
        bottom: 12px;
        top: auto;
        gap: 8px;
        z-index: 1200;
      }

      .card-btn {
        padding: 9px 12px;
        font-size: 11px;
        letter-spacing: 0.8px;
        border-radius: 18px;
      }

      .card-btn .btn-icon {
        font-size: 13px;
      }

      .card-container {
        border-radius: 14px;
        margin-bottom: 70px;
      }

      .card-header {
        padding: 20px 16px;
      }

      .card-header h1 {
        font-size: 30px;
        letter-spacing: 1px;
        line-height: 1.15;
        word-break: break-word;
      }

      .card-header .player-meta {
        font-size: 12px;
        letter-spacing: 1px;
        line-height: 1.5;
      }

      .card-header .player-meta span {
        margin-right: 10px;
      }

      .card-left,
      .card-right-content {
        padding: 16px;
      }

      .section-title {
        padding: 10px 12px;
        font-size: 12px;
        letter-spacing: 1px;
      }

      .info-list,
      .college-offers,
      .social-section {
        padding: 0 8px;
        margin-bottom: 18px;
      }

      .info-row {
        padding: 9px 6px;
      }

      .info-label {
        font-size: 11px;
      }

      .info-value {
        font-size: 14px;
      }

      .offers-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }

      .offer-logo {
        padding: 8px;
        height: 54px;
      }

      .player-image-container {
        min-height: 280px;
      }

      .gpa-badge {
        padding: 10px 16px;
      }

      .gpa-badge .value {
        font-size: 26px;
      }

      .contact-item,
      .social-item {
        font-size: 12px;
      }

      .social-item strong {
        min-width: 70px;
      }

      .preview-modal-content {
        width: calc(100% - 16px);
        max-width: none;
      }

      .preview-header,
      .preview-body,
      .preview-footer {
        padding: 14px;
      }

      .preview-footer {
        justify-content: stretch;
      }

      .preview-cancel-btn,
      .preview-export-btn {
        flex: 1;
      }
    }

    @media (max-width: 480px) {
      .card-header h1 {
        font-size: 25px;
      }

      .card-header .player-meta {
        font-size: 11px;
      }

      .offers-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .player-image-container {
        min-height: 240px;
      }

      .btn-back {
        max-width: 42vw;
      }

      .button-bar {
        max-width: 56vw;
      }

      .card-btn {
        padding: 8px 10px;
      }
    }
    
    @media print {
      body {
        background: white;
      }
      .btn-back,
      .button-bar {
        display: none;
      }
      .card-container {
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <button onclick="goBack()" class="card-btn btn-back"><span class="btn-icon">←</span> Back</button>
  <div class="button-bar">
    <button onclick="openPreviewImage()" class="card-btn btn-preview" id="previewBtn"><span class="btn-icon">👁</span> Preview</button>
    <button onclick="exportAsImage()" class="card-btn btn-export" id="exportBtn"><span class="btn-icon">📸</span> Export</button>

  <!-- Preview Modal -->

    <div class="preview-modal-content">

      </div>
      <div class="preview-body">

      </div>
      <div class="preview-footer">
        <button onclick="closePreview()" class="preview-cancel-btn">Close</button>

  <div class="card-container" id="playerCard">

              <div class="label">GPA</div>

  <script src="app.js"></script>
  <script>
    // Check authentication - allow both agents and players
    let previewObjectUrl = null;
    let html2canvasLoadPromise = null;

    function loadExternalScript(url) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = url;
        script.async = true;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error('Failed to load script: ' + url));
        document.head.appendChild(script);
      });
    }

    async function ensureHtml2CanvasLoaded() {
      if (typeof html2canvas === 'function') return;

      if (!html2canvasLoadPromise) {
        html2canvasLoadPromise = (async () => {
          const fallbackUrls = [
            '/vendor/html2canvas.min.js',
            'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
            'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js',
            'https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js'
          ];

          let lastError = null;
          for (const url of fallbackUrls) {
            try {
              await loadExternalScript(url);
              if (typeof html2canvas === 'function') return;
            } catch (error) {
              lastError = error;
            }
          }

          throw lastError || new Error('html2canvas load failed');
        })().finally(() => {
          if (typeof html2canvas !== 'function') {
            html2canvasLoadPromise = null;
          }
        });
      }

      await html2canvasLoadPromise;
      if (typeof html2canvas !== 'function') {
        throw new Error('html2canvas is unavailable');
      }
    }

    fetch('/api/user')
      .then(res => {
        if (!res.ok) {
          window.location.href = '/';
          throw new Error('Not authenticated');
        }
        return res.json();
      })
      .then(user => {
        const urlParams = new URLSearchParams(window.location.search);
        const playerId = urlParams.get('id');
        
        // If no ID provided and user is an agent, redirect to dashboard
        if (!playerId && user.role === 'agent') {
          window.location.href = 'agent-dashboard.html';
          return;
        }
        
        // Load the card
        loadPlayerCard(playerId);
      })
      .catch(() => {
        // Authentication failed, redirect handled above
      });
    
    function goBack() {
      const urlParams = new URLSearchParams(window.location.search);
      const playerId = urlParams.get('id');
      
      if (playerId) {
        window.location.href = `player-detail.html?id=${playerId}`;
      } else {
        window.location.href = 'player-profile.html';
      }
    }

    function formatHeightDisplay(heightValue) {
      const raw = String(heightValue || '').trim();
      if (!raw) return '';

      let m = raw.match(/^(\d+)\s*'\s*(\d+(?:\.\d+)?)?\s*"?$/);
      if (m) {
        const feet = Number(m[1] || '0');
        const inches = Number(m[2] || '0');
        if (!Number.isFinite(feet) || !Number.isFinite(inches)) return raw;
        const inchesText = Number.isInteger(inches) ? String(inches) : String(Number(inches.toFixed(1)));
        return `${feet}'${inchesText}"`;
      }

      m = raw.match(/^(\d+)\s*(?:ft|feet)\s*(\d+(?:\.\d+)?)?\s*(?:in|inches)?$/i);
      if (m) {
        const feet = Number(m[1] || '0');
        const inches = Number(m[2] || '0');
        if (!Number.isFinite(feet) || !Number.isFinite(inches)) return raw;
        const inchesText = Number.isInteger(inches) ? String(inches) : String(Number(inches.toFixed(1)));
        return `${feet}'${inchesText}"`;
      }

      const numeric = Number(raw);
      if (Number.isFinite(numeric) && numeric > 0) {
        const feet = Math.floor(numeric / 12);
        const inches = Number((numeric - (feet * 12)).toFixed(1));
        const inchesText = Number.isInteger(inches) ? String(inches) : String(inches);
        return `${feet}'${inchesText}"`;
      }

      return raw;
    }

    function formatInchesAsFeetAndInches(totalInchesValue) {
      const total = Number(totalInchesValue);
      if (!Number.isFinite(total) || total <= 0) return '';
      const feet = Math.floor(total / 12);
      const inches = Number((total - (feet * 12)).toFixed(1));
      const inchesText = Number.isInteger(inches) ? String(inches) : String(inches);
      return `${feet}'${inchesText}"`;
    }
    
    let currentPlayerData = null;
    
    async function loadPlayerCard(playerId) {
      // Fetch player data - use different endpoint based on whether viewing own card or another player's
      let res;
      if (playerId) {
        // Agent viewing a specific player
        res = await fetch(`/api/agent/player/${playerId}`);
      } else {
        // Player viewing their own card
        res = await fetch('/api/player/profile');
      }
      
      if (!res.ok) {
        alert('Player not found');
        goBack();
        return;
      }
      
      const player = await res.json();
      currentPlayerData = player;
      
      // Header

      document.getElementById('playerYear').textContent = player.graduation_year || '—';

      document.getElementById('playerSchool').textContent = player.high_school || '—';
      
      // Verified Measurables - only show rows that have data
      const hasMetricValue = (value) => value !== null && value !== undefined && String(value).trim() !== '';

      const measurableFields = [
        { label: '40-Yard Dash', rawValue: player.forty_yard_dash, value: String(player.forty_yard_dash || '') },
        { label: '5-10-5 Shuttle', rawValue: player.shuttle_5_10_5, value: String(player.shuttle_5_10_5 || '') },
        { label: 'L-Drill', rawValue: player.l_drill, value: String(player.l_drill || '') },

        { label: 'Vertical', rawValue: player.vertical_jump, value: hasMetricValue(player.vertical_jump) ? `${player.vertical_jump}"` : '' },
        { label: 'Bench Press', rawValue: player.bench_press, value: hasMetricValue(player.bench_press) ? `${player.bench_press} lbs` : '' },
        { label: 'Squat', rawValue: player.squat, value: hasMetricValue(player.squat) ? `${player.squat} lbs` : '' },
        { label: 'Power Clean', rawValue: player.power_clean, value: hasMetricValue(player.power_clean) ? `${player.power_clean} lbs` : '' },
        { label: 'Single Leg Squat', rawValue: player.single_leg_squat, value: hasMetricValue(player.single_leg_squat) ? `${player.single_leg_squat} lbs` : '' },
        { label: 'Catapult', rawValue: player.catapult, value: String(player.catapult || '') },
        { label: '1080', rawValue: player.metric_1080, value: String(player.metric_1080 || '') },
        { label: 'Hand Size', rawValue: player.hand_size, value: hasMetricValue(player.hand_size) ? `${player.hand_size}"` : '' },
        { label: 'Wingspan', rawValue: player.wingspan, value: hasMetricValue(player.wingspan) ? `${player.wingspan}"` : '' }
      ].filter((field) => hasMetricValue(field.rawValue));

      let metricsHTML = '';

        const offers = applySavedCollegeOrder('offers', offersRaw);
        if (offers.length > 0) {
          document.getElementById('offersSection').style.display = 'block';
          let offersHTML = '';

          }

          if (offers.length > 12) {
            document.getElementById('additionalOffers').innerHTML = `<strong>ADDITIONAL OFFERS:</strong> +${offers.length - 12} more`;
          }
        }
      }
      
      // Contact Info - always show all fields
      let contactHTML = '';
      const athleteDetails = [];
      if (player.email) athleteDetails.push(player.email);
      if (player.phone) athleteDetails.push(player.phone);
      contactHTML += `<div class="contact-item"><strong>Athlete</strong>${athleteDetails.length ? athleteDetails.join(' | ') : '—'}</div>`;
      
      const fatherName = player.father_name || '—';
      const fatherDetails = [];
      if (player.father_email) fatherDetails.push(player.father_email);
      if (player.father_phone) fatherDetails.push(player.father_phone);
      contactHTML += `<div class="contact-item"><strong>Father – ${fatherName}</strong>${fatherDetails.length ? fatherDetails.join(' | ') : '—'}</div>`;
      
      const motherName = player.mother_name || '—';
      const motherDetails = [];
      if (player.mother_email) motherDetails.push(player.mother_email);
      if (player.mother_phone) motherDetails.push(player.mother_phone);
      contactHTML += `<div class="contact-item"><strong>Mother – ${motherName}</strong>${motherDetails.length ? motherDetails.join(' | ') : '—'}</div>`;
      
      const coachName = player.coach_name || '—';
      const coachDetails = [];
      if (player.coach_email) coachDetails.push(player.coach_email);
      if (player.coach_phone) coachDetails.push(player.coach_phone);
      contactHTML += `<div class="contact-item"><strong>Head Coach – ${coachName}</strong>${coachDetails.length ? coachDetails.join(' | ') : '—'}</div>`;
      document.getElementById('contactInfo').innerHTML = contactHTML;
      
      // Social Media - always show all fields
      let socialHTML = '';
      socialHTML += `<div class="social-item"><img src="/images/logos/Hudl_logo.png" alt="Hudl" class="social-logo"><strong>Hudl:</strong> ${player.hudl_username || '—'}</div>`;
      socialHTML += `<div class="social-item"><img src="/images/logos/Instagram_logo.png" alt="Instagram" class="social-logo"><strong>Instagram:</strong> ${player.instagram_username || '—'}</div>`;
      socialHTML += `<div class="social-item"><img src="/images/logos/X_logo.png" alt="X" class="social-logo"><strong>Twitter:</strong> ${player.twitter_username || '—'}</div>`;
      document.getElementById('socialInfo').innerHTML = socialHTML;
      
      // Player Image - use card_photo if available, otherwise fall back to profile_picture
      const photoToUse = player.card_photo || player.profile_picture;
      const playerImgContainer = document.getElementById('playerImageContainer');
      const silhouetteUrl = '/images/silhouette-avatar.svg';
      if (photoToUse) {
        const imgUrl = `/api/upload-proxy?path=${encodeURIComponent(photoToUse)}`;
        playerImgContainer.style.backgroundImage = `url('${imgUrl}')`;
        
        // Detect aspect ratio to choose sizing mode; fall back to silhouette on error
        const testImg = new Image();
        testImg.onload = function() {
          const aspectRatio = this.naturalWidth / this.naturalHeight;
          if (aspectRatio > 1.5 || aspectRatio < 0.6) {
            playerImgContainer.style.backgroundSize = 'contain';
            playerImgContainer.style.backgroundPosition = 'center';
          }
        };
        testImg.onerror = function() {
          playerImgContainer.style.backgroundImage = `url('${silhouetteUrl}')`;
          playerImgContainer.style.backgroundSize = 'contain';
          playerImgContainer.style.backgroundPosition = 'center';

        const gpa = parseFloat(player.gpa);
        if (gpa >= 3.5) {
          document.querySelector('.gpa-badge .honors').textContent = 'HIGH HONORS';
        } else if (gpa >= 3.0) {
          document.querySelector('.gpa-badge .honors').textContent = 'HONORS';
        } else {
          document.querySelector('.gpa-badge .honors').textContent = '';
        }
      } else {
        document.getElementById('gpaValue').textContent = '—';
        document.querySelector('.gpa-badge .honors').textContent = '';
      }
    }
    
    async function dataUrlToBlob(dataUrl) {
      const response = await fetch(dataUrl);
      if (!response.ok) {
        throw new Error('Invalid data URL');
      }
      return response.blob();
    }

    function canvasToBlob(canvas) {
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (blob) {
            resolve(blob);
            return;
          }

          // Some browsers can return null from toBlob for large canvases; fall back to data URL conversion.
          try {
            const dataUrl = canvas.toDataURL('image/png');
            dataUrlToBlob(dataUrl)
              .then(resolve)
              .catch(() => reject(new Error('Unable to create image blob from canvas')));
          } catch (fallbackError) {
            reject(new Error('Unable to create image blob from canvas'));
          }
        }, 'image/png');
      });
    }

      function applyExportBottomBlend(canvas, cssContentHeight, exportWidth) {
        const ctx = canvas.getContext('2d');
        if (!ctx) return canvas;

        const scaleRatio = canvas.width / exportWidth;
        const contentBottom = Math.min(canvas.height, Math.round(cssContentHeight * scaleRatio));
        const remaining = canvas.height - contentBottom;
        if (remaining <= 0) return canvas;

        const fadeHeight = Math.min(Math.round(140 * scaleRatio), remaining + Math.round(24 * scaleRatio));
        const fadeTop = Math.max(0, contentBottom - fadeHeight);

        const gradient = ctx.createLinearGradient(0, fadeTop, 0, canvas.height);
        gradient.addColorStop(0, 'rgba(10,22,40,0)');
        gradient.addColorStop(0.45, 'rgba(10,22,40,0.18)');
        gradient.addColorStop(1, 'rgba(10,22,40,0.38)');

        ctx.fillStyle = gradient;
        ctx.fillRect(0, fadeTop, canvas.width, canvas.height - fadeTop);
        return canvas;
      }

    // College Logo Ordering - Helper Functions
    function getCollegeLogoOrderStorageKey() {
      const userId = window.currentUser && window.currentUser.id ? String(window.currentUser.id) : 'unknown';
      return `playerCollegeLogoOrder:${userId}`;
    }

    function loadCollegeLogoOrderState() {
      try {
        const raw = localStorage.getItem(getCollegeLogoOrderStorageKey());
        if (!raw) return {};
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === 'object' ? parsed : {};
      } catch (_) {
        return {};
      }
    }

    function applySavedCollegeOrder(group, schools) {
      if (!Array.isArray(schools) || schools.length === 0) return Array.isArray(schools) ? schools : [];
      
      // Get order from server (currentPlayerData.college_logo_order)
      let orderState = {};
      if (currentPlayerData && currentPlayerData.college_logo_order) {
        try {
          if (typeof currentPlayerData.college_logo_order === 'string') {
            const parsed = JSON.parse(currentPlayerData.college_logo_order);
            orderState = parsed && typeof parsed === 'object' ? parsed : {};
          } else {
            orderState = currentPlayerData.college_logo_order;
          }
        } catch (err) {
          console.warn('Failed to parse college_logo_order:', err);
          orderState = {};
        }
      }
      
      if (!orderState || typeof orderState !== 'object') orderState = {};
      
      const ids = Array.isArray(orderState[group]) ? orderState[group].map(id => Number(id)) : [];
      if (ids.length === 0) return schools;

      const indexMap = new Map(ids.map((id, index) => [id, index]));
      return [...schools].sort((a, b) => {
        const ai = indexMap.has(Number(a.id)) ? indexMap.get(Number(a.id)) : Number.MAX_SAFE_INTEGER;
        const bi = indexMap.has(Number(b.id)) ? indexMap.get(Number(b.id)) : Number.MAX_SAFE_INTEGER;
        if (ai !== bi) return ai - bi;
        return String(a.name || '').localeCompare(String(b.name || ''));
      });
    }

    async function renderPlayerCardCanvas() {
      const cardElement = document.getElementById('playerCard');
      await ensureHtml2CanvasLoaded();

      if (document.fonts && document.fonts.ready) {
        try { await document.fonts.ready; } catch (_) {}
      }

      const EXPORT_CARD_WIDTH = 1080;
      const EXPORT_CARD_HEIGHT = 1350;

      const attempts = [
        { scale: 2, removePlayerImage: false },
        { scale: 1.5, removePlayerImage: true },
        { scale: 1, removePlayerImage: true }
      ];

      let lastError = null;

      for (const attempt of attempts) {
        const exportRoot = document.createElement('div');
        exportRoot.style.position = 'fixed';
        exportRoot.style.left = '-100000px';
        exportRoot.style.top = '0';
        exportRoot.style.width = `${EXPORT_CARD_WIDTH}px`;
        exportRoot.style.height = `${EXPORT_CARD_HEIGHT}px`;
        exportRoot.style.overflow = 'hidden';
        exportRoot.style.pointerEvents = 'none';
        exportRoot.style.zIndex = '-1';
        exportRoot.style.display = 'flex';
        exportRoot.style.justifyContent = 'center';
        exportRoot.style.alignItems = 'flex-start';
        exportRoot.style.backgroundColor = '#0a1628';
        exportRoot.style.backgroundImage = "url('/images/PlayerCardBackground.png')";
        exportRoot.style.backgroundRepeat = 'no-repeat';
        exportRoot.style.backgroundPosition = 'center top';
        exportRoot.style.backgroundSize = 'cover';

        const clonedCard = cardElement.cloneNode(true);
        clonedCard.id = 'playerCardExportClone';
        clonedCard.style.width = `${EXPORT_CARD_WIDTH}px`;
        clonedCard.style.height = 'auto';
        clonedCard.style.minHeight = `${EXPORT_CARD_HEIGHT}px`;
        clonedCard.style.maxWidth = 'none';
        clonedCard.style.margin = '0';
        clonedCard.style.boxShadow = 'none';
        clonedCard.style.display = 'flex';
        clonedCard.style.flexDirection = 'column';

        exportRoot.appendChild(clonedCard);
        document.body.appendChild(exportRoot);

        try {
          const renderedCardHeight = Math.min(
            EXPORT_CARD_HEIGHT,
            Math.ceil(clonedCard.getBoundingClientRect().height)
          );

          const canvas = await html2canvas(exportRoot, {
            backgroundColor: '#0a1628',
            scale: attempt.scale,
            logging: false,
            useCORS: true,
            allowTaint: false,
            imageTimeout: 15000,
            width: EXPORT_CARD_WIDTH,
            height: EXPORT_CARD_HEIGHT,
            windowWidth: EXPORT_CARD_WIDTH,
            windowHeight: EXPORT_CARD_HEIGHT,
            scrollX: 0,
            scrollY: 0,
            onclone: (clonedDoc) => {
              const clonedExportCard = clonedDoc.getElementById('playerCardExportClone');
              if (clonedExportCard) {
                clonedExportCard.style.margin = '0';
                clonedExportCard.style.height = 'auto';
                clonedExportCard.style.minHeight = `${EXPORT_CARD_HEIGHT}px`;
                clonedExportCard.style.boxShadow = 'none';
                clonedExportCard.style.display = 'flex';
                clonedExportCard.style.flexDirection = 'column';
              }

              const clonedExportBody = clonedDoc.querySelector('#playerCardExportClone .card-body');
              if (clonedExportBody) {
                clonedExportBody.style.flex = '1';
                clonedExportBody.style.alignItems = 'stretch';
              }

              const clonedExportLeft = clonedDoc.querySelector('#playerCardExportClone .card-left');
              if (clonedExportLeft) {
                clonedExportLeft.style.height = '100%';
              }

              const clonedExportRight = clonedDoc.querySelector('#playerCardExportClone .card-right');
              if (clonedExportRight) {
                clonedExportRight.style.height = '100%';
              }

              const clonedImageContainer = clonedDoc.querySelector('#playerCardExportClone #playerImageContainer');
              if (attempt.removePlayerImage && clonedImageContainer) {
                clonedImageContainer.style.backgroundImage = 'none';
              }
            }
          });

          document.body.removeChild(exportRoot);
          return applyExportBottomBlend(canvas, renderedCardHeight, EXPORT_CARD_WIDTH);
        } catch (error) {
          lastError = error;
          console.warn(`Player card render failed at scale ${attempt.scale} (removePlayerImage=${attempt.removePlayerImage})`, error);
          document.body.removeChild(exportRoot);
        }
      }

      throw lastError || new Error('Unable to render player card');
    }

    // Export player card as image
    async function exportAsImage() {
      const button = document.getElementById('exportBtn');
      const originalText = button.textContent;
      
      try {
        // Disable button and show loading state
        button.disabled = true;
        button.textContent = '⏳ Generating...';
        const canvas = await renderPlayerCardCanvas();
        const blob = await canvasToBlob(canvas);
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        
        // Get player name for filename
        const playerName = document.getElementById('playerName').textContent.replace(/\s+/g, '_');
        a.download = `${playerName}_Player_Card.png`;
        
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        // Reset button
        button.disabled = false;
        button.textContent = originalText;
        
      } catch (error) {
        console.error('Error exporting image:', error);
        if (error && String(error.message || '').includes('html2canvas is unavailable')) {
          alert('Export is unavailable because the image rendering library did not load. Please refresh and try again.');
        } else {
          const reason = error && error.message ? `\n\nDetails: ${error.message}` : '';
          alert(`Failed to export image. Please try again.${reason}`);
        }
        button.disabled = false;
        button.textContent = originalText;
      }
    }
    
    // Preview the image before exporting
    async function openPreviewImage() {
      const button = document.getElementById('previewBtn');
      const originalText = button.textContent;
      
      try {
        button.disabled = true;
        button.textContent = '⏳ Generating Preview...';
        const canvas = await renderPlayerCardCanvas();

        const blob = await canvasToBlob(canvas);
        if (previewObjectUrl) {
          URL.revokeObjectURL(previewObjectUrl);
        }
        previewObjectUrl = URL.createObjectURL(blob);
        document.getElementById('previewImage').src = previewObjectUrl;
        document.getElementById('previewModal').style.display = 'flex';
        
        button.disabled = false;
        button.textContent = originalText;
        
      } catch (error) {
        console.error('Error generating preview:', error);
        if (error && String(error.message || '').includes('html2canvas is unavailable')) {
          alert('Preview is unavailable because the image rendering library did not load. Please refresh and try again.');
        } else {
          const reason = error && error.message ? `\n\nDetails: ${error.message}` : '';
          alert(`Failed to generate preview. Please try again.${reason}`);
        }
        button.disabled = false;
        button.textContent = originalText;
      }
    }
    
    function closePreview() {
      document.getElementById('previewModal').style.display = 'none';
      if (previewObjectUrl) {
        URL.revokeObjectURL(previewObjectUrl);
        previewObjectUrl = null;
      }
      document.getElementById('previewImage').src = '';
    }
    
    function openEmailModal() {
      const playerName = document.getElementById('playerName').textContent;
      document.getElementById('emailSubject').value = `${playerName} - Player Card`;
      document.getElementById('emailMessage').value = `Please see ${playerName}'s player card.`;
      document.getElementById('emailTo').value = '';
      document.getElementById('emailModal').style.display = 'flex';
      document.getElementById('emailTo').focus();
    }

    function closeEmailModal() {
      document.getElementById('emailModal').style.display = 'none';
    }

    async function sendPlayerCardEmail() {
      const recipientEmail = document.getElementById('emailTo').value.trim();
      const subject = document.getElementById('emailSubject').value.trim();
      const message = document.getElementById('emailMessage').value.trim();
      const btn = document.getElementById('sendEmailBtn');

      if (!recipientEmail) {
        alert('Please enter a recipient email address.');
        return;
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(recipientEmail)) {
        alert('Please enter a valid recipient email address.');
        return;
      }

      try {
        btn.disabled = true;
        btn.textContent = '⏳ Opening...';

        const playerName = document.getElementById('playerName').textContent || 'Player';
        const playerCardUrl = `${window.location.origin}${window.location.pathname}${window.location.search}`;
        const bodyLines = [
          message || `Please see ${playerName}'s player card details below.`,
          '',
          `Player Card: ${playerCardUrl}`,
          '',
          'Tip: Use the Export button on the card page to download the image and attach it in your email client.'
        ];

        const mailto = `mailto:${encodeURIComponent(recipientEmail)}?subject=${encodeURIComponent(subject || `${playerName} - Player Card`)}&body=${encodeURIComponent(bodyLines.join('\n'))}`;
        window.location.href = mailto;
        closeEmailModal();
      } catch (error) {
        console.error('Error opening mail client:', error);
        alert('Unable to open your email client. Please try again.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Open Email Draft';
      }
    }

    function exportFromPreview() {
      const previewExportBtn = document.getElementById('previewExportBtn');
      const originalText = previewExportBtn ? previewExportBtn.textContent : '';
      const playerName = document.getElementById('playerName').textContent.replace(/\s+/g, '_');

      const downloadFromUrl = (url) => {
        const a = document.createElement('a');
        a.href = url;
        a.download = `${playerName}_Player_Card.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };

      (async () => {
        try {
          if (previewExportBtn) {
            previewExportBtn.disabled = true;
            previewExportBtn.textContent = '⏳ Exporting...';
          }

          if (previewObjectUrl) {
            downloadFromUrl(previewObjectUrl);
            // Give mobile browsers a moment to process download before revoking the preview URL.
            setTimeout(() => closePreview(), 300);
            return;
          }

          // Fallback: regenerate if preview blob URL is missing.
          const canvas = await renderPlayerCardCanvas();
          const blob = await canvasToBlob(canvas);
          const tempUrl = URL.createObjectURL(blob);
          downloadFromUrl(tempUrl);
          setTimeout(() => {
            URL.revokeObjectURL(tempUrl);
            closePreview();
          }, 300);
        } catch (error) {
          console.error('Error exporting from preview:', error);
          alert('Failed to export this image. Please try again.');
        } finally {
          if (previewExportBtn) {
            previewExportBtn.disabled = false;
            previewExportBtn.textContent = originalText || 'Export This Image';
          }
        }
      })();
    }
